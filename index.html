<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#050816,#0b1220);
      color:white;
    }

    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      background:#0f172a;
    }

    .logo{
      font-size:20px;
      font-weight:bold;
      color:#38bdf8;
    }

    .social button{
      margin-left:10px;
      padding:10px 14px;
      border-radius:8px;
      border:none;
      font-weight:bold;
      cursor:pointer;
    }

    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}

    .container{
      max-width:1000px;
      margin:auto;
      padding:15px;
    }

    .hero{
      text-align:center;
      padding:25px;
    }

    .hero h1{
      font-size:28px;
      color:#38bdf8;
    }

    .card{
      background:#111827;
      padding:20px;
      margin-top:15px;
      border-radius:15px;
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}

    .resume-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:12px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    @media(max-width:768px){
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>

  <div class="social">
    <a href="https://www.google.com/search?q=jobs" target="_blank">
      <button class="google">Google</button>
    </a>
    <a href="https://www.linkedin.com/jobs/" target="_blank">
      <button class="linkedin">LinkedIn</button>
    </a>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1>Create Professional Resume in Seconds</h1>
  </div>

  <!-- PREMIUM -->
  <div class="card">
    <h2>💎 Unlock Premium ₹200</h2>
    <p>Enable AI + Export Features</p>

    <img width="200"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=yourupi@bank&pn=AOV%20AI&am=200&cu=INR">

    <input id="txn" placeholder="Enter Payment ID / Email">
    <button onclick="verifyPayment()">Activate Premium</button>
  </div>

  <!-- BUILDER -->
  <div class="card">
    <h2>Resume Builder</h2>

    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="age" placeholder="Age">
      <input id="qualification" placeholder="Qualification">
      <input id="experience" placeholder="Experience">
    </div>

    <input id="skills" placeholder="Skills">
    <input id="hobbies" placeholder="Hobbies">
    <input id="about" placeholder="About You">

    <input type="file" id="photoUpload">

    <input id="declaration" placeholder="Declaration">
    <input id="signature" placeholder="Signature">

    <button onclick="generate()">Generate Resume</button>
    <button onclick="askAI()">AI Improve Resume</button>
    <button onclick="downloadPDF()">Download PDF</button>
    <button onclick="downloadImage()">Download Image</button>
    <button onclick="downloadEuroPlusCV()">Europlus CV</button>
    <button class="btn-clear" onclick="clearData()">Clear Data</button>
  </div>

  <!-- OUTPUT -->
  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<script>

let photoData = "";
let isPremium = localStorage.getItem("premium") === "yes";

/* PAYMENT */
function verifyPayment(){
  if(!txn.value){
    alert("Enter Payment ID");
    return;
  }
  localStorage.setItem("premium","yes");
  isPremium = true;
  alert("Premium Activated ✔");
}

/* PHOTO */
photoUpload.onchange = e=>{
  const r = new FileReader();
  r.onload = ()=> photoData = r.result;
  if(e.target.files[0]) r.readAsDataURL(e.target.files[0]);
};

/* ATS */
function getATS(text){
  let s = 0;
  ["skills","experience","project","lead","manage","develop"].forEach(k=>{
    if(text.toLowerCase().includes(k)) s += 10;
  });
  return Math.min(s,100);
}

/* JOB MATCH */
function getJobs(skills){
  let s = skills.toLowerCase();
  let j = [];

  if(s.includes("dev")) j.push("Software Developer");
  if(s.includes("market")) j.push("Marketing Executive");
  if(s.includes("sales")) j.push("Sales Executive");
  if(s.includes("chef")) j.push("Chef");
  if(s.includes("design")) j.push("UI/UX Designer");

  if(j.length === 0) j.push("Improve Skills");

  return j.join(", ");
}

/* AI SUGGESTION */
function askAI(){
  if(!isPremium){
    alert("Premium required");
    return;
  }

  alert(
    "AI Suggestions:\n\n" +
    "• Add achievements with numbers\n" +
    "• Use strong action verbs\n" +
    "• Add projects section\n" +
    "• Improve skills clarity"
  );
}

/* DRAG FIXED SYSTEM */
let selected = null;

document.addEventListener("mousedown",(e)=>{
  const box = e.target.closest(".resume-box");
  if(box){
    selected = box;
  }
});

document.addEventListener("mouseup",(e)=>{
  const box = e.target.closest(".resume-box");
  if(selected && box && selected !== box){
    box.after(selected);
  }
  selected = null;
});

/* GENERATE */
function generate(){

  let text = name.value + skills.value + experience.value + about.value;

  let ats = getATS(text);
  let jobs = getJobs(skills.value);

  document.getElementById("resume").innerHTML = `
    <div class="resume-box" id="resumeBox">

      <center>
        ${photoData ? `<img src="${photoData}" width="100" style="border-radius:50%">` : ""}
        <h2>${name.value}</h2>
        <p>${qualification.value}</p>
      </center>

      <hr>

      <p><b>Experience:</b> ${experience.value}</p>
      <p><b>Skills:</b> ${skills.value}</p>
      <p><b>Hobbies:</b> ${hobbies.value}</p>

      <h3>About</h3>
      <p>${about.value}</p>

      <hr>

      <p><b>Declaration:</b> ${declaration.value}</p>
      <p><b>Signature:</b> ${signature.value}</p>

      <hr>

      <h3>🔥 ATS SCORE: ${ats}/100</h3>
      <p><b>🎯 Job Match:</b> ${jobs}</p>

    </div>
  `;
}

/* PDF */
function downloadPDF(){
  if(!isPremium){
    alert("Premium required");
    return;
  }

  const el = document.getElementById("resumeBox");
  if(!el){
    alert("Generate resume first");
    return;
  }

  html2pdf().from(el).save("resume.pdf");
}

/* IMAGE */
function downloadImage(){
  if(!isPremium){
    alert("Premium required");
    return;
  }

  const el = document.getElementById("resumeBox");
  if(!el){
    alert("Generate resume first");
    return;
  }

  html2canvas(el).then(c=>{
    let a = document.createElement("a");
    a.download = "resume.png";
    a.href = c.toDataURL();
    a.click();
  });
}

/* EUROPLUS CV */
function downloadEuroPlusCV(){
  if(!isPremium){
    alert("Premium required");
    return;
  }

  const cv = `
EUROPLUS CV

Name: ${name.value}
Age: ${age.value}
Qualification: ${qualification.value}

Experience:
${experience.value}

Skills:
${skills.value}

Hobbies:
${hobbies.value}

About:
${about.value}

Date: ${new Date().toLocaleDateString()}
`;

  const blob = new Blob([cv],{type:"text/plain"});
  const a = document.createElement("a");
  a.download = "Europlus_CV.txt";
  a.href = URL.createObjectURL(blob);
  a.click();
}

/* CLEAR */
function clearData(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  document.getElementById("resume").innerHTML="";
}

</script>

</body>
</html>
