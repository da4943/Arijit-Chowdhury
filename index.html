<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#050816,#0b1220);
      color:white;
    }

    /* TOP NAV */
    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      background:#0f172a;
      position:sticky;
      top:0;
    }

    .logo{
      font-size:20px;
      font-weight:bold;
      color:#38bdf8;
    }

    .social button{
      margin-left:10px;
      padding:10px 14px;
      border-radius:8px;
      border:none;
      font-weight:bold;
      cursor:pointer;
    }

    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}

    /* MAIN CONTAINER */
    .container{
      max-width:1000px;
      margin:auto;
      padding:15px;
    }

    /* HERO */
    .hero{
      text-align:center;
      padding:25px;
    }

    .hero h1{
      font-size:28px;
      color:#38bdf8;
    }

    .hero p{
      opacity:0.8;
    }

    /* CARD */
    .card{
      background:#111827;
      padding:20px;
      margin-top:15px;
      border-radius:15px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      font-size:15px;
      box-sizing:border-box;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#0ea5e9;
      transform:scale(1.02);
    }

    /* PREMIUM */
    .premium{
      text-align:center;
      background:linear-gradient(45deg,#ffcc00,#ff8800);
      color:black;
      padding:25px;
      border-radius:15px;
    }

    .premium h2{
      font-size:24px;
    }

    .qr{
      margin-top:10px;
      width:220px;
      height:220px;
      border-radius:12px;
      background:white;
      padding:10px;
    }

    /* RESUME */
    .resume-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:12px;
    }

    /* GRID */
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    @media(max-width:768px){
      .grid{
        grid-template-columns:1fr;
      }

      .hero h1{
        font-size:22px;
      }
    }
  </style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="logo">AOV AI Resume</div>

  <div class="social">
    <button class="google">Google</button>
    <button class="linkedin">LinkedIn</button>
  </div>
</div>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <h1>Create Professional Resume in Seconds</h1>
    <p>AI style resume builder • Free + Premium tools</p>
  </div>

  <!-- PREMIUM -->
  <div class="card premium">
    <h2>💎 Premium Unlock ₹200</h2>
    <p>Get Pro Templates + PDF HD Export</p>

    <img class="qr"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=yourupi@bank&pn=AOV%20AI&am=200&cu=INR"
    />

    <p>Scan to Pay</p>
  </div>

  <!-- FORM -->
  <div class="card">

    <h2>Resume Builder</h2>

    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="age" placeholder="Age">
      <input id="qualification" placeholder="Qualification">
      <input id="experience" placeholder="Experience">
    </div>

    <input id="skills" placeholder="Skills">
    <input id="about" placeholder="About You">
    <input id="photo" placeholder="Photo URL">
    <input id="declaration" placeholder="Declaration">
    <input id="signature" placeholder="Signature">

    <button onclick="generate()">Generate Resume</button>
    <button onclick="downloadPDF()">Download PDF</button>
  </div>

  <!-- OUTPUT -->
  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<script>

/* GENERATE */
function generate(){

  document.getElementById("resume").innerHTML = `
    <div class="resume-box" id="resumeBox">

      <center>
        <img src="${photo.value}" width="100" style="border-radius:50%">
        <h2>${name.value}</h2>
      </center>

      <p><b>Age:</b> ${age.value}</p>
      <p><b>Qualification:</b> ${qualification.value}</p>
      <p><b>Experience:</b> ${experience.value}</p>
      <p><b>Skills:</b> ${skills.value}</p>
      <p><b>About:</b> ${about.value}</p>

      <hr>

      <p><b>Declaration:</b> ${declaration.value}</p>
      <p><b>Signature:</b> ${signature.value}</p>
      <p><b>Date:</b> ${new Date().toLocaleDateString()}</p>

    </div>
  `;
}

/* PDF */
function downloadPDF(){
  const el = document.getElementById("resumeBox");
  if(!el){
    alert("Generate resume first");
    return;
  }

  html2pdf().from(el).save("AOV_Resume.pdf");
}

</script>

</body>
</html>
