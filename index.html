<script>

window.onload = function () {

/* FIREBASE SAFE INIT */
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

let user = null;

/* UI */
function showApp(){
  const loginBox = document.getElementById("loginBox");
  const form = document.getElementById("form");

  if(loginBox) loginBox.style.display = "none";
  if(form) form.classList.remove("hidden");
}

function showLogin(){
  const loginBox = document.getElementById("loginBox");
  const form = document.getElementById("form");

  if(loginBox) loginBox.style.display = "block";
  if(form) form.classList.add("hidden");
}

/* AUTH */
auth.onAuthStateChanged((u)=>{
  user = u;

  if(user) showApp();
  else showLogin();
});

/* LOGIN */
window.login = function(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .then(res=>{
    user = res.user;
    showApp();
  })
  .catch(err=>{
    console.log(err);

    if(err.code === "auth/popup-blocked"){
      auth.signInWithRedirect(provider);
    } else {
      alert("Login failed: " + err.message);
    }
  });
}

/* RESUME */
window.generate = function(){

  const get = (id)=> document.getElementById(id)?.value || "";

  document.getElementById("resume").innerHTML = `
    <div class="resumeBox" id="resumeBox">

      <div style="text-align:center">
        <img src="${get("photo")}" width="100" style="border-radius:50%">
        <h2>${get("name")}</h2>
      </div>

      <p><b>Age:</b> ${get("age")}</p>
      <p><b>Qualification:</b> ${get("qualification")}</p>
      <p><b>Experience:</b> ${get("experience")}</p>
      <p><b>Skills:</b> ${get("skills")}</p>
      <p><b>About:</b> ${get("about")}</p>

      <hr>

      <p><b>Declaration:</b> ${get("declaration")}</p>
      <p><b>Signature:</b> ${get("signature")}</p>
      <p><b>Date:</b> ${new Date().toLocaleDateString()}</p>

    </div>
  `;
}

/* SAVE */
window.save = function(){
  if(!user){
    alert("Login first");
    return;
  }

  db.collection("resumes").add({
    name: document.getElementById("name")?.value || "",
    email: user.email,
    createdAt: Date.now()
  });

  alert("Saved ✔");
}

/* PDF */
window.downloadPDF = function(){
  const el = document.getElementById("resumeBox");

  if(!el){
    alert("Generate resume first");
    return;
  }

  html2pdf().from(el).save("resume.pdf");
}

}; // end window.onload

</script>
