<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - India Startup System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#ff9933,#ffffff,#138808);
      color:#0f172a;
    }

    header{
      text-align:center;
      padding:25px;
      background:rgba(255,255,255,0.8);
      backdrop-filter:blur(6px);
    }

    h1{
      font-size:38px;
      color:#0f172a;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:15px;
    }

    .card{
      background:rgba(255,255,255,0.9);
      padding:18px;
      border-radius:12px;
      margin-bottom:15px;
      box-shadow:0 8px 20px rgba(0,0,0,0.15);
    }

    input{
      width:100%;
      padding:12px;
      margin:6px 0;
      border-radius:8px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    .btn{
      background:#138808;
      color:white;
      padding:12px;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
      width:100%;
      margin-top:10px;
      display:block;
      text-align:center;
      text-decoration:none;
    }

    .job{
      background:#f8fafc;
      padding:12px;
      border-radius:10px;
      margin-top:10px;
      border:1px solid #ddd;
    }

    .score{
      color:#16a34a;
      font-weight:bold;
    }

    .skill-box{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }

    .skill{
      background:#e2e8f0;
      padding:6px 10px;
      border-radius:20px;
      font-size:13px;
      cursor:pointer;
      border:1px solid #cbd5e1;
    }

    .skill:hover{
      background:#ff9933;
      color:white;
    }

    .qr{
      width:180px;
      margin-top:10px;
    }

    .center{
      text-align:center;
    }
  </style>
</head>

<body>

<header>
  <h1>🇮🇳 AOV AI Jobs</h1>
  <p>India’s AI Powered Job + Resume Startup System</p>
</header>

<div class="container">

  <!-- PROFILE -->
  <div class="card">
    <h2>📄 AI Profile</h2>

    <input id="skills" placeholder="Skills (AI Python ML)">
    <input id="exp" placeholder="Experience (fresher/junior/senior)">

    <button class="btn" onclick="generateAI()">Find AI Jobs</button>
  </div>

  <!-- SKILLS -->
  <div class="card">
    <h2>🔥 Skills Library</h2>

    <div class="skill-box">
      <div class="skill" onclick="setSkill('ai')">AI</div>
      <div class="skill" onclick="setSkill('python')">Python</div>
      <div class="skill" onclick="setSkill('machine learning')">ML</div>
      <div class="skill" onclick="setSkill('data')">Data</div>
      <div class="skill" onclick="setSkill('sql')">SQL</div>
      <div class="skill" onclick="setSkill('javascript')">JavaScript</div>
      <div class="skill" onclick="setSkill('react')">React</div>
      <div class="skill" onclick="setSkill('web')">Web</div>
      <div class="skill" onclick="setSkill('chatbot')">Chatbot</div>
      <div class="skill" onclick="setSkill('marketing')">Marketing</div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="card">
    <h2>🎯 AI Job Results</h2>
    <div id="results"></div>
  </div>

  <!-- RESUME -->
  <div class="card">
    <h2>📄 Resume Builder</h2>

    <input id="name" placeholder="Full Name">
    <input id="email" placeholder="Email">
    <input id="phone" placeholder="Phone">
    <input id="education" placeholder="Education">

    <button class="btn" onclick="saveResume()">Save Resume</button>

    <div id="resumePreview"></div>
  </div>

  <!-- PAYMENT -->
  <div class="card center">
    <h2>💳 Premium Access</h2>

    <p><b>AI Resume + Job Boost Access</b></p>
    <p><b>Premium Charge: ₹200</b></p>

    <img class="qr"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=200&cu=INR">

    <button class="btn" onclick="pay()">Pay ₹200 via UPI</button>
  </div>

</div>

<script>

const jobs = [
  {title:"AI Engineer",skills:["ai","python","ml"],level:"senior"},
  {title:"ML Intern",skills:["ml","python"],level:"fresher"},
  {title:"Data Analyst",skills:["data","sql"],level:"junior"},
  {title:"Web Developer",skills:["web","javascript","react"],level:"junior"},
  {title:"Chatbot Developer",skills:["chatbot","ai"],level:"junior"}
];

// skill click
function setSkill(skill){
  document.getElementById("skills").value = skill;
  generateAI();
}

// AI ENGINE
function generateAI(){

  let skills = document.getElementById("skills").value.toLowerCase().split(/[\s,]+/);
  let exp = document.getElementById("exp").value.toLowerCase();

  let html="";

  jobs.forEach(job=>{
    let score=0;

    job.skills.forEach(s=>{
      if(skills.includes(s)) score+=50;
    });

    if(exp.includes(job.level)) score+=20;

    if(score===0) score=10;

    html+=`
      <div class="job">
        <h3>${job.title}</h3>
        <p class="score">${score}% Match</p>

        <a class="btn" target="_blank"
          href="https://www.linkedin.com/jobs/search/?keywords=${job.title}">
          LinkedIn Jobs
        </a>

        <a class="btn" target="_blank"
          href="https://www.google.com/search?q=${job.title}+jobs">
          Google Jobs
        </a>
      </div>
    `;
  });

  document.getElementById("results").innerHTML=html;
}

// resume save
function saveResume(){
  let name=document.getElementById("name").value;
  let email=document.getElementById("email").value;
  let phone=document.getElementById("phone").value;
  let edu=document.getElementById("education").value;

  document.getElementById("resumePreview").innerHTML=`
    <div class="job">
      <h3>📄 Resume Preview</h3>
      <p>Name: ${name}</p>
      <p>Email: ${email}</p>
      <p>Phone: ${phone}</p>
      <p>Education: ${edu}</p>
    </div>
  `;
}

// UPI PAY
function pay(){
  window.location.href =
    "upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=200&cu=INR";
}

</script>

</body>
</html>
