<!DOCTYPE html>
<html>
<head>
  <title>Leeco AI SaaS Resume Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0b1220,#111827);
      color:white;
    }

    .center{
      text-align:center;
      padding:40px;
    }

    .card{
      max-width:500px;
      margin:20px auto;
      background:#1f2937;
      padding:20px;
      border-radius:15px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    .hidden{display:none}

    .resume{
      background:white;
      color:black;
      padding:20px;
      border-radius:10px;
    }

    .premium{
      background:gold;
      color:black;
      padding:10px;
      text-align:center;
      border-radius:10px;
      font-weight:bold;
      margin-bottom:10px;
    }
  </style>
</head>

<body>

<div class="center">
  <h1>🚀 Leeco AI SaaS Resume Builder</h1>
  <p>Build Resume • Save • Download PDF</p>
</div>

<!-- LOGIN -->
<div class="card" id="loginBox">
  <h2>Login</h2>
  <button onclick="login()">Continue with Google</button>
</div>

<!-- APP -->
<div class="card hidden" id="app">

  <div class="premium">⭐ Free Plan (Upgrade coming soon)</div>

  <input id="name" placeholder="Name">
  <input id="age" placeholder="Age">
  <input id="skills" placeholder="Skills">
  <input id="experience" placeholder="Experience">
  <input id="photo" placeholder="Photo URL">

  <button onclick="generate()">Generate Resume</button>
  <button onclick="save()">Save</button>
  <button onclick="downloadPDF()">Download PDF</button>

</div>

<div class="card">
  <div id="output"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* LOGIN */
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
  .catch(e=>{
    alert("Login Error: " + e.message);
  });
}

/* AUTH CHECK */
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  } else {
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
  }
});

/* GENERATE */
function generate(){
  output.innerHTML = `
    <div class="resume" id="resumeBox">
      <center>
        <img src="${photo.value}" width="80" style="border-radius:50%">
        <h2>${name.value}</h2>
      </center>
      <p><b>Age:</b> ${age.value}</p>
      <p><b>Skills:</b> ${skills.value}</p>
      <p><b>Experience:</b> ${experience.value}</p>
    </div>
  `;
}

/* SAVE */
function save(){
  const user = auth.currentUser;
  if(!user) return alert("Login first");

  db.collection("resumes").add({
    name: name.value,
    email: user.email,
    time: Date.now()
  });

  alert("Saved ✔");
}

/* PDF */
function downloadPDF(){
  const el = document.getElementById("resumeBox");
  if(!el) return alert("Generate first");

  html2pdf().from(el).save("resume.pdf");
}
</script>

</body>
</html>
