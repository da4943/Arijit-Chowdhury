<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Professional Resume Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    h1{text-align:center;color:#38bdf8;}

    .card{
      background:#111827;
      padding:20px;
      margin-bottom:15px;
      border-radius:12px;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:8px;
      border-radius:6px;
      border:none;
      background:#0b1220;
      color:white;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#38bdf8;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .job{
      padding:12px;
      margin-top:10px;
      background:#0b1220;
      border-radius:8px;
    }

    .btn-row{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .btn-row a{
      flex:1;
      text-align:center;
      padding:10px;
      border-radius:6px;
      text-decoration:none;
      color:white;
      font-weight:bold;
    }

    .google{background:#db4437;}
    .linkedin{background:#0a66c2;}

    .resume-page{
      background:white;
      color:black;
      padding:20px;
      border-radius:10px;
    }

    .center{text-align:center;}

    .photo{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid black;
    }

    .section{
      margin-top:10px;
      border-bottom:1px solid #ddd;
      padding-bottom:10px;
    }

    .premium{
      border:2px solid gold;
      text-align:center;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>🚀 Professional Resume Builder</h1>

  <!-- INPUT -->
  <div class="card">

    <input id="name" placeholder="Full Name">
    <input id="father" placeholder="Father Name">
    <input id="age" placeholder="Age">
    <input id="gender" placeholder="Gender">
    <input id="address" placeholder="Address">
    <input id="qualification" placeholder="Qualification">
    <input id="skills" placeholder="Skills">
    <input id="exp" placeholder="Experience">
    <input type="file" id="photo">

    <button onclick="generateResume()">Generate Resume</button>
    <button onclick="generateJobs()">Find Jobs</button>

  </div>

  <!-- RESUME -->
  <div class="card">
    <h2>📄 Resume Preview</h2>
    <div id="resume"></div>
    <button onclick="downloadPDF()">Download PDF</button>
  </div>

  <!-- JOBS -->
  <div class="card">
    <h2>🎯 Jobs</h2>
    <div id="jobs"></div>
  </div>

  <!-- PREMIUM (NOW VISIBLE FIXED) -->
  <div class="card premium" id="premium">

    <h2>💎 Premium ₹200</h2>
    <p>Scan QR to pay</p>

    <img width="150"
    src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR">

    <input id="utr" placeholder="Enter UTR Number">
    <button onclick="alert('Payment Submitted')">Submit Payment</button>

  </div>

</div>

<script>

const jobs = [
  {title:"AI Developer"},
  {title:"Data Analyst"},
  {title:"Web Developer"}
];

function generateResume(){

  let name=document.getElementById("name").value;
  let father=document.getElementById("father").value;
  let age=document.getElementById("age").value;
  let gender=document.getElementById("gender").value;
  let address=document.getElementById("address").value;
  let qualification=document.getElementById("qualification").value;
  let skills=document.getElementById("skills").value;
  let exp=document.getElementById("exp").value;
  let photo=document.getElementById("photo").files[0];

  let reader=new FileReader();

  reader.onload=function(e){

    document.getElementById("resume").innerHTML=`
    <div id="resumeContent" class="resume-page">

      <div class="center">
        ${photo?`<img src="${e.target.result}" class="photo">`:""}
        <h2>${name}</h2>
        <p>${address}</p>
      </div>

      <div class="section">
        <h3>Personal Details</h3>
        <p><b>Father:</b> ${father}</p>
        <p><b>Age:</b> ${age}</p>
        <p><b>Gender:</b> ${gender}</p>
      </div>

      <div class="section">
        <h3>Education</h3>
        <p>${qualification}</p>
      </div>

      <div class="section">
        <h3>Skills</h3>
        <p>${skills}</p>
      </div>

      <div class="section">
        <h3>Experience</h3>
        <p>${exp}</p>
      </div>

      <div class="section">
        <h3>Declaration</h3>
        <p>I hereby declare that all information is true.</p>
        <p class="center">Signature: ____________</p>
      </div>

    </div>`;
  }

  if(photo) reader.readAsDataURL(photo);
  else reader.onload({target:{result:""}});
}

function generateJobs(){

  let html="";

  jobs.forEach(j=>{

    html+=`
    <div class="job">
      <h3>${j.title}</h3>

      <div class="btn-row">
        <a class="google" target="_blank"
        href="https://www.google.com/search?q=${j.title}+jobs">Google</a>

        <a class="linkedin" target="_blank"
        href="https://www.linkedin.com/jobs/search/?keywords=${j.title}">LinkedIn</a>
      </div>

    </div>`;
  });

  document.getElementById("jobs").innerHTML=html;
}

function downloadPDF(){

  let el=document.getElementById("resumeContent");

  if(!el){
    alert("Generate resume first");
    return;
  }

  html2pdf().from(el).save("Resume.pdf");
}

</script>

</body>
</html>
