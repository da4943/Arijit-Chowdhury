<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Production System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    .box{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    .card{
      background:#111827;
      padding:15px;
      margin:10px 0;
      border-radius:10px;
      border:1px solid #334155;
    }

    input{
      width:100%;
      padding:10px;
      margin:5px 0;
      border-radius:8px;
      border:1px solid #334155;
      background:#0b1220;
      color:white;
    }

    button{
      width:100%;
      padding:10px;
      margin-top:10px;
      background:#38bdf8;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    .job{
      padding:10px;
      border:1px solid #334155;
      margin-top:10px;
      border-radius:8px;
    }

    .premium{
      border:2px solid gold;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="card">
    <h2>🔐 Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <div class="card">
    <h2>📄 AI Resume Builder</h2>

    <input id="name" placeholder="Full Name">
    <input id="skills" placeholder="Skills (ai, python, ml)">
    <input id="exp" placeholder="Experience">

    <button onclick="saveProfile()">Save Profile</button>
    <button onclick="generateAI()">Find Jobs</button>
  </div>

  <div class="card">
    <h2>🎯 AI Jobs</h2>
    <div id="results"></div>
  </div>

  <div class="card premium">
    <h2>💎 Premium ₹200</h2>

    <img width="150"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR">

    <button onclick="pay()">Unlock Premium</button>
  </div>

</div>

<script>

// 🔥 FIREBASE CONFIG (PUT YOURS HERE)
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// 📌 JOBS DATABASE
const jobs = [
  {title:"AI Engineer",skills:["ai","python","ml"]},
  {title:"Data Analyst",skills:["data","sql"]},
  {title:"Web Developer",skills:["react","javascript"]},
  {title:"ML Intern",skills:["ml","python"]}
];

// 🔐 LOGIN
function login(){
  let email=document.getElementById("email").value;
  let pass=document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email,pass)
  .then(()=>{
    alert("Login Success");
  })
  .catch(()=>{
    auth.createUserWithEmailAndPassword(email,pass)
    .then(()=>alert("Account Created"));
  });
}

// 💾 SAVE PROFILE TO CLOUD
function saveProfile(){
  let user=auth.currentUser;

  if(!user){
    alert("Login first");
    return;
  }

  db.collection("profiles").doc(user.uid).set({
    name:document.getElementById("name").value,
    skills:document.getElementById("skills").value,
    exp:document.getElementById("exp").value
  });

  alert("Saved to Cloud ☁");
}

// 🤖 AI MATCH ENGINE
function generateAI(){

  let skills=document.getElementById("skills").value.toLowerCase().split(",");

  let html="";

  jobs.forEach(j=>{
    let score=0;

    j.skills.forEach(s=>{
      if(skills.map(x=>x.trim()).includes(s)) score+=50;
    });

    if(score>0){
      html+=`
        <div class="job">
          <h3>${j.title}</h3>
          <p>Match: ${score}%</p>

          <a href="https://www.linkedin.com/jobs/search/?keywords=${j.title}" target="_blank">
            LinkedIn Jobs
          </a><br>

          <a href="https://www.google.com/search?q=${j.title}+jobs" target="_blank">
            Google Jobs
          </a>
        </div>
      `;
    }
  });

  document.getElementById("results").innerHTML=html;
}

// 💳 PAYMENT (UPI)
function pay(){
  window.location.href =
    "upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR";
}

</script>

</body>
</html>
