<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
    }

    header {
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      color: #38bdf8;
    }

    .search {
      margin-top: 10px;
      padding: 14px;
      width: 60%;
      border-radius: 12px;
      border: none;
      font-size: 16px;
    }

    .btn {
      background: #38bdf8;
      color: black;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      padding: 30px;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>AOV AI Jobs</h1>
  <p>AI-powered job discovery platform</p>

  <input id="jobSearch" class="search" type="text" placeholder="Search jobs..." onkeyup="searchJobs()">

  <br><br>

  <input id="userSkill" class="search" type="text" placeholder="Enter your skill">

  <br><br>

  <a class="btn" onclick="matchJobs()">Find Best Jobs</a>
</header>

<div class="container" id="jobContainer"></div>

<script>
const jobs = [
  { title: "AI Developer", description: "AI automation work" },
  { title: "ML Intern", description: "Machine learning work" },
  { title: "Chatbot Builder", description: "Freelance chatbot" },
  { title: "Data Analyst", description: "Data analysis job" }
];

// show jobs
function displayJobs(list) {
  let container = document.getElementById("jobContainer");
  container.innerHTML = "";

  for (let i = 0; i < list.length; i++) {
    container.innerHTML += `
      <div class="card">
        <h2>${list[i].title}</h2>
        <p>${list[i].description}</p>
        <a class="btn">Apply</a>
      </div>
    `;
  }
}

// SEARCH (FINAL)
function searchJobs() {
  let input = document.getElementById("jobSearch").value.toLowerCase().trim();
  let container = document.getElementById("jobContainer");

  if (input === "") {
    displayJobs(jobs);
    return;
  }

  let found = false;
  let resultHTML = "";

  for (let i = 0; i < jobs.length; i++) {
    let text = (jobs[i].title + jobs[i].description).toLowerCase();

    if (text.includes(input)) {
      found = true;
      resultHTML += `
        <div class="card">
          <h2>${jobs[i].title}</h2>
          <p>${jobs[i].description}</p>
          <a class="btn">Apply</a>
        </div>
      `;
    }
  }

  if (found) {
    container.innerHTML = resultHTML;
  } else {
    container.innerHTML = `
      <div class="card">
        <h2>No result found</h2>
        <p>Search jobs on external platforms</p>

        <a class="btn" target="_blank" href="https://www.google.com/search?q=${input}+jobs">
          Search on Google
        </a>

        <br>

        <a class="btn" target="_blank" href="https://www.linkedin.com/jobs/search/?keywords=${input}">
          Search on LinkedIn
        </a>
      </div>
    `;
  }

  window.scrollTo(0, 300);
}

// AI match
function matchJobs() {
  let skill = document.getElementById("userSkill").value.toLowerCase();

  let result = jobs.filter(job =>
    job.title.toLowerCase().includes(skill) ||
    job.description.toLowerCase().includes(skill)
  );

  if (result.length > 0) {
    displayJobs(result);
  } else {
    document.getElementById("jobContainer").innerHTML = `
      <div class="card">
        <h2>No match</h2>
      </div>
    `;
  }

  window.scrollTo(0, 300);
}

// load
displayJobs(jobs);
</script>

</body>
</html>
