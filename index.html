<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
    }

    header {
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      color: #38bdf8;
    }

    .search {
      margin-top: 10px;
      padding: 14px;
      width: 80%;
      border-radius: 12px;
      border: none;
      font-size: 16px;
    }

    .btn {
      background: #38bdf8;
      color: black;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>AOV AI Jobs</h1>
  <p>AI-powered job discovery platform</p>

  <input id="jobSearch" class="search" type="text" placeholder="Search jobs..." onkeyup="searchJobs()">

  <div class="container" id="jobContainer"></div>

  <input id="userSkill" class="search" type="text" placeholder="Enter your skill"><br>

  <a class="btn" onclick="matchJobs()">Find Best Jobs</a>
</header>

<div class="container">
  <div class="card">
    <h2>📄 Create Your AI Resume</h2>

    <input id="name" class="search" type="text" placeholder="Full Name"><br><br>
    <input id="father" class="search" type="text" placeholder="Father's Name"><br><br>
    <input id="email" class="search" type="email" placeholder="Email"><br><br>
    <input id="phone" class="search" type="text" placeholder="Phone"><br><br>
    <input id="age" class="search" type="number" placeholder="Age"><br><br>
    <input id="dob" class="search" type="date"><br><br>
    <input id="skills" class="search" type="text" placeholder="Skills"><br><br>

    <select id="exp" class="search">
      <option value="">Experience</option>
      <option>Fresher</option>
      <option>1-2 Years</option>
      <option>3-5 Years</option>
    </select><br><br>

    <input id="education" class="search" type="text" placeholder="Education"><br><br>

    <!-- ✅ PAYMENT BUTTON -->
    <a class="btn" onclick="payAndSubmit()">Pay ₹49 & Create Resume</a>

  </div>
</div>

<script>
const jobs = [
  {
    title: "AI Developer",
    description: "Work on AI models",
    link: "https://www.linkedin.com/jobs/search/?keywords=ai%20developer"
  },
  {
    title: "Machine Learning Intern",
    description: "Assist ML projects",
    link: "https://www.linkedin.com/jobs/search/?keywords=machine%20learning%20intern"
  },
  {
    title: "Chatbot Developer",
    description: "Build chatbot systems",
    link: "https://www.google.com/search?q=chatbot+developer+jobs"
  }
];

function displayJobs(list) {
  let container = document.getElementById("jobContainer");
  container.innerHTML = "";

  list.forEach(job => {
    container.innerHTML += `
      <div class="card">
        <h2>${job.title}</h2>
        <p>${job.description}</p>
        <a class="btn" target="_blank" href="${job.link}">Apply</a>
      </div>
    `;
  });
}

function searchJobs() {
  let input = document.getElementById("jobSearch").value.toLowerCase();
  let container = document.getElementById("jobContainer");

  let filtered = jobs.filter(job =>
    job.title.toLowerCase().includes(input)
  );

  if (filtered.length > 0) {
    displayJobs(filtered);
  } else {
    container.innerHTML = `
      <div class="card">
        <h2>No result</h2>
        <a class="btn" target="_blank" href="https://www.google.com/search?q=${input}+jobs">
          Search on Google
        </a>
      </div>
    `;
  }
}

function matchJobs() {
  let skill = document.getElementById("userSkill").value.toLowerCase();

  let filtered = jobs.filter(job =>
    job.title.toLowerCase().includes(skill)
  );

  displayJobs(filtered);
}

// ✅ PAYMENT + FORM
function payAndSubmit() {
  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let skills = document.getElementById("skills").value;

  if (name === "" || email === "" || skills === "") {
    alert("Fill required details");
    return;
  }

  // save data
  localStorage.setItem("userData", JSON.stringify({
    name, email, skills
  }));

  alert("Redirecting to payment...");

  // 👉 PUT YOUR RAZORPAY LINK HERE
  window.open("https://rzp.io/l/YOUR_LINK", "_blank");
}

displayJobs(jobs);
</script>

</body>
</html>
