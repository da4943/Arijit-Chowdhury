<!DOCTYPE html>
<html>
<head>
  <title>AOV Resume + Premium QR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:10px;
    }

    .card{
      padding:20px;
      margin:10px 0;
      background:#111827;
      border-radius:12px;
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      font-size:16px;
      box-sizing:border-box;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    /* 💎 PREMIUM */
    .premium-box{
      text-align:center;
      background:linear-gradient(45deg,#ffcc00,#ff8800);
      color:black;
      padding:25px;
      border-radius:15px;
      box-shadow:0 0 20px #ffcc00;
    }

    .premium-title{
      font-size:22px;
      font-weight:bold;
    }

    .premium-btn{
      margin-top:15px;
      padding:18px;
      font-size:20px;
      background:black;
      color:white;
      border-radius:12px;
    }

    .resume-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:10px;
    }

    /* MOBILE */
    @media (max-width:600px){
      .premium-title{font-size:18px;}
      .premium-btn{font-size:18px;}
    }
  </style>
</head>

<body>

<div class="container">

  <!-- 💎 PREMIUM SECTION -->
  <div class="card premium-box">

    <div class="premium-title">💎 PREMIUM UNLOCK</div>
    <div>Unlock All Features ₹200</div>

    <img 
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=yourupi@bank&pn=AOV%20Resume&am=200&cu=INR"
      style="margin-top:15px;width:200px;height:200px;border-radius:10px;background:white;padding:10px"
    />

    <div style="margin-top:10px;font-size:14px">
      Scan QR to pay ₹200
    </div>

  </div>

  <!-- FORM -->
  <div class="card">

    <h2>Resume Generator</h2>

    <input id="name" placeholder="Name">
    <input id="age" placeholder="Age">
    <input id="qualification" placeholder="Qualification">
    <input id="experience" placeholder="Experience">
    <input id="skills" placeholder="Skills">
    <input id="about" placeholder="About">
    <input id="photo" placeholder="Photo URL">
    <input id="declaration" placeholder="Declaration">
    <input id="signature" placeholder="Signature">

    <button onclick="generate()">Generate Resume</button>
    <button onclick="downloadPDF()">Download PDF</button>

  </div>

  <!-- RESUME -->
  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<script>

/* GENERATE RESUME */
function generate(){

  const data = {
    name: document.getElementById("name").value,
    age: document.getElementById("age").value,
    qualification: document.getElementById("qualification").value,
    experience: document.getElementById("experience").value,
    skills: document.getElementById("skills").value,
    about: document.getElementById("about").value,
    photo: document.getElementById("photo").value,
    declaration: document.getElementById("declaration").value,
    signature: document.getElementById("signature").value
  };

  document.getElementById("resume").innerHTML = `
    <div class="resume-box" id="resumeBox">

      <center>
        <img src="${data.photo}" width="90" style="border-radius:50%">
        <h2>${data.name}</h2>
      </center>

      <p><b>Age:</b> ${data.age}</p>
      <p><b>Qualification:</b> ${data.qualification}</p>
      <p><b>Experience:</b> ${data.experience}</p>
      <p><b>Skills:</b> ${data.skills}</p>
      <p><b>About:</b> ${data.about}</p>

      <hr>

      <p><b>Declaration:</b> ${data.declaration}</p>
      <p><b>Signature:</b> ${data.signature}</p>
      <p><b>Date:</b> ${new Date().toLocaleDateString()}</p>

    </div>
  `;
}

/* PDF DOWNLOAD */
function downloadPDF(){
  const el = document.getElementById("resumeBox");

  if(!el){
    alert("Generate resume first");
    return;
  }

  html2pdf().from(el).save("resume.pdf");
}

</script>

</body>
</html>
