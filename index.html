<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leeco AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b0f19;
  color:white;
}

/* WRAPPER */
.wrapper{
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:#0f172a;
  padding:16px;
  box-sizing:border-box;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#38bdf8;
  margin-bottom:20px;
}

.menu button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#111827;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

.menu button:hover{
  background:#1f2937;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* TOPBAR */
.topbar{
  padding:14px 18px;
  background:#0f172a;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

/* CHAT AREA */
.chat{
  flex:1;
  padding:18px;
  overflow-y:auto;
  box-sizing:border-box;
}

.msg{
  padding:12px 14px;
  margin:10px 0;
  border-radius:10px;
  max-width:75%;
  word-wrap:break-word;
}

/* USER MESSAGE */
.user{
  background:#38bdf8;
  color:black;
  margin-left:auto;
}

/* AI MESSAGE */
.ai{
  background:#1f2937;
}

/* INPUT AREA */
.inputBox{
  display:flex;
  padding:12px;
  background:#0f172a;
  box-sizing:border-box;
}

input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  outline:none;
  font-size:14px;
}

button.send{
  margin-left:10px;
  padding:12px 18px;
  border:none;
  border-radius:8px;
  background:#38bdf8;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button.send:hover{
  background:#22a6f0;
}

/* MOBILE */
@media(max-width:768px){
  .sidebar{
    display:none;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">Leeco AI</div>

    <div class="menu">
      <button onclick="newChat()">New Chat</button>
      <button>Resume AI</button>
      <button>Code Generator</button>
      <button>Blog Writer</button>
      <button>Settings</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="topbar">
      <div>AI Assistant</div>
      <div>Free Mode</div>
    </div>

    <!-- CHAT -->
    <div class="chat" id="chat">
      <div class="msg ai">Hello 👋 I am Leeco AI. Ask me anything.</div>
    </div>

    <!-- INPUT -->
    <div class="inputBox">
      <input id="input" placeholder="Type your message...">
      <button class="send" onclick="send()">Send</button>
    </div>

  </div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");

/* SEND MESSAGE */
function send(){

  const text = input.value.trim();
  if(!text) return;

  // USER MESSAGE
  addMessage(text, "user");

  // AI RESPONSE (frontend demo)
  setTimeout(()=>{
    addMessage(generateReply(text), "ai");
  },500);

  input.value="";
}

/* ADD MESSAGE */
function addMessage(text, type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* SIMPLE AI LOGIC (FRONTEND ONLY) */
function generateReply(text){
  text = text.toLowerCase();

  if(text.includes("hello")) return "Hello! How can I help you today?";
  if(text.includes("resume")) return "I can help you build a professional resume.";
  if(text.includes("job")) return "I can suggest job-related guidance for you.";
  if(text.includes("html")) return "HTML is the structure of web pages.";
  
  return "I am a frontend AI demo. Connect backend API for real intelligence.";
}

/* NEW CHAT */
function newChat(){
  chat.innerHTML = `<div class="msg ai">New chat started. Ask me anything 👋</div>`;
}

</script>

</body>
</html>
