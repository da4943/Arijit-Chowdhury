<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume SaaS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    /* NAV */
    .nav{
      display:flex;
      justify-content:space-between;
      padding:15px;
      background:linear-gradient(90deg,#ff9933,#ffffff,#138808);
      color:black;
      font-weight:bold;
      position:sticky;
      top:0;
    }

    .nav button{
      margin:3px;
      padding:8px 12px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      background:#111827;
      color:white;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:20px;
    }

    .card{
      background:#111827;
      padding:20px;
      border-radius:12px;
      margin:15px 0;
    }

    input,button{
      width:100%;
      padding:10px;
      margin-top:8px;
      border-radius:6px;
      border:none;
    }

    .btn{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:10px;
    }

    .hidden{display:none}

    .resume{
      background:white;
      color:black;
      padding:15px;
      border-radius:10px;
    }

    .qr{
      text-align:center;
      background:white;
      padding:10px;
      border-radius:10px;
    }
  </style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div>AOV Resume SaaS 🇮🇳</div>
  <div>
    <button onclick="show('home')">Home</button>
    <button onclick="show('builder')">Builder</button>
    <button onclick="show('premium')">Premium</button>
  </div>
</div>

<div class="container">

<!-- HOME -->
<div id="home" class="card">
  <h2>Build Resume + Find Jobs</h2>
  <p>Create professional CV and apply jobs instantly</p>

  <button class="btn" onclick="show('builder')">Start Building</button>

  <div class="grid">
    <button onclick="window.open('https://www.google.com/search?q=jobs+near+me')">
      🔍 Search Jobs on Google
    </button>

    <button onclick="window.open('https://www.linkedin.com/jobs')">
      💼 Search Jobs on LinkedIn
    </button>
  </div>
</div>

<!-- BUILDER -->
<div id="builder" class="card hidden">
  <h2>Resume Builder</h2>

  <input id="name" placeholder="Full Name">
  <input id="skills" placeholder="Skills">
  <input id="exp" placeholder="Experience">

  <button class="btn" onclick="generate()">Generate Resume</button>

  <div id="output"></div>
</div>

<!-- PREMIUM -->
<div id="premium" class="card hidden">
  <h2>Premium Unlock</h2>

  <p>Scan QR to unlock premium features</p>

  <div class="qr">
    <img width="220"
    src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=199&cu=INR">

    <p><b>UPI ID:</b> 9975076459@mbk</p>
  </div>

  <p>After payment, resume features will be upgraded manually.</p>
</div>

</div>

<script>

function show(id){
  document.querySelectorAll('.card').forEach(c=>c.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// RESUME GENERATE
function generate(){
  document.getElementById("output").innerHTML = `
    <div class="resume">
      <h3>${name.value}</h3>
      <p><b>Skills:</b> ${skills.value}</p>
      <p><b>Experience:</b> ${exp.value}</p>
    </div>
  `;
}

</script>

</body>
</html>
