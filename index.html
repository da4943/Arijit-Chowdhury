<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <script src="https://www.paypal.com/sdk/js?client-id=ATxSvTwRQxtN5NBu5Kj8GAjZCDRzCpb_aoO_L_vB9IAF-p179MOTDCtUhVEYGG1B-2P-n47P6BL4B&currency=USD"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    import {
      getFirestore, doc, setDoc, getDocs, collection
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBpJQ44k1gokp3sSZggyESC7HpvqssClEE",
      authDomain: "aov-ai-jobs-c697d.firebaseapp.com",
      projectId: "aov-ai-jobs-c697d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseAuth = auth;
    window.firebaseLogin = signInWithEmailAndPassword;
    window.firebaseSignup = createUserWithEmailAndPassword;
    window.firebaseLogout = signOut;
    window.firebaseOnAuth = onAuthStateChanged;
    window.db = db;
    window.setDoc = setDoc;
    window.getDocs = getDocs;
    window.collection = collection;
    window.doc = doc;
  </script>

  <style>
    body{margin:0;font-family:Arial;background:linear-gradient(135deg,#050816,#0b1220);color:white;}
    .nav{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#0f172a;}
    .logo{color:#38bdf8;font-size:20px;font-weight:bold;}
    .social{display:flex;gap:10px;}
    .social button{padding:10px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;}

    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}

    .container{max-width:1000px;margin:auto;padding:15px;}
    .card{background:#111827;padding:20px;margin-top:15px;border-radius:15px;}

    input,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;}
    button{background:#38bdf8;font-weight:bold;cursor:pointer;}

    .resume-box{background:white;color:black;padding:20px;border-radius:12px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>
  <div class="social">
    <button onclick="loadPayments()" id="adminBtn" style="display:none;">Admin</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">

  <div class="card">
    <h2>💎 Pay $20</h2>

    <div id="paypal-button-container"></div>
  </div>

  <div class="card">
    <h2>Resume Builder</h2>

    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="qualification" placeholder="Qualification">
    </div>

    <input id="skills" placeholder="Skills">
    <input id="about" placeholder="About">

    <button onclick="generate()">Generate</button>
    <button onclick="downloadPDF()">Download PDF</button>

    <!-- HIDDEN BUTTON (ONLY ADMIN SEES) -->
    <button id="clearBtn" onclick="clearData()" style="display:none;background:#ef4444;">Clear Data</button>
  </div>

  <div class="card">
    <div id="resume"></div>
  </div>

  <!-- ADMIN PANEL (HIDDEN) -->
  <div class="card" id="adminPanel" style="display:none;">
    <h2>Who Paid (Admin Only)</h2>
    <div id="paymentsList"></div>
  </div>

</div>

<script>

const ADMIN_EMAIL = "youradminemail@gmail.com";

let resumeBox=null;

/* PAYPAL */
paypal.Buttons({
  createOrder:(d,a)=>{
    return a.order.create({
      purchase_units:[{amount:{value:'20'}}]
    });
  },

  onApprove:(d,a)=>{
    return a.order.capture().then(async(details)=>{

      const user = firebaseAuth.currentUser;

      if(user){
        await setDoc(doc(db,"payments",user.uid),{
          email:user.email,
          paymentId:details.id,
          status:"paid",
          time:new Date().toISOString()
        });

        alert("Payment Success ✔");
      }

    });
  }
}).render("#paypal-button-container");


/* AUTH */
firebaseOnAuth(firebaseAuth,(user)=>{

  if(user){
    if(user.email === ADMIN_EMAIL){
      document.getElementById("adminBtn").style.display="block";
      document.getElementById("adminPanel").style.display="block";
      document.getElementById("clearBtn").style.display="block";
    }
  }

});

/* LOAD PAYMENTS (ADMIN ONLY) */
async function loadPayments(){

  const snap = await getDocs(collection(db,"payments"));

  let html="";

  snap.forEach(d=>{
    const x=d.data();
    html += `
      <p>
        <b>${x.email}</b><br>
        ${x.paymentId}<br>
        ${x.time}
      </p><hr>
    `;
  });

  paymentsList.innerHTML = html || "No payments";
}

/* RESUME */
function generate(){
  document.getElementById("resume").innerHTML=`
    <div class="resume-box">
      <h2>${name.value}</h2>
      <p>${qualification.value}</p>
      <p>${skills.value}</p>
      <p>${about.value}</p>
    </div>
  `;
}

/* PDF */
function downloadPDF(){
  html2pdf().from(document.querySelector(".resume-box")).save();
}

/* CLEAR (ADMIN ONLY SHOWN) */
function clearData(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  document.getElementById("resume").innerHTML="";
}

/* LOGOUT */
async function logout(){
  await firebaseLogout(firebaseAuth);
  alert("Logged out");
}

</script>

</body>
</html>
