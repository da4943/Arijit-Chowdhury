<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume SaaS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .card{
      background:#111827;
      margin:10px;
      padding:20px;
      border-radius:12px;
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:8px;
      border-radius:8px;
      border:none;
      font-size:16px;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    .title{
      text-align:center;
      font-size:20px;
      font-weight:bold;
    }

    .resume-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:12px;
    }

    .premium{
      background:gold;
      color:black;
      padding:10px;
      border-radius:10px;
      text-align:center;
      font-weight:bold;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="card">
  <div class="title">AOV AI RESUME BUILDER</div>

  <div class="premium">
    🔥 Premium Plan ₹200 — QR Payment Available
  </div>
</div>

<!-- FORM -->
<div class="card">

  <input id="name" placeholder="Name">
  <input id="age" placeholder="Age">
  <input id="qualification" placeholder="Qualification">
  <input id="experience" placeholder="Experience">
  <input id="skills" placeholder="Skills">
  <input id="about" placeholder="About">
  <input id="photo" placeholder="Photo URL">
  <input id="declaration" placeholder="Declaration">
  <input id="signature" placeholder="Signature">

  <button onclick="generate()">Generate Resume</button>
  <button onclick="saveLocal()">Save (Local)</button>
  <button onclick="downloadPDF()">Download PDF</button>
</div>

<!-- PREMIUM QR SECTION -->
<div class="card">
  <h3>Pay ₹200 to Unlock Premium</h3>
  <p>Scan QR below:</p>

  <!-- Replace with your real QR image -->
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=PAY-200-AOV" width="150">

  <p>After payment, contact admin to activate premium</p>
</div>

<!-- PREVIEW -->
<div class="card">
  <div id="resume"></div>
</div>

<script>

/* GENERATE */
function generate(){

  const name = document.getElementById("name").value;
  const age = document.getElementById("age").value;
  const qualification = document.getElementById("qualification").value;
  const experience = document.getElementById("experience").value;
  const skills = document.getElementById("skills").value;
  const about = document.getElementById("about").value;
  const photo = document.getElementById("photo").value;
  const declaration = document.getElementById("declaration").value;
  const signature = document.getElementById("signature").value;

  document.getElementById("resume").innerHTML = `
    <div class="resume-box" id="resumeBox">

      <center>
        <img src="${photo}" width="90" style="border-radius:50%">
        <h2>${name}</h2>
      </center>

      <p><b>Age:</b> ${age}</p>
      <p><b>Qualification:</b> ${qualification}</p>
      <p><b>Experience:</b> ${experience}</p>
      <p><b>Skills:</b> ${skills}</p>
      <p><b>About:</b> ${about}</p>

      <hr>

      <p><b>Declaration:</b> ${declaration}</p>
      <p><b>Signature:</b> ${signature}</p>
      <p><b>Date:</b> ${new Date().toLocaleDateString()}</p>

    </div>
  `;
}

/* SAVE LOCAL */
function saveLocal(){
  alert("Saved locally (no login system)");
}

/* PDF */
function downloadPDF(){
  const el = document.getElementById("resumeBox");
  if(!el){
    alert("Generate first");
    return;
  }

  html2pdf().from(el).save("resume.pdf");
}

</script>

</body>
</html>
