<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Level 6 Startup System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    .nav{
      background:#111827;
      padding:12px;
      text-align:center;
      color:#38bdf8;
      font-weight:bold;
      position:sticky;
      top:0;
      border-bottom:1px solid #334155;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:15px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    @media(max-width:800px){
      .grid{grid-template-columns:1fr;}
    }

    .card{
      background:#111827;
      border:1px solid #334155;
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #334155;
      background:#0b1220;
      color:white;
      box-sizing:border-box;
    }

    .btn{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#38bdf8;
      border:none;
      border-radius:8px;
      font-weight:bold;
      color:black;
      cursor:pointer;
    }

    .job{
      padding:12px;
      border:1px solid #334155;
      margin-top:10px;
      border-radius:10px;
      background:#0b1220;
    }

    .score{
      color:#22c55e;
      font-weight:bold;
    }

    .locked{
      filter:blur(4px);
      pointer-events:none;
      opacity:0.6;
    }

    .qr{
      width:170px;
      margin-top:10px;
    }

    .tag{
      font-size:12px;
      background:red;
      padding:3px 8px;
      border-radius:5px;
    }

  </style>
</head>

<body>

<div class="nav">🤖 AOV AI STARTUP SYSTEM - LEVEL 6</div>

<div class="container grid">

  <!-- LOGIN -->
  <div class="card">
    <h2>🔐 Login System</h2>
    <input id="user" placeholder="Enter Username">
    <button class="btn" onclick="login()">Login</button>
    <p id="loginStatus"></p>
  </div>

  <!-- PROFILE -->
  <div class="card">
    <h2>📄 AI Profile Builder</h2>

    <input id="name" placeholder="Full Name">
    <input id="skills" placeholder="Skills (ai, python, ml)">
    <input id="exp" placeholder="Experience (fresher/junior/senior)">

    <button class="btn" onclick="saveProfile()">Save Profile</button>
    <button class="btn" onclick="generateAI()">Find Jobs</button>
  </div>

</div>

<!-- SKILLS -->
<div class="container">
  <div class="card">
    <h2>🔥 Skills Library</h2>

    <button class="btn" onclick="addSkill('ai')">AI</button>
    <button class="btn" onclick="addSkill('python')">Python</button>
    <button class="btn" onclick="addSkill('ml')">ML</button>
    <button class="btn" onclick="addSkill('data')">Data</button>
    <button class="btn" onclick="addSkill('react')">React</button>
    <button class="btn" onclick="addSkill('chatbot')">Chatbot</button>
  </div>
</div>

<!-- JOBS -->
<div class="container">
  <div class="card">
    <h2>🎯 AI Job Matches</h2>
    <div id="results"></div>
  </div>
</div>

<!-- RESUME -->
<div class="container">
  <div class="card">
    <h2>📄 Auto Resume</h2>

    <p><b>Name:</b> <span id="rname">-</span></p>
    <p><b>Skills:</b> <span id="rskills">-</span></p>
    <p><b>Experience:</b> <span id="rexp">-</span></p>
  </div>
</div>

<!-- PREMIUM -->
<div class="container">
  <div class="card">
    <h2>💎 Premium System <span class="tag">LOCKED</span></h2>

    <div id="premium" class="locked">

      <p>✔ AI Resume PDF Download</p>
      <p>✔ Auto Job Apply Bot</p>
      <p>✔ AI Interview Chatbot</p>
      <p>✔ Priority Job Matching</p>

    </div>

    <img class="qr"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=200&cu=INR">

    <button class="btn" onclick="unlock()">Unlock Premium ₹200</button>
  </div>
</div>

<script>

let loggedUser="";

const jobs=[
  {title:"AI Engineer",skills:["ai","python","ml"],level:"senior"},
  {title:"ML Intern",skills:["ml","python"],level:"fresher"},
  {title:"Data Analyst",skills:["data","sql"],level:"junior"},
  {title:"Web Developer",skills:["react","javascript"],level:"junior"},
  {title:"Chatbot Dev",skills:["chatbot","ai"],level:"junior"}
];

// LOGIN
function login(){
  let u=document.getElementById("user").value;
  if(u){
    loggedUser=u;
    localStorage.setItem("user",u);
    document.getElementById("loginStatus").innerText="Logged in as "+u;
  }
}

// ADD SKILL
function addSkill(s){
  let i=document.getElementById("skills");
  i.value += (i.value?",":"")+s;
}

// SAVE PROFILE
function saveProfile(){
  let data={
    name:document.getElementById("name").value,
    skills:document.getElementById("skills").value,
    exp:document.getElementById("exp").value
  };

  localStorage.setItem("profile_"+loggedUser,JSON.stringify(data));
  alert("Profile Saved ✅");
}

// AI ENGINE
function generateAI(){

  let skills=document.getElementById("skills").value.toLowerCase().split(",");
  let exp=document.getElementById("exp").value.toLowerCase();

  document.getElementById("rname").innerText=document.getElementById("name").value;
  document.getElementById("rskills").innerText=skills.join(",");
  document.getElementById("rexp").innerText=exp;

  let results=[];

  jobs.forEach(j=>{
    let score=0;

    j.skills.forEach(s=>{
      if(skills.map(x=>x.trim()).includes(s)) score+=50;
    });

    if(exp.includes(j.level)) score+=20;

    results.push({...j,score});
  });

  results.sort((a,b)=>b.score-a.score);

  let html="";

  results.forEach(r=>{
    html+=`
      <div class="job">
        <h3>${r.title}</h3>
        <p class="score">${r.score}% Match</p>

        <a class="btn" target="_blank"
        href="https://www.linkedin.com/jobs/search/?keywords=${r.title}">
        LinkedIn</a>

        <a class="btn" target="_blank"
        href="https://www.google.com/search?q=${r.title}+jobs">
        Google</a>
      </div>
    `;
  });

  document.getElementById("results").innerHTML=html;
}

// UNLOCK PREMIUM
function unlock(){
  alert("Redirecting to UPI Payment...");
  window.location.href =
    "upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=200&cu=INR";
}

// AUTO LOAD USER
window.onload=function(){
  let u=localStorage.getItem("user");
  if(u){
    loggedUser=u;
    document.getElementById("loginStatus").innerText="Logged in as "+u;
  }
}

</script>

</body>
</html>
