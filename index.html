<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Level 7 SaaS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    .nav{
      padding:12px;
      text-align:center;
      background:#111827;
      color:#38bdf8;
      font-weight:bold;
      position:sticky;
      top:0;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:15px;
    }

    .card{
      background:#111827;
      border:1px solid #334155;
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #334155;
      background:#0b1220;
      color:white;
      box-sizing:border-box;
    }

    .btn{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#38bdf8;
      border:none;
      border-radius:8px;
      font-weight:bold;
      color:black;
      cursor:pointer;
    }

    .job{
      padding:12px;
      border:1px solid #334155;
      margin-top:10px;
      border-radius:10px;
      background:#0b1220;
    }

    .score{
      color:#22c55e;
      font-weight:bold;
    }

    .premium{
      border:2px dashed gold;
    }

  </style>
</head>

<body>

<div class="nav">🚀 AOV AI STARTUP - LEVEL 7 SYSTEM</div>

<div class="container">

  <!-- LOGIN -->
  <div class="card">
    <h2>🔐 Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" placeholder="Password">
    <button class="btn" onclick="login()">Login</button>
  </div>

  <!-- PROFILE -->
  <div class="card">
    <h2>📄 AI Resume Builder</h2>

    <input id="name" placeholder="Full Name">
    <input id="skills" placeholder="Skills (ai, python, ml)">
    <input id="exp" placeholder="Experience">

    <button class="btn" onclick="saveProfile()">Save Profile</button>
    <button class="btn" onclick="generateAI()">Find Jobs</button>
  </div>

  <!-- RESULTS -->
  <div class="card">
    <h2>🎯 AI Job Matches</h2>
    <div id="results"></div>
  </div>

  <!-- PREMIUM -->
  <div class="card premium">
    <h2>💎 Premium System</h2>

    <p>✔ AI Resume PDF</p>
    <p>✔ Auto Apply Jobs</p>
    <p>✔ AI Interview Bot</p>

    <img width="160"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR">

    <button class="btn" onclick="pay()">Unlock ₹200</button>
  </div>

</div>

<script>

const jobs=[
  {title:"AI Engineer",skills:["ai","python","ml"]},
  {title:"Data Analyst",skills:["data","sql"]},
  {title:"Web Developer",skills:["react","javascript"]},
  {title:"ML Intern",skills:["ml","python"]}
];

// LOGIN (simple demo)
function login(){
  alert("Login success (demo mode)");
}

// SAVE PROFILE (local DB)
function saveProfile(){
  let data={
    name:document.getElementById("name").value,
    skills:document.getElementById("skills").value,
    exp:document.getElementById("exp").value
  };

  localStorage.setItem("profile",JSON.stringify(data));
  alert("Profile saved in system");
}

// AI ENGINE
function generateAI(){

  let skills=document.getElementById("skills").value.toLowerCase().split(",");

  let results=[];

  jobs.forEach(j=>{
    let score=0;

    j.skills.forEach(s=>{
      if(skills.map(x=>x.trim()).includes(s)) score+=50;
    });

    if(score>0){
      results.push({...j,score});
    }
  });

  results.sort((a,b)=>b.score-a.score);

  let html="";

  results.forEach(r=>{
    html+=`
      <div class="job">
        <h3>${r.title}</h3>
        <p class="score">${r.score}% Match</p>

        <a class="btn" target="_blank"
        href="https://www.linkedin.com/jobs/search/?keywords=${r.title}">
        LinkedIn</a>

        <a class="btn" target="_blank"
        href="https://www.google.com/search?q=${r.title}+jobs">
        Google</a>
      </div>
    `;
  });

  document.getElementById("results").innerHTML=html;
}

// PAYMENT
function pay(){
  window.location.href =
    "upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR";
}

</script>

</body>
</html>
