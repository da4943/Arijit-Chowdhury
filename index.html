<script>
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let user = null;

/* UI */
function showLogin(){
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("form").classList.add("hidden");
}

function showApp(){
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("form").classList.remove("hidden");
}

/* AUTH STATE */
auth.onAuthStateChanged((u) => {
  if (u) {
    user = u;
    showApp();
  } else {
    user = null;
    showLogin();
  }
});

/* LOGIN FIXED (NO HANG VERSION) */
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
    .then((result) => {
      user = result.user;
      showApp();
    })
    .catch((error) => {
      console.log("LOGIN ERROR:", error);

      // FIX DOMAIN ISSUE MESSAGE
      if (error.code === "auth/unauthorized-domain") {
        alert("Add your Vercel domain in Firebase Authorized Domains");
      }

      // FALLBACK
      if (error.code === "auth/popup-blocked") {
        auth.signInWithRedirect(provider);
      }
    });
}

/* GENERATE RESUME */
function generate(){

  const data = {
    name: document.getElementById("name").value,
    age: document.getElementById("age").value,
    qualification: document.getElementById("qualification").value,
    experience: document.getElementById("experience").value,
    skills: document.getElementById("skills").value,
    about: document.getElementById("about").value,
    photo: document.getElementById("photo").value,
    declaration: document.getElementById("declaration").value,
    signature: document.getElementById("signature").value
  };

  document.getElementById("resume").innerHTML = `
    <div class="resume-box" id="resumeBox">

      <center>
        <img src="${data.photo}" width="90" style="border-radius:50%">
        <h2>${data.name}</h2>
      </center>

      <p><b>Age:</b> ${data.age}</p>
      <p><b>Qualification:</b> ${data.qualification}</p>
      <p><b>Experience:</b> ${data.experience}</p>
      <p><b>Skills:</b> ${data.skills}</p>
      <p><b>About:</b> ${data.about}</p>

      <hr>

      <p><b>Declaration:</b> ${data.declaration}</p>
      <p><b>Signature:</b> ${data.signature}</p>
      <p><b>Date:</b> ${new Date().toLocaleDateString()}</p>

    </div>
  `;
}

/* SAVE */
function save(){
  if(!user){
    alert("Login first");
    return;
  }

  db.collection("resumes").add({
    name: document.getElementById("name").value,
    email: user.email,
    createdAt: Date.now()
  });

  alert("Saved ✔");
}

/* PDF */
function downloadPDF(){
  const el = document.getElementById("resumeBox");

  if(!el){
    alert("Generate first");
    return;
  }

  html2pdf().from(el).save("resume.pdf");
}
</script>
