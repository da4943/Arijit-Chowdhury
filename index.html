<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs SaaS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .container{max-width:900px;margin:auto;padding:20px;}

    .card{
      background:#111827;
      padding:20px;
      margin-bottom:15px;
      border-radius:12px;
    }

    input,button{
      width:100%;
      padding:10px;
      margin-top:8px;
      border-radius:6px;
      border:none;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    .hidden{display:none;}

    .resume{
      background:white;
      color:black;
      padding:20px;
      border-radius:10px;
    }

    .center{text-align:center;}
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="loginBox">
    <h2>🔐 Login</h2>
    <button onclick="googleLogin()">Login with Google</button>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <!-- RESUME INPUT -->
    <div class="card">
      <h2>📄 Resume Builder</h2>

      <input id="name" placeholder="Full Name">
      <input id="father" placeholder="Father Name">
      <input id="age" placeholder="Age">
      <input id="gender" placeholder="Gender">
      <input id="address" placeholder="Address">
      <input id="skills" placeholder="Skills">
      <input id="exp" placeholder="Experience">

      <button onclick="generateResume()">Generate Resume</button>
      <button onclick="saveData()">Save to Firebase</button>
    </div>

    <!-- RESUME -->
    <div class="card">
      <div id="resume"></div>
      <button onclick="downloadPDF()">Download PDF</button>
    </div>

    <!-- PAYMENT -->
    <div class="card">
      <h2>💎 Premium ₹200</h2>

      <img width="150"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR">

      <input id="utr" placeholder="Enter UTR">
      <button onclick="submitPayment()">Submit Payment</button>
    </div>

  </div>

</div>

<script>

/* 🔥 FIREBASE CONFIG (PUT YOUR REAL DATA HERE) */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

/* ✅ GOOGLE LOGIN FIXED */
function googleLogin(){

  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .then((result) => {

    currentUser = result.user;

    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    alert("Login Success ✔ " + currentUser.displayName);

  })
  .catch((error) => {

    console.log(error);
    alert("Login Failed ❌\n" + error.message);

  });

}

/* RESUME */
function generateResume(){

  document.getElementById("resume").innerHTML = `
  <div id="resumeContent" class="resume">

    <div class="center">
      <h2>${document.getElementById("name").value}</h2>
      <p>${document.getElementById("address").value}</p>
    </div>

    <p><b>Father:</b> ${document.getElementById("father").value}</p>
    <p><b>Age:</b> ${document.getElementById("age").value}</p>
    <p><b>Gender:</b> ${document.getElementById("gender").value}</p>
    <p><b>Skills:</b> ${document.getElementById("skills").value}</p>
    <p><b>Experience:</b> ${document.getElementById("exp").value}</p>

    <h3>Declaration</h3>
    <p>I hereby declare that all information is true.</p>

  </div>`;
}

/* SAVE FIREBASE */
function saveData(){

  if(!currentUser){
    alert("Login first");
    return;
  }

  db.collection("resumes").add({
    email: currentUser.email,
    name: document.getElementById("name").value,
    time: new Date()
  });

  alert("Saved ✔");
}

/* PDF DOWNLOAD */
function downloadPDF(){

  let el = document.getElementById("resumeContent");

  if(!el){
    alert("Generate resume first");
    return;
  }

  html2pdf().from(el).save("resume.pdf");
}

/* PAYMENT */
function submitPayment(){

  if(!currentUser){
    alert("Login first");
    return;
  }

  db.collection("payments").add({
    email: currentUser.email,
    utr: document.getElementById("utr").value,
    status: "pending",
    time: new Date()
  });

  alert("Payment submitted ✔");
}

</script>

</body>
</html>
