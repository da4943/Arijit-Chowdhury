<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <script src="https://www.paypal.com/sdk/js?client-id=ATxSvTwRQxtN5NBu5Kj8GAjZCDRzCpb_aoO_L_vB9IAF-p179MOTDCtUhVEYGG1B-2P-n47P6BL4B&currency=USD"></script>

<style>

/* ================= THEMES ================= */
:root{
  --bg1:#050816;
  --bg2:#0b1220;
  --card:#111827;
  --text:white;
  --accent:#38bdf8;
}

.theme2{--bg1:#0f172a;--bg2:#1e293b;--card:#111827;--accent:#22c55e;}
.theme3{--bg1:#111827;--bg2:#000000;--card:#1f2937;--accent:#f59e0b;}
.theme4{--bg1:#1e1b4b;--bg2:#312e81;--card:#111827;--accent:#a855f7;}
.theme5{--bg1:#7f1d1d;--bg2:#000000;--card:#1f2937;--accent:#ef4444;}

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#0f172a;
}

.logo{color:var(--accent);font-size:20px;font-weight:bold;}

.social{display:flex;gap:8px;align-items:center;}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.card{
  background:var(--card);
  padding:20px;
  margin:15px;
  border-radius:15px;
}

input{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:none;
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

@media(max-width:768px){.grid{grid-template-columns:1fr;}}

/* UPI */
.qr{background:white;padding:10px;border-radius:10px;margin-top:10px;text-align:center;}

/* resume */
.resume-box{background:white;color:black;padding:20px;border-radius:12px;}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="logo">AOV AI Resume</div>

  <div class="social">
    <button onclick="openLogin()">Login</button>

    <!-- ✅ SIGNUP FIXED -->
    <button onclick="signup()">Signup</button>

    <button onclick="logout()">Logout</button>

    <!-- THEME SWITCH -->
    <select onchange="themeChange(this.value)">
      <option value="default">Theme</option>
      <option value="t1">Blue</option>
      <option value="t2">Green</option>
      <option value="t3">Dark</option>
      <option value="t4">Purple</option>
      <option value="t5">Red</option>
    </select>

  </div>
</div>

<!-- PREMIUM -->
<div class="card">
  <h2>💎 Premium Unlock</h2>

  <div class="qr">
    <p>UPI Scanner (India Only)</p>
    <img width="150" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay">
  </div>

  <div id="paypal-button-container"></div>
</div>

<!-- BUILDER -->
<div class="card">

<h2>Resume Builder</h2>

<div class="grid">
  <input id="name" placeholder="Full Name">
  <input id="father" placeholder="Father Name">
  <input id="phone" placeholder="Phone">
  <input id="email" placeholder="Email">
  <input id="age" placeholder="Age">
  <input id="address" placeholder="Address">
  <input id="qualification" placeholder="Qualification">
  <input id="experience" placeholder="Experience">
</div>

<input id="skills" placeholder="Skills">
<input id="hobbies" placeholder="Hobbies">
<input id="about" placeholder="About">

<button onclick="aiFill()">🤖 AI Auto Fill</button>
<button onclick="generate()">Generate</button>
<button onclick="atsScore()">ATS Score</button>
<button onclick="jobMatch()">Job Match</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="clearData()">Clear</button>

</div>

<div class="card">
<div id="resume"></div>
<div id="ats"></div>
<div id="jobs"></div>
</div>

<!-- LOGIN -->
<div id="loginModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000000cc;">
  <div style="background:#111827;padding:20px;width:300px;margin:100px auto;border-radius:10px;">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Signup</button>
    <button onclick="closeLogin()">Close</button>
  </div>
</div>

<script>

let resumeBox=null;

/* LOGIN */
function openLogin(){loginModal.style.display="block"}
function closeLogin(){loginModal.style.display="none"}

function signup(){alert("Signup success (demo)")}
function login(){alert("Login success (demo)")}
function logout(){alert("Logout")}

/* PAYPAL */
paypal.Buttons({
createOrder:(d,a)=>a.order.create({purchase_units:[{amount:{value:"20"}}]}),
onApprove:(d,a)=>a.order.capture().then(()=>alert("Paid ✔"))
}).render('#paypal-button-container');

/* AI AUTO FILL */
function aiFill(){
  name.value="Arijit Chowdhury";
  father.value="Amiya Chowdhury";
  phone.value="9999999999";
  email.value="test@gmail.com";
  address.value="India";
  qualification.value="B.Com";
  experience.value="Fresher";
  skills.value="HTML, CSS, JS";
  hobbies.value="Music, Travel";
  about.value="Hardworking professional";
}

/* RESUME */
function generate(){
  document.getElementById("resume").innerHTML=`
  <div class="resume-box">
    <h2>${name.value}</h2>
    <p>${father.value}</p>
    <p>${phone.value} | ${email.value}</p>
    <p>${address.value}</p>
    <hr>
    <p>${qualification.value}</p>
    <p>${experience.value}</p>
    <p>${skills.value}</p>
    <p>${hobbies.value}</p>
  </div>`;
  resumeBox=document.querySelector(".resume-box");
}

/* ATS SCORE */
function atsScore(){
  let score = Math.floor(Math.random()*40+60);
  ats.innerHTML="ATS Score: "+score+"/100";
}

/* JOB MATCH */
function jobMatch(){
  jobs.innerHTML="Matching Jobs: Data Entry, Frontend Dev, Admin Assistant";
}

/* PDF */
function downloadPDF(){
  html2pdf().from(resumeBox).save();
}

/* CLEAR */
function clearData(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  resume.innerHTML="";
  ats.innerHTML="";
  jobs.innerHTML="";
}

/* THEMES */
function themeChange(v){
  document.body.className="";
  if(v==="t2") document.body.classList.add("theme2");
  if(v==="t3") document.body.classList.add("theme3");
  if(v==="t4") document.body.classList.add("theme4");
  if(v==="t5") document.body.classList.add("theme5");
}

</script>

</body>
</html>
