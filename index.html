<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PDF LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:15px;
    }

    .card{
      background:#111827;
      padding:15px;
      margin-bottom:15px;
      border-radius:12px;
      border:1px solid #334155;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:8px;
      border-radius:8px;
      border:none;
      background:#0b1220;
      color:white;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#38bdf8;
      border:none;
      border-radius:8px;
      font-weight:bold;
    }

    .resume{
      background:white;
      color:black;
      padding:25px;
      border-radius:10px;
      line-height:1.6;
    }

    h1{
      text-align:center;
      color:#38bdf8;
    }

    .signature{
      margin-top:40px;
      text-align:right;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📄 AI Resume Builder</h1>

  <!-- FORM -->
  <div class="card">

    <input id="name" placeholder="Full Name">
    <input id="father" placeholder="Father Name">
    <input id="age" placeholder="Age">
    <input id="address" placeholder="Address">
    <input id="mobile" placeholder="Mobile Number">
    <input id="email" placeholder="Email">
    <input id="skills" placeholder="Skills (AI, Python, Marketing)">
    <input id="exp" placeholder="Experience">
    <input id="qualification" placeholder="Qualification (B.Com, MBA...)">
    <input id="edu" placeholder="Education Details">
    <input id="hobbies" placeholder="Hobbies (Reading, Traveling...)">

    <button onclick="generateResume()">Generate Resume</button>

  </div>

  <!-- RESUME -->
  <div class="card">
    <div id="resume"></div>

    <button onclick="downloadPDF()">Download PDF</button>
  </div>

</div>

<script>

function generateResume(){

  let name = document.getElementById("name").value;
  let father = document.getElementById("father").value;
  let age = document.getElementById("age").value;
  let address = document.getElementById("address").value;
  let mobile = document.getElementById("mobile").value;
  let email = document.getElementById("email").value;
  let skills = document.getElementById("skills").value;
  let exp = document.getElementById("exp").value;
  let qualification = document.getElementById("qualification").value;
  let edu = document.getElementById("edu").value;
  let hobbies = document.getElementById("hobbies").value;

  // current date auto
  let today = new Date().toLocaleDateString();

  let html = `
    <div class="resume" id="resumeContent">

      <h2 style="text-align:center">${name}</h2>

      <p><b>Father Name:</b> ${father}</p>
      <p><b>Age:</b> ${age}</p>
      <p><b>Address:</b> ${address}</p>
      <p><b>Mobile:</b> ${mobile}</p>
      <p><b>Email:</b> ${email}</p>

      <hr>

      <h3>Profile Summary</h3>
      <p>
        A highly motivated professional with qualification in ${qualification}.
        Skilled in ${skills} with experience in ${exp}.
        Looking for opportunities to grow and contribute effectively.
      </p>

      <h3>Skills</h3>
      <p>${skills}</p>

      <h3>Experience</h3>
      <p>${exp}</p>

      <h3>Qualification</h3>
      <p>${qualification}</p>

      <h3>Education</h3>
      <p>${edu}</p>

      <h3>Hobbies / Interests</h3>
      <p>${hobbies}</p>

      <!-- SIGNATURE SECTION -->
      <div class="signature">
        <p>Date: ${today}</p>
        <p>Yours faithfully,</p>
        <br><br>
        <p><b>${name}</b></p>
      </div>

    </div>
  `;

  document.getElementById("resume").innerHTML = html;
}

// PDF DOWNLOAD
function downloadPDF(){

  let element = document.getElementById("resumeContent");

  if(!element){
    alert("Generate resume first");
    return;
  }

  html2pdf().from(element).save("My_Resume.pdf");
}

</script>

</body>
</html>
