<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBpJQ44k1gokp3sSZggyESC7HpvqssClEE",
      authDomain: "aov-ai-jobs-c697d.firebaseapp.com",
      projectId: "aov-ai-jobs-c697d",
      storageBucket: "aov-ai-jobs-c697d.firebasestorage.app",
      messagingSenderId: "898401199585",
      appId: "1:898401199585:web:59e6fdeba0568d6255dea0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.firebaseAuth = auth;
    window.firebaseLogin = signInWithEmailAndPassword;
    window.firebaseSignup = createUserWithEmailAndPassword;
    window.firebaseLogout = signOut;
    window.firebaseOnAuth = onAuthStateChanged;
  </script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#050816,#0b1220);
      color:white;
    }

    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      background:#0f172a;
    }

    .logo{
      font-size:20px;
      font-weight:bold;
      color:#38bdf8;
    }

    .social button{
      margin-left:10px;
      padding:10px 14px;
      border-radius:8px;
      border:none;
      font-weight:bold;
      cursor:pointer;
    }

    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}

    .container{
      max-width:1000px;
      margin:auto;
      padding:15px;
    }

    .hero{
      text-align:center;
      padding:25px;
    }

    .hero h1{
      font-size:28px;
      color:#38bdf8;
    }

    .card{
      background:#111827;
      padding:20px;
      margin-top:15px;
      border-radius:15px;
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}

    .resume-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:12px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    @media(max-width:768px){
      .grid{grid-template-columns:1fr}
    }

    .modal{
      display:none;
      position:fixed;
      top:0;left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.7);
    }

    .modal-box{
      width:300px;
      margin:100px auto;
      background:#111827;
      padding:20px;
      border-radius:12px;
    }
  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>

  <div class="social">
    <button onclick="openLogin()">Login</button>
    <button onclick="logout()">Logout</button>

    <a href="https://www.google.com/search?q=jobs" target="_blank">
      <button class="google">Google</button>
    </a>
    <a href="https://www.linkedin.com/jobs/" target="_blank">
      <button class="linkedin">LinkedIn</button>
    </a>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1>Create Professional Resume in Seconds</h1>
    <p id="userStatus">Not logged in</p>
  </div>

  <!-- PREMIUM -->
  <div class="card">
    <h2>💎 Unlock Premium ₹200</h2>
    <p>Scan QR and send screenshot to WhatsApp for activation</p>

    <img width="200"
      style="background:white;padding:10px;border-radius:10px"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=yourupi@bank&pn=AOV%20AI&am=200&cu=INR">

    <button onclick="verifyPayment()">I Paid (Send Screenshot)</button>
  </div>

  <!-- BUILDER -->
  <div class="card">
    <h2>Resume Builder</h2>

    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="age" placeholder="Age">
      <input id="qualification" placeholder="Qualification">
      <input id="experience" placeholder="Experience">
    </div>

    <input id="skills" placeholder="Skills">
    <input id="hobbies" placeholder="Hobbies">
    <input id="about" placeholder="About You">

    <input type="file" id="photoUpload">

    <input id="declaration" placeholder="Declaration">
    <input id="signature" placeholder="Signature">

    <button onclick="generate()">Generate Resume</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
    <button onclick="downloadImage()">Download Image</button>
    <button class="btn-clear" onclick="clearData()">Clear Data</button>
  </div>

  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3>Login</h3>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
    <button onclick="closeLogin()">Close</button>
  </div>
</div>

<script>

let photoData="";
let resumeBox=null;

/* LOGIN */
function openLogin(){ document.getElementById("loginModal").style.display="block"; }
function closeLogin(){ document.getElementById("loginModal").style.display="none"; }

async function login(){
  try{
    await firebaseLogin(firebaseAuth, email.value, password.value);
    alert("Login Success");
    closeLogin();
  }catch(e){ alert(e.message); }
}

async function signup(){
  try{
    await firebaseSignup(firebaseAuth, email.value, password.value);
    alert("Account Created");
    closeLogin();
  }catch(e){ alert(e.message); }
}

async function logout(){
  await firebaseLogout(firebaseAuth);
  alert("Logged out");
}

firebaseOnAuth(firebaseAuth,(user)=>{
  document.getElementById("userStatus").innerText =
    user ? "Logged in: " + user.email : "Not logged in";
});

/* MANUAL PAYMENT */
function verifyPayment(){
  window.open("https://wa.me/91XXXXXXXXXX?text=I%20have%20paid%20for%20AOV%20AI%20Resume%20Premium.%20Here%20is%20my%20screenshot", "_blank");
}

/* PHOTO */
photoUpload.onchange=e=>{
  if(!e.target.files.length) return;
  const r=new FileReader();
  r.onload=()=>photoData=r.result;
  r.readAsDataURL(e.target.files[0]);
};

/* GENERATE */
function generate(){
  document.getElementById("resume").innerHTML=`
    <div class="resume-box" id="resumeBox">
      <center>
        ${photoData?`<img src="${photoData}" width="100" style="border-radius:50%">`:""}
        <h2>${name.value}</h2>
        <p>${qualification.value}</p>
      </center>
      <hr>
      <p>${experience.value}</p>
      <p>${skills.value}</p>
      <p>${about.value}</p>
    </div>
  `;
  resumeBox=document.getElementById("resumeBox");
}

/* DOWNLOAD */
function downloadPDF(){
  if(!resumeBox){alert("Generate first");return;}
  html2pdf().from(resumeBox).save("resume.pdf");
}

function downloadImage(){
  if(!resumeBox){alert("Generate first");return;}
  html2canvas(resumeBox).then(c=>{
    let a=document.createElement("a");
    a.download="resume.png";
    a.href=c.toDataURL();
    a.click();
  });
}

/* CLEAR */
function clearData(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  document.getElementById("resume").innerHTML="";
  resumeBox=null;
}

</script>

</body>
</html>
