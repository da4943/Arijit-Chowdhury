<!DOCTYPE html>
<html>
<head>
  <title>AOV Resume FIX TEST</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:#0b1220;color:white}
    .card{padding:20px;background:#111827;margin:10px;border-radius:10px}
    .hidden{display:none}
    input,button{width:100%;padding:10px;margin-top:8px}
  </style>
</head>

<body>

<div class="card" id="loginBox">
  <h2>Login</h2>
  <button onclick="login()">Login with Google</button>
</div>

<div class="card hidden" id="form">

  <input id="name" placeholder="Name">
  <input id="age" placeholder="Age">
  <input id="qualification" placeholder="Qualification">
  <input id="experience" placeholder="Experience">
  <input id="skills" placeholder="Skills">
  <input id="about" placeholder="About">
  <input id="photo" placeholder="Photo URL">
  <input id="declaration" placeholder="Declaration">
  <input id="signature" placeholder="Signature">

  <button onclick="generate()">Generate</button>
  <button onclick="save()">Save</button>
  <button onclick="downloadPDF()">Download PDF</button>
</div>

<div class="card">
  <div id="resume"></div>
</div>

<script>

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let user = null;

/* AUTH */
auth.onAuthStateChanged(u=>{
  user = u;

  if(user){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("form").classList.remove("hidden");
  } else {
    document.getElementById("loginBox").style.display="block";
    document.getElementById("form").classList.add("hidden");
  }
});

/* LOGIN */
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
  .catch(e=>{
    alert(e.message);
    console.log(e);
  });
}

/* GENERATE */
function generate(){

  document.getElementById("resume").innerHTML = `
    <div style="background:white;color:black;padding:20px">
      <center>
        <img src="${photo.value}" width="80" style="border-radius:50%">
        <h2>${name.value}</h2>
      </center>

      <p>Age: ${age.value}</p>
      <p>Qualification: ${qualification.value}</p>
      <p>Experience: ${experience.value}</p>
      <p>Skills: ${skills.value}</p>
      <p>About: ${about.value}</p>

      <hr>

      <p>${declaration.value}</p>
      <p>${signature.value}</p>
      <p>Date: ${new Date().toLocaleDateString()}</p>
    </div>
  `;
}

/* SAVE */
function save(){
  if(!user) return alert("Login first");

  db.collection("resumes").add({
    name:name.value,
    email:user.email
  });

  alert("Saved");
}

/* PDF */
function downloadPDF(){
  const el = document.querySelector("#resume div");
  if(!el) return alert("Generate first");

  html2pdf().from(el).save("resume.pdf");
}

</script>

</body>
</html>
