<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
    }

    header {
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      color: #38bdf8;
    }

    p {
      color: #cbd5e1;
    }

    .search {
      margin-top: 10px;
      padding: 14px;
      width: 60%;
      border-radius: 12px;
      border: none;
      font-size: 16px;
    }

    select.search {
      width: 62%;
    }

    .btn {
      background: #38bdf8;
      color: black;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      display: inline-block;
      margin-top: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      padding: 20px;
      border-radius: 15px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .job-type {
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>AOV AI Jobs</h1>
  <p>AI-powered job discovery platform</p>

  <input id="jobSearch" class="search" type="text" placeholder="Search jobs..." onkeyup="searchJobs()">

  <br><br>

  <input id="userSkill" class="search" type="text" placeholder="Enter your skill (AI, Python, Marketing...)">

  <br><br>

  <select id="experience" class="search">
    <option value="">Select Experience</option>
    <option value="intern">Fresher / Intern</option>
    <option value="junior">1-2 Years</option>
    <option value="senior">3+ Years</option>
  </select>

  <br><br>

  <a class="btn" onclick="matchJobs()">Find Best Jobs</a>
</header>

<div class="container" id="jobContainer"></div>

<script>
const jobs = [
  {
    title: "AI Developer",
    description: "Work on AI models and automation",
    type: "senior"
  },
  {
    title: "Machine Learning Intern",
    description: "Assist ML projects",
    type: "intern"
  },
  {
    title: "Freelance Chatbot Builder",
    description: "Build bots for clients",
    type: "junior"
  },
  {
    title: "Data Analyst",
    description: "Analyze data and trends",
    type: "junior"
  }
];

// Display jobs
function displayJobs(list) {
  const container = document.getElementById("jobContainer");
  container.innerHTML = "";

  list.forEach(job => {
    container.innerHTML += `
      <div class="card">
        <h2>${job.title}</h2>
        <p>${job.description}</p>
        <p class="job-type">${job.type}</p>
        <a class="btn" href="#">Apply</a>
      </div>
    `;
  });
}

// Search function (FIXED)
function searchJobs() {
  let input = document.getElementById("jobSearch").value.toLowerCase().trim();
  const container = document.getElementById("jobContainer");

  if (input === "") {
    displayJobs(jobs);
    return;
  }

  let filtered = jobs.filter(job =>
    job.title.toLowerCase().includes(input) ||
    job.description.toLowerCase().includes(input)
  );

  if (filtered.length > 0) {
    displayJobs(filtered);
  } else {
    container.innerHTML = `
      <div class="card">
        <h2>No results found</h2>
        <p>Search more jobs online</p>
        <a class="btn" target="_blank" href="https://www.google.com/search?q=${input}+jobs">
          Search "${input}" jobs on Google
        </a>
      </div>
    `;
  }
}

// AI Matching
function matchJobs() {
  let skill = document.getElementById("userSkill").value.toLowerCase().trim();
  let exp = document.getElementById("experience").value;

  let filtered = jobs.filter(job =>
    (job.title.toLowerCase().includes(skill) ||
     job.description.toLowerCase().includes(skill)) &&
    (exp === "" || job.type === exp)
  );

  if (filtered.length > 0) {
    displayJobs(filtered);
  } else {
    document.getElementById("jobContainer").innerHTML = `
      <div class="card">
        <h2>No perfect match</h2>
        <p>Try different skill or search online</p>
      </div>
    `;
  }
}

// Load default jobs
displayJobs(jobs);
</script>

</body>
</html>
