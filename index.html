<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <script src="https://www.paypal.com/sdk/js?client-id=ATxSvTwRQxtN5NBu5Kj8GAjZCDRzCpb_aoO_L_vB9IAF-p179MOTDCtUhVEYGG1B-2P-n47P6BL4B&currency=USD"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#050816,#0b1220);
      color:white;
    }

    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
      background:#0f172a;
    }

    .logo{color:#38bdf8;font-size:20px;font-weight:bold;}

    .social button{
      margin-left:8px;
      padding:10px;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}

    .container{
      max-width:1000px;
      margin:auto;
      padding:15px;
    }

    .card{
      background:#111827;
      padding:20px;
      border-radius:15px;
      margin-top:15px;
    }

    .builder-title{
      font-size:22px;
      color:#38bdf8;
      text-align:center;
      margin-bottom:15px;
    }

    .builder-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .field-box{
      background:#0b1220;
      padding:15px;
      border-radius:12px;
      border:1px solid #1f2937;
    }

    input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:none;
      outline:none;
      background:#111827;
      color:white;
    }

    .full-width{grid-column:span 2;}

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
      background:#38bdf8;
    }

    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}

    .resume-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:12px;
    }

    .upi{
      text-align:center;
      margin-top:10px;
      background:#0b1220;
      padding:15px;
      border-radius:10px;
    }

    @media(max-width:768px){
      .builder-grid{grid-template-columns:1fr;}
      .full-width{grid-column:auto;}
    }

    /* LOGIN MODAL */
    .modal{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:#000000cc;
    }

    .modal-box{
      width:300px;
      margin:120px auto;
      background:#111827;
      padding:20px;
      border-radius:10px;
    }

  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>

  <div class="social">
    <button onclick="openLogin()">Login</button>
    <button onclick="signup()">Signup</button>
    <button onclick="logout()">Logout</button>

    <button class="google"><i class="bi bi-google"></i> Google</button>
    <button class="linkedin"><i class="bi bi-linkedin"></i> LinkedIn</button>
  </div>
</div>

<div class="container">

  <!-- PREMIUM -->
  <div class="card">
    <h2 class="builder-title">💎 Premium ₹200</h2>

    <div class="upi">
      <p>Scan UPI QR to Pay</p>

      <img width="160"
        src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=upi://pay?pa=yourupi@bank&pn=AOV&am=200&cu=INR">

      <button onclick="markPaid()">I Have Paid</button>
    </div>

    <div id="paypal-button-container"></div>
  </div>

  <!-- BUILDER (UNCHANGED) -->
  <div class="card">

    <h2 class="builder-title">🔥 Resume Builder Pro</h2>

    <div class="builder-grid">

      <div class="field-box"><input id="name" placeholder="Full Name"></div>
      <div class="field-box"><input id="father" placeholder="Father Name"></div>
      <div class="field-box"><input id="phone" placeholder="Phone"></div>
      <div class="field-box"><input id="email" placeholder="Email"></div>
      <div class="field-box"><input id="age" placeholder="Age"></div>
      <div class="field-box"><input id="address" placeholder="Address"></div>
      <div class="field-box"><input id="qualification" placeholder="Qualification"></div>
      <div class="field-box"><input id="experience" placeholder="Experience"></div>

      <div class="field-box full-width"><input id="skills" placeholder="Skills"></div>
      <div class="field-box full-width"><input id="hobbies" placeholder="Hobbies"></div>
      <div class="field-box full-width"><input id="about" placeholder="About You"></div>

    </div>

    <button onclick="generate()">Generate Resume</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
    <button class="btn-clear" onclick="clearData()">Clear</button>

  </div>

  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="closeLogin()">Close</button>
  </div>
</div>

<script>

let resumeBox=null;

/* LOGIN */
function openLogin(){loginModal.style.display="block";}
function closeLogin(){loginModal.style.display="none";}
function signup(){alert("Signup success (demo)");}
function login(){alert("Login success (demo)");}
function logout(){alert("Logout");}

/* UPI PAID */
function markPaid(){
  localStorage.setItem("premium","yes");
  alert("Payment marked ✔ Admin will verify");
}

/* PAYPAL */
paypal.Buttons({
createOrder:(d,a)=>a.order.create({purchase_units:[{amount:{value:"200"}}]}),
onApprove:(d,a)=>a.order.capture().then(()=>alert("Paid ✔ Premium Active"))
}).render('#paypal-button-container');

/* RESUME */
function generate(){
  document.getElementById("resume").innerHTML=`
    <div class="resume-box">
      <h2>${name.value}</h2>
      <p>${father.value}</p>
      <p>${phone.value} | ${email.value}</p>
      <p>${address.value}</p>
      <hr>
      <p>${qualification.value}</p>
      <p>${experience.value}</p>
      <p>${skills.value}</p>
      <p>${hobbies.value}</p>
      <p>${about.value}</p>
    </div>
  `;
  resumeBox=document.querySelector(".resume-box");
}

/* PDF */
function downloadPDF(){
  if(localStorage.getItem("premium")!=="yes"){
    alert("Premium Required ₹200");
    return;
  }
  html2pdf().from(resumeBox).save();
}

/* CLEAR */
function clearData(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  resume.innerHTML="";
  resumeBox=null;
}

</script>

</body>
</html>
