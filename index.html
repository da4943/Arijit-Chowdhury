<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Level 3 Startup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#ff9933,#ffffff,#138808);
      color:#0f172a;
    }

    header{
      text-align:center;
      padding:20px;
      background:rgba(255,255,255,0.9);
      border-bottom:3px solid #138808;
    }

    h1{
      margin:0;
      font-size:34px;
    }

    .container{
      max-width:950px;
      margin:auto;
      padding:15px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:15px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:12px;
      box-shadow:0 8px 20px rgba(0,0,0,0.15);
    }

    input{
      width:100%;
      padding:12px;
      margin:6px 0;
      border-radius:8px;
      border:1px solid #ccc;
    }

    .btn{
      width:100%;
      padding:12px;
      background:#138808;
      color:white;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }

    .skill-box{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .skill{
      padding:6px 10px;
      background:#f1f5f9;
      border-radius:20px;
      cursor:pointer;
      border:1px solid #cbd5e1;
      font-size:13px;
    }

    .skill:hover{
      background:#ff9933;
      color:white;
    }

    .job{
      border:1px solid #e2e8f0;
      padding:12px;
      border-radius:10px;
      margin-top:10px;
    }

    .score{
      font-weight:bold;
      color:#16a34a;
    }

    .qr{
      width:160px;
    }

    .center{
      text-align:center;
    }
  </style>
</head>

<body>

<header>
  <h1>AI JOBS - LEVEL 3 STARTUP</h1>
  <p>Smart AI Resume + Global Job Matching System</p>
</header>

<div class="container grid">

  <!-- PROFILE -->
  <div class="card">
    <h2>📄 AI Profile Builder</h2>

    <input id="name" placeholder="Full Name">
    <input id="skills" placeholder="Skills (comma separated)">
    <input id="exp" placeholder="Experience (fresher/junior/senior)">

    <button class="btn" onclick="generateAI()">Generate AI Jobs</button>
  </div>

  <!-- SKILLS LIBRARY -->
  <div class="card">
    <h2>🔥 Quick Skills</h2>

    <div class="skill-box">
      <div class="skill" onclick="addSkill('ai')">AI</div>
      <div class="skill" onclick="addSkill('python')">Python</div>
      <div class="skill" onclick="addSkill('ml')">ML</div>
      <div class="skill" onclick="addSkill('data')">Data</div>
      <div class="skill" onclick="addSkill('sql')">SQL</div>
      <div class="skill" onclick="addSkill('react')">React</div>
      <div class="skill" onclick="addSkill('javascript')">JavaScript</div>
      <div class="skill" onclick="addSkill('chatbot')">Chatbot</div>
      <div class="skill" onclick="addSkill('marketing')">Marketing</div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="card">
    <h2>🎯 AI Job Matches</h2>
    <div id="results"></div>
  </div>

  <!-- RESUME -->
  <div class="card">
    <h2>📄 Resume Preview</h2>
    <div id="resume"></div>
  </div>

  <!-- PAYMENT -->
  <div class="card center">
    <h2>💳 Premium Unlock</h2>

    <p><b>AI Resume + Job Boost Access</b></p>
    <p><b>Price: ₹200</b></p>

    <img class="qr"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=200&cu=INR">

    <button class="btn" onclick="pay()">Pay Now</button>
  </div>

</div>

<script>

const jobs = [
  {title:"AI Engineer",skills:["ai","python","ml"],level:"senior"},
  {title:"ML Intern",skills:["ml","python"],level:"fresher"},
  {title:"Data Analyst",skills:["data","sql"],level:"junior"},
  {title:"Web Developer",skills:["react","javascript"],level:"junior"},
  {title:"Chatbot Developer",skills:["chatbot","ai"],level:"junior"},
  {title:"Marketing Executive",skills:["marketing"],level:"fresher"}
];

// ADD SKILL
function addSkill(skill){
  let input=document.getElementById("skills");
  input.value += (input.value ? "," : "") + skill;
}

// AI ENGINE (LEVEL 3)
function generateAI(){

  let skills=document.getElementById("skills").value.toLowerCase().split(",");
  let exp=document.getElementById("exp").value.toLowerCase();

  let results=[];

  jobs.forEach(job=>{
    let score=0;

    job.skills.forEach(s=>{
      if(skills.map(x=>x.trim()).includes(s)) score+=50;
    });

    if(exp.includes(job.level)) score+=20;

    if(score>0){
      results.push({...job,score});
    }
  });

  results.sort((a,b)=>b.score-a.score);

  let html="";

  results.forEach(j=>{
    html+=`
      <div class="job">
        <h3>${j.title}</h3>
        <p class="score">${j.score}% Match</p>

        <a class="btn" target="_blank"
        href="https://www.linkedin.com/jobs/search/?keywords=${j.title}">
        LinkedIn Jobs</a>

        <a class="btn" target="_blank"
        href="https://www.google.com/search?q=${j.title}+jobs">
        Google Jobs</a>
      </div>
    `;
  });

  document.getElementById("results").innerHTML=html;

  // resume preview auto
  document.getElementById("resume").innerHTML=`
    <p><b>Name:</b> ${document.getElementById("name").value}</p>
    <p><b>Skills:</b> ${document.getElementById("skills").value}</p>
    <p><b>Experience:</b> ${document.getElementById("exp").value}</p>
  `;
}

// payment
function pay(){
  window.location.href =
    "upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=200&cu=INR";
}

</script>

</body>
</html>
