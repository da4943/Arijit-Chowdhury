<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - REAL SaaS</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    .nav{
      display:flex;
      justify-content:space-between;
      padding:15px;
      background:linear-gradient(90deg, orange, white, green);
      color:black;
      font-weight:bold;
      position:sticky;
      top:0;
    }

    .nav button{
      margin-left:8px;
      padding:8px 12px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      background:#111827;
      color:white;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:20px;
    }

    .hero{
      text-align:center;
      padding:60px 20px;
    }

    .btn{
      background:#38bdf8;
      border:none;
      padding:12px 20px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
      margin-top:10px;
    }

    .card{
      background:#111827;
      padding:20px;
      border-radius:12px;
      margin:15px 0;
    }

    .modal{
      display:none;
      position:fixed;
      top:0;left:0;
      width:100%;height:100%;
      background:rgba(0,0,0,0.7);
      justify-content:center;
      align-items:center;
    }

    .modal-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:10px;
      width:300px;
    }
  </style>
</head>

<body>

<div class="nav">
  <div>AOV AI SaaS PRO</div>
  <div>
    <button onclick="scrollTo('home')">Home</button>
    <button onclick="scrollTo('features')">Features</button>
    <button onclick="scrollTo('premium')">Premium</button>
    <button onclick="openLogin()">Login</button>
  </div>
</div>

<div class="container">

  <div id="home" class="hero">
    <h1>AI Resume Builder SaaS</h1>
    <p>Real working system with login + unlock</p>
    <button class="btn" onclick="scrollTo('features')">Start</button>
  </div>

  <div id="features" class="card">
    <h2>Features</h2>
    <p>✔ Resume Builder</p>
    <p>✔ PDF Download</p>
    <p>✔ Premium Unlock System</p>
  </div>

  <div id="premium" class="card">
    <h2>Premium</h2>

    <p id="status">Status: FREE USER</p>

    <button class="btn" id="buyBtn" onclick="buyPremium()">
      Unlock ₹200
    </button>
  </div>

</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3>Login</h3>
    <input id="email" placeholder="Email">
    <button class="btn" onclick="login()">Login</button>
  </div>
</div>

<script>

let user = null;

// LOAD USER
window.onload = () => {
  user = localStorage.getItem("user");

  if(user){
    closeLogin();
  }
};

// NAV
function scrollTo(id){
  document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

// LOGIN
function openLogin(){
  document.getElementById("loginModal").style.display="flex";
}

function closeLogin(){
  document.getElementById("loginModal").style.display="none";
}

function login(){
  const email = document.getElementById("email").value;

  if(!email){
    alert("Enter email");
    return;
  }

  localStorage.setItem("user", email);
  user = email;

  closeLogin();
  alert("Logged in: " + email);
}

// PREMIUM BUY (REAL LOGIC)
function buyPremium(){
  if(!user){
    alert("Login first");
    return;
  }

  localStorage.setItem("premium", "true");

  document.getElementById("status").innerText =
    "Status: PREMIUM ACTIVE ✔";

  document.getElementById("buyBtn").innerText =
    "Already Unlocked";

  alert("Premium unlocked (demo logic ready for Razorpay/Paddle)");
}

// CHECK PREMIUM
window.onload = () => {
  user = localStorage.getItem("user");

  if(localStorage.getItem("premium") === "true"){
    document.getElementById("status").innerText =
      "Status: PREMIUM ACTIVE ✔";

    document.getElementById("buyBtn").innerText =
      "Already Unlocked";
  }
};

</script>

</body>
</html>
