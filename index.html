<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume SaaS FIXED</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .card{
      background:#111827;
      margin:10px;
      padding:20px;
      border-radius:12px;
    }

    .hidden{display:none}

    input,button{
      width:100%;
      padding:12px;
      margin-top:8px;
      border-radius:8px;
      border:none;
      font-size:16px;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    .title{
      text-align:center;
      font-size:20px;
      font-weight:bold;
    }

    .resume-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:12px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div class="card" id="loginBox">
  <div class="title">AOV AI SaaS LOGIN</div>
  <button onclick="login()">🔵 Continue with Google</button>
</div>

<!-- FORM -->
<div class="card hidden" id="form">

  <input id="name" placeholder="Name">
  <input id="age" placeholder="Age">
  <input id="qualification" placeholder="Qualification">
  <input id="experience" placeholder="Experience">
  <input id="skills" placeholder="Skills">
  <input id="about" placeholder="About">
  <input id="photo" placeholder="Photo URL">
  <input id="declaration" placeholder="Declaration">
  <input id="signature" placeholder="Signature">

  <button onclick="generate()">Generate Resume</button>
  <button onclick="save()">Save</button>
  <button onclick="downloadPDF()">Download PDF</button>
</div>

<!-- PREVIEW -->
<div class="card">
  <div id="resume"></div>
</div>

<script>

window.onerror = function(e){
  console.log("ERROR:", e);
};

/* FIREBASE CONFIG (REPLACE THIS) */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let user = null;

/* UI */
function showLogin(){
  document.getElementById("loginBox").style.display="block";
  document.getElementById("form").classList.add("hidden");
}

function showApp(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("form").classList.remove("hidden");
}

/* AUTH */
auth.onAuthStateChanged(u=>{
  user = u;
  if(u){
    showApp();
  } else {
    showLogin();
  }
});

/* LOGIN FIX (MOBILE + LAPTOP SAFE) */
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();

  firebase.auth().signInWithPopup(provider)
  .then(res=>{
    user = res.user;
    showApp();
  })
  .catch(err=>{
    console.log(err);

    if(err.code === "auth/popup-blocked"){
      firebase.auth().signInWithRedirect(provider);
    }

    if(err.code === "auth/unauthorized-domain"){
      alert("Add your Vercel domain in Firebase Authorized Domains");
    }
  });
}

/* GENERATE RESUME */
function generate(){

  const name = document.getElementById("name").value;
  const age = document.getElementById("age").value;
  const qualification = document.getElementById("qualification").value;
  const experience = document.getElementById("experience").value;
  const skills = document.getElementById("skills").value;
  const about = document.getElementById("about").value;
  const photo = document.getElementById("photo").value;
  const declaration = document.getElementById("declaration").value;
  const signature = document.getElementById("signature").value;

  document.getElementById("resume").innerHTML = `
    <div class="resume-box" id="resumeBox">

      <center>
        <img src="${photo}" width="90" style="border-radius:50%">
        <h2>${name}</h2>
      </center>

      <p><b>Age:</b> ${age}</p>
      <p><b>Qualification:</b> ${qualification}</p>
      <p><b>Experience:</b> ${experience}</p>
      <p><b>Skills:</b> ${skills}</p>
      <p><b>About:</b> ${about}</p>

      <hr>

      <p><b>Declaration:</b> ${declaration}</p>
      <p><b>Signature:</b> ${signature}</p>
      <p><b>Date:</b> ${new Date().toLocaleDateString()}</p>

    </div>
  `;
}

/* SAVE */
function save(){

  if(!user){
    alert("Login first");
    return;
  }

  const name = document.getElementById("name").value;

  db.collection("resumes").add({
    name: name,
    email: user.email,
    time: Date.now()
  });

  alert("Saved ✔");
}

/* PDF */
function downloadPDF(){
  const el = document.getElementById("resumeBox");
  if(!el){
    alert("Generate first");
    return;
  }

  html2pdf().from(el).save("resume.pdf");
}

</script>

</body>
</html>
