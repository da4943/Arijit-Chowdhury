<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Cloud SaaS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase (CORRECT VERSION) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    h1{
      text-align:center;
      color:#38bdf8;
      margin-bottom:5px;
    }

    .subtitle{
      text-align:center;
      color:#9ca3af;
      margin-bottom:20px;
    }

    .card{
      background:#111827;
      padding:20px;
      margin-bottom:15px;
      border-radius:12px;
      border:1px solid #334155;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:8px;
      border-radius:8px;
      border:none;
      background:#0b1220;
      color:white;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#38bdf8;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .job{
      margin-top:10px;
      padding:12px;
      border:1px solid #334155;
      border-radius:8px;
      background:#0b1220;
    }

    .job a{
      display:block;
      margin-top:5px;
      color:#38bdf8;
    }

    .premium{
      border:2px solid gold;
      text-align:center;
    }

    img{
      margin-top:10px;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>🚀 AOV AI Jobs</h1>
  <p class="subtitle">AI Resume Builder + Smart Job Matching System</p>

  <!-- PROFILE -->
  <div class="card">
    <h2>📄 Profile</h2>

    <input id="name" placeholder="Full Name">
    <input id="skills" placeholder="Skills (ai, python, marketing)">
    <input id="exp" placeholder="Experience">

    <button onclick="generateResume()">Generate Resume</button>
    <button onclick="generateJobs()">Find Jobs</button>
  </div>

  <!-- RESUME -->
  <div class="card">
    <h2>📑 Resume</h2>
    <div id="resume"></div>
    <button onclick="downloadPDF()">Download PDF</button>
  </div>

  <!-- JOBS -->
  <div class="card">
    <h2>🎯 AI Job Matches</h2>
    <div id="jobs"></div>
  </div>

  <!-- PAYMENT -->
  <div class="card premium">
    <h2>💎 Premium ₹200</h2>

    <p>Scan QR to pay</p>

    <img width="150"
    src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR">

    <input id="utr" placeholder="Enter UTR Number">
    <button onclick="submitPayment()">Submit Payment</button>
  </div>

  <!-- ADMIN -->
  <div class="card">
    <h2>👑 Admin Panel</h2>

    <input id="adminPass" placeholder="Password">
    <button onclick="loginAdmin()">Login</button>

    <div id="adminData"></div>
  </div>

</div>

<script>

// ✅ YOUR REAL FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyC-HL4tCUEscc3zYX-505wwlxJZocejMD4",
  authDomain: "aov-ai-jobs.firebaseapp.com",
  projectId: "aov-ai-jobs",
  storageBucket: "aov-ai-jobs.firebasestorage.app",
  messagingSenderId: "109315377636",
  appId: "1:109315377636:web:7b1e8ca0536186a74adff1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// JOB DATA
const jobs = [
  {title:"AI Developer",skills:["ai","python"]},
  {title:"Data Analyst",skills:["data","sql"]},
  {title:"Web Developer",skills:["javascript","react"]}
];

// RESUME
function generateResume(){

  let name = document.getElementById("name").value;
  let skills = document.getElementById("skills").value;
  let exp = document.getElementById("exp").value;

  document.getElementById("resume").innerHTML = `
    <div id="resumeContent" style="background:white;color:black;padding:20px;border-radius:10px;">
      <h2 style="text-align:center">${name}</h2>
      <hr>
      <p><b>Skills:</b> ${skills}</p>
      <p><b>Experience:</b> ${exp}</p>
    </div>
  `;
}

// JOB MATCH
function generateJobs(){

  let skills = document.getElementById("skills").value.toLowerCase().split(/[\s,]+/);

  let html="";

  jobs.forEach(j=>{

    let score = j.skills.filter(s => skills.includes(s)).length * 50;

    if(score>0){
      html+=`
        <div class="job">
          <h3>${j.title}</h3>
          <p>Match: ${score}%</p>

          <a target="_blank" href="https://www.linkedin.com/jobs/search/?keywords=${j.title}">
          🔗 LinkedIn Jobs</a>

          <a target="_blank" href="https://www.google.com/search?q=${j.title}+jobs">
          🌐 Google Jobs</a>
        </div>
      `;
    }
  });

  if(html==="") html="<p>No jobs found. Try more skills.</p>";

  document.getElementById("jobs").innerHTML = html;
}

// PDF
function downloadPDF(){

  let el = document.getElementById("resumeContent");

  if(!el){
    alert("Generate resume first");
    return;
  }

  html2pdf().from(el).save("Resume.pdf");
}

// PAYMENT
function submitPayment(){

  let utr = document.getElementById("utr").value;

  if(utr.length < 6){
    alert("Enter valid UTR");
    return;
  }

  db.collection("payments").add({
    utr: utr,
    status: "pending"
  });

  alert("Payment submitted. Wait for approval.");
}

// ADMIN LOGIN
function loginAdmin(){

  let pass = document.getElementById("adminPass").value;

  if(pass !== "admin123"){
    alert("Wrong password");
    return;
  }

  loadPayments();
}

// LOAD PAYMENTS
function loadPayments(){

  db.collection("payments").get().then(snapshot=>{

    let html="";

    snapshot.forEach(doc=>{
      let data = doc.data();

      html+=`
        <div class="job">
          <p><b>UTR:</b> ${data.utr}</p>
          <p>Status: ${data.status}</p>
          <button onclick="approve('${doc.id}')">Approve</button>
        </div>
      `;
    });

    document.getElementById("adminData").innerHTML = html;
  });
}

// APPROVE
function approve(id){

  db.collection("payments").doc(id).update({
    status: "approved"
  });

  alert("Approved ✅");
  loadPayments();
}

</script>

</body>
</html>
