<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Cloud SaaS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:#0f172a;color:white;}
    .container{max-width:900px;margin:auto;padding:20px;}
    .card{background:#111827;padding:20px;margin-bottom:15px;border-radius:10px;}
    input{width:100%;padding:10px;margin-top:8px;border-radius:6px;border:none;}
    button{width:100%;padding:10px;margin-top:10px;background:#38bdf8;border:none;border-radius:6px;font-weight:bold;}
    .job{margin-top:10px;padding:10px;border:1px solid #334155;border-radius:8px;}
  </style>
</head>

<body>

<div class="container">

<h1>🚀 AOV AI Jobs</h1>

<!-- PROFILE -->
<div class="card">
  <h2>📄 Profile</h2>

  <input id="name" placeholder="Full Name">
  <input id="skills" placeholder="Skills (ai, python)">
  <input id="exp" placeholder="Experience">

  <button onclick="generateResume()">Generate Resume</button>
  <button onclick="generateJobs()">Find Jobs</button>
</div>

<!-- RESUME -->
<div class="card">
  <h2>📑 Resume</h2>
  <div id="resume"></div>
  <button onclick="downloadPDF()">Download PDF</button>
</div>

<!-- JOBS -->
<div class="card">
  <h2>🎯 Jobs</h2>
  <div id="jobs"></div>
</div>

<!-- PAYMENT -->
<div class="card">
  <h2>💎 Premium ₹200</h2>

  <img width="150"
  src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR">

  <input id="utr" placeholder="Enter UTR">
  <button onclick="submitPayment()">Submit Payment</button>
</div>

<!-- ADMIN -->
<div class="card">
  <h2>👑 Admin Panel</h2>

  <input id="adminPass" placeholder="Password">
  <button onclick="loginAdmin()">Login</button>

  <div id="adminData"></div>
</div>

</div>

<script>

// 🔥 FIREBASE CONFIG (PUT YOURS)
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// JOB DATA
const jobs = [
  {title:"AI Developer",skills:["ai","python"]},
  {title:"Data Analyst",skills:["data","sql"]},
  {title:"Web Developer",skills:["javascript","react"]}
];

// RESUME
function generateResume(){
  let name = document.getElementById("name").value;
  let skills = document.getElementById("skills").value;
  let exp = document.getElementById("exp").value;

  document.getElementById("resume").innerHTML = `
    <div id="resumeContent" style="background:white;color:black;padding:20px;">
      <h2>${name}</h2>
      <p><b>Skills:</b> ${skills}</p>
      <p><b>Experience:</b> ${exp}</p>
    </div>
  `;
}

// JOB MATCH
function generateJobs(){
  let skills = document.getElementById("skills").value.toLowerCase().split(",");

  let html="";

  jobs.forEach(j=>{
    let match = j.skills.some(s=>skills.includes(s));

    if(match){
      html+=`
        <div class="job">
          <h3>${j.title}</h3>
          <a target="_blank" href="https://www.linkedin.com/jobs/search/?keywords=${j.title}">LinkedIn</a>
        </div>
      `;
    }
  });

  document.getElementById("jobs").innerHTML = html;
}

// PDF
function downloadPDF(){
  html2pdf().from(document.getElementById("resumeContent")).save();
}

// PAYMENT SUBMIT (CLOUD)
function submitPayment(){

  let utr = document.getElementById("utr").value;

  if(utr.length < 6){
    alert("Enter valid UTR");
    return;
  }

  db.collection("payments").add({
    utr: utr,
    status: "pending"
  });

  alert("Submitted! Wait for approval");
}

// ADMIN LOGIN
function loginAdmin(){

  let pass = document.getElementById("adminPass").value;

  if(pass !== "admin123"){
    alert("Wrong password");
    return;
  }

  loadPayments();
}

// LOAD PAYMENTS FROM CLOUD
function loadPayments(){

  db.collection("payments").get().then(snapshot=>{

    let html="";

    snapshot.forEach(doc=>{
      let data = doc.data();

      html+=`
        <div class="job">
          <p>UTR: ${data.utr}</p>
          <p>Status: ${data.status}</p>
          <button onclick="approve('${doc.id}')">Approve</button>
        </div>
      `;
    });

    document.getElementById("adminData").innerHTML = html;
  });
}

// APPROVE USER
function approve(id){

  db.collection("payments").doc(id).update({
    status: "approved"
  });

  alert("Approved ✅");
  loadPayments();
}

</script>

</body>
</html>
