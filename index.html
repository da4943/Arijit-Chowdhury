<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Startup AI System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
    }

    header {
      padding: 50px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      color: #38bdf8;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: rgba(30, 41, 59, 0.85);
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .search {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 10px;
      border: none;
    }

    .btn {
      background: #38bdf8;
      color: black;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 10px;
      width: 100%;
      display: block;
      text-align: center;
      text-decoration: none;
    }

    .skill-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .skill {
      background: #1f2937;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      border: 1px solid #334155;
    }

    .skill:hover {
      background: #38bdf8;
      color: black;
    }

    .score {
      color: #22c55e;
      font-weight: bold;
    }

    .job-card {
      margin-top: 12px;
      padding: 14px;
      background: #0f172a;
      border-radius: 12px;
      border: 1px solid #334155;
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 AOV AI Jobs</h1>
  <p>Startup AI Job Matching System</p>
</header>

<div class="container">

  <!-- PROFILE -->
  <div class="card">
    <h2>📄 Your AI Profile</h2>

    <input id="skills" class="search" placeholder="Skills (AI Python ML)">
    <input id="exp" class="search" placeholder="Experience (fresher / junior / senior)">

    <button class="btn" onclick="generateAI()">Generate AI Matches</button>
  </div>

  <!-- SKILLS -->
  <div class="card">
    <h2>🔥 Skills Library</h2>

    <div class="skill-box">
      <div class="skill" onclick="selectSkill('ai')">AI</div>
      <div class="skill" onclick="selectSkill('python')">Python</div>
      <div class="skill" onclick="selectSkill('machine learning')">ML</div>
      <div class="skill" onclick="selectSkill('data')">Data</div>
      <div class="skill" onclick="selectSkill('sql')">SQL</div>
      <div class="skill" onclick="selectSkill('javascript')">JavaScript</div>
      <div class="skill" onclick="selectSkill('react')">React</div>
      <div class="skill" onclick="selectSkill('web')">Web</div>
      <div class="skill" onclick="selectSkill('chatbot')">Chatbot</div>
      <div class="skill" onclick="selectSkill('marketing')">Marketing</div>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="results"></div>

</div>

<script>
const jobs = [
  { title:"AI Developer", skills:["ai","python","ml"], level:"senior" },
  { title:"ML Intern", skills:["ml","python"], level:"fresher" },
  { title:"Data Analyst", skills:["data","sql"], level:"junior" },
  { title:"Web Developer", skills:["web","javascript","react"], level:"junior" },
  { title:"Chatbot Engineer", skills:["chatbot","ai","javascript"], level:"junior" },
  { title:"Marketing Executive", skills:["marketing"], level:"fresher" }
];

function selectSkill(skill){
  document.getElementById("skills").value = skill;
  generateAI();
}

function generateAI(){

  let skills = document.getElementById("skills").value.toLowerCase().split(/[\s,]+/);
  let exp = document.getElementById("exp").value.toLowerCase();

  let results = [];

  jobs.forEach(job=>{
    let score = 0;

    job.skills.forEach(s=>{
      if(skills.includes(s)) score += 50;
    });

    if(exp.includes(job.level)) score += 20;

    if(score > 0){
      results.push({...job, score});
    }
  });

  results.sort((a,b)=>b.score-a.score);

  let html = `<div class="card"><h2>🎯 AI Job Matches</h2>`;

  if(results.length === 0){
    html += `<p>No jobs found. Try more skills.</p>`;
  } else {

    results.forEach(j=>{
      html += `
        <div class="job-card">
          <h3>${j.title}</h3>
          <p class="score">${j.score}% Match</p>

          <a class="btn" target="_blank"
            href="https://www.linkedin.com/jobs/search/?keywords=${j.title}">
            Apply on LinkedIn
          </a>

          <a class="btn" target="_blank"
            href="https://www.google.com/search?q=${j.title}+jobs">
            Search on Google
          </a>
        </div>
      `;
    });
  }

  html += `</div>`;

  document.getElementById("results").innerHTML = html;
}
</script>

</body>
</html>
