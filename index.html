<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Advanced AI System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
    }

    header {
      padding: 50px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      color: #38bdf8;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: rgba(30, 41, 59, 0.85);
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .search {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 10px;
      border: none;
    }

    .btn {
      background: #38bdf8;
      color: black;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 10px;
      width: 100%;
    }

    .score {
      color: #22c55e;
      font-weight: bold;
    }

    .qr {
      width: 180px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 AOV AI Jobs</h1>
  <p>Advanced AI Resume + Job Matching System</p>
</header>

<div class="container">

  <!-- USER PROFILE -->
  <div class="card">
    <h2>📄 Your AI Profile</h2>

    <input id="name" class="search" placeholder="Full Name">
    <input id="skills" class="search" placeholder="Skills (AI, Python, Marketing)">
    <input id="exp" class="search" placeholder="Experience (Fresher / 2 years / 5 years)">
    <input id="education" class="search" placeholder="Education">

    <button class="btn" onclick="generateAI()">Generate AI Matches</button>
  </div>

  <!-- JOB RESULTS -->
  <div id="results"></div>

  <!-- PAYMENT -->
  <div class="card">
    <h2>💳 Premium Resume Service</h2>

    <img class="qr"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=49&cu=INR">

    <button class="btn" onclick="payNow()">Pay ₹49 & Unlock AI Resume</button>
  </div>

</div>

<script>
const jobs = [
  { title: "AI Developer", skills: ["ai","python","ml"], level: "senior" },
  { title: "ML Intern", skills: ["ml","python"], level: "fresher" },
  { title: "Data Analyst", skills: ["excel","data","sql"], level: "junior" },
  { title: "Chatbot Developer", skills: ["ai","chatbot","javascript"], level: "junior" }
];

// AI MATCHING ENGINE
function generateAI(){

  let name = document.getElementById("name").value.toLowerCase();
  let skills = document.getElementById("skills").value.toLowerCase().split(",");
  let exp = document.getElementById("exp").value.toLowerCase();

  let results = [];

  jobs.forEach(job => {

    let matchScore = 0;

    // skill match
    job.skills.forEach(s=>{
      if(skills.includes(s.trim())) matchScore += 40;
    });

    // experience match
    if(exp.includes(job.level)) matchScore += 30;

    if(matchScore > 0){
      results.push({
        title: job.title,
        score: matchScore
      });
    }
  });

  results.sort((a,b)=>b.score-a.score);

  let html = "<div class='card'><h2>🎯 AI Job Matches</h2>";

  if(results.length === 0){
    html += "<p>No strong match found</p>";
  } else {
    results.forEach(r=>{
      html += `
        <p>💼 ${r.title} - <span class="score">${r.score}% match</span></p>
      `;
    });
  }

  html += "</div>";

  document.getElementById("results").innerHTML = html;
}

// PAYMENT
function payNow(){
  alert("Redirecting to UPI Payment...");

  window.location.href =
    "upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=49&cu=INR";
}
</script>

</body>
</html>
