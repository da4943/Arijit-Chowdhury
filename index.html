<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Cloud SaaS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    h1{text-align:center;color:#38bdf8;}

    .card{
      background:#111827;
      padding:20px;
      margin-bottom:15px;
      border-radius:12px;
      border:1px solid #334155;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:8px;
      border-radius:8px;
      border:none;
      background:#0b1220;
      color:white;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#38bdf8;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .job{
      margin-top:10px;
      padding:12px;
      border:1px solid #334155;
      border-radius:8px;
      background:#0b1220;
    }

    .job a{
      display:block;
      margin-top:5px;
      color:#38bdf8;
    }

    img{
      margin-top:10px;
    }

    .resume-box{
      background:white;
      color:black;
      padding:30px;
      border-radius:15px;
      text-align:center;
    }

    .profile-pic{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid black;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>🚀 AOV AI Jobs</h1>

  <!-- PROFILE -->
  <div class="card">

    <h2>📄 Profile</h2>

    <input id="name" placeholder="Full Name">
    <input id="skills" placeholder="Skills (ai, python, marketing)">
    <input id="exp" placeholder="Experience">
    <input type="file" id="photo" accept="image/*">

    <button onclick="generateResume()">Generate Resume</button>
    <button onclick="generateJobs()">Find Jobs</button>

  </div>

  <!-- RESUME -->
  <div class="card">
    <h2>📑 Resume</h2>
    <div id="resume"></div>
    <button onclick="downloadPDF()">Download PDF</button>
  </div>

  <!-- JOBS -->
  <div class="card">
    <h2>🎯 AI Job Matches</h2>
    <div id="jobs"></div>
  </div>

</div>

<script>

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyC-HL4tCUEscc3zYX-505wwlxJZocejMD4",
  authDomain: "aov-ai-jobs.firebaseapp.com",
  projectId: "aov-ai-jobs",
  storageBucket: "aov-ai-jobs.firebaseapp.com",
  messagingSenderId: "109315377636",
  appId: "1:109315377636:web:7b1e8ca0536186a74adff1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// JOBS
const jobs = [
  {title:"AI Developer",skills:["ai","python"]},
  {title:"Data Analyst",skills:["data","sql"]},
  {title:"Web Developer",skills:["javascript","react"]}
];

// RESUME WITH PHOTO
function generateResume(){

  let name = document.getElementById("name").value;
  let skills = document.getElementById("skills").value;
  let exp = document.getElementById("exp").value;
  let photo = document.getElementById("photo").files[0];

  let reader = new FileReader();

  reader.onload = function(e){

    document.getElementById("resume").innerHTML = `
      <div id="resumeContent" class="resume-box">

        ${photo ? `<img src="${e.target.result}" class="profile-pic">` : ""}

        <h2>${name}</h2>
        <hr>
        <p><b>Skills:</b> ${skills}</p>
        <p><b>Experience:</b> ${exp}</p>

      </div>
    `;
  };

  if(photo){
    reader.readAsDataURL(photo);
  } else {
    reader.onload({target:{result:""}});
  }
}

// JOB MATCH
function generateJobs(){

  let skills = document.getElementById("skills").value.toLowerCase().split(/[\s,]+/).filter(Boolean);

  let html="";

  jobs.forEach(j=>{

    let score = j.skills.filter(s => skills.includes(s)).length * 50;

    if(score>0){
      html+=`
        <div class="job">
          <h3>${j.title}</h3>
          <p>Match: ${score}%</p>

          <a target="_blank" href="https://www.linkedin.com/jobs/search/?keywords=${j.title}">
          🔗 LinkedIn Jobs</a>

          <a target="_blank" href="https://www.google.com/search?q=${j.title}+jobs">
          🌐 Google Jobs</a>
        </div>
      `;
    }
  });

  if(html==="") html="<p>No jobs found. Try more skills.</p>";

  document.getElementById("jobs").innerHTML = html;
}

// PDF
function downloadPDF(){

  let el = document.getElementById("resumeContent");

  if(!el){
    alert("Generate resume first");
    return;
  }

  html2pdf().from(el).save("Resume.pdf");
}

</script>

</body>
</html>
