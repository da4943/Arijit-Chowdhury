<!DOCTYPE html>
<html>
<head>
  <title>Free AI Resume Builder | ATS Score | AOV AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Create professional resume with AI. Get ATS score and download instantly.">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:linear-gradient(135deg,#050816,#0b1220);color:white;}
    .nav{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#0f172a;}
    .logo{font-size:20px;font-weight:bold;color:#38bdf8;}
    .social button{margin-left:10px;padding:10px 14px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;}
    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}
    .container{max-width:1000px;margin:auto;padding:20px;} /* FIXED PADDING */

    .hero{text-align:center;padding:25px;}
    .hero h1{font-size:28px;color:#38bdf8;}

    .card{
      background:#111827;
      padding:20px;
      margin-top:20px;
      border-radius:15px;
      width:100%;
      box-sizing:border-box; /* IMPORTANT FIX */
    }

    h2{
      margin:0 0 10px 0; /* FIX FOR CUT TEXT */
      word-break:break-word;
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      box-sizing:border-box;
    }

    button{background:#38bdf8;font-weight:bold;cursor:pointer;}
    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}

    .resume-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:12px;
      width:100%;
      box-sizing:border-box; /* FIX */
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      width:100%;
    }

    footer{background:#0f172a;text-align:center;padding:15px;margin-top:30px;}
    footer a{color:#38bdf8;margin:0 10px;cursor:pointer;text-decoration:none;}

    @media(max-width:768px){
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div onclick="toggleMenu()" style="cursor:pointer;font-size:22px;">☰</div>
  <div class="logo">AOV AI Resume</div>
  <div class="social">
    <a href="https://www.google.com/search?q=jobs" target="_blank"><button class="google">Google</button></a>
    <a href="https://www.linkedin.com/jobs/" target="_blank"><button class="linkedin">LinkedIn</button></a>
  </div>
</div>

<!-- MENU -->
<div id="sideMenu" style="position:fixed;top:0;left:-250px;width:250px;height:100%;background:#0f172a;padding:20px;transition:0.3s;z-index:999;">
  <h3 style="color:#38bdf8;">Menu</h3>
  <button onclick="showPage('about')">About</button>
  <button onclick="showPage('privacy')">Privacy</button>
  <button onclick="showPage('terms')">Terms</button>
  <button onclick="showPage('contact')">Contact</button>
  <button onclick="toggleMenu()">Close</button>
</div>

<div class="container">

  <div class="hero">
    <h1>Create Professional Resume in Seconds</h1>
  </div>

  <!-- PREMIUM -->
  <div class="card">
    <h2 id="priceText">💎 Unlock Premium ₹200</h2>
    <p>Scan & Pay to enable PDF + Image Download</p>

    <img id="upiQR" width="200"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=yourupi@bank&pn=AOV%20AI&am=200&cu=INR">

    <a id="paypalBtn" href="#" target="_blank" style="display:none;">
      <button>Pay $20 (International)</button>
    </a>

    <input id="txn" placeholder="Enter Payment ID / Email">
    <button onclick="verifyPayment()">I Paid</button>
  </div>

  <!-- BUILDER -->
  <div class="card">
    <h2>Resume Builder</h2>

    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="age" placeholder="Age">
      <input id="qualification" placeholder="Qualification">
      <input id="experience" placeholder="Experience">
    </div>

    <input id="skills" placeholder="Skills">
    <input id="hobbies" placeholder="Hobbies">
    <input id="about" placeholder="About You">

    <input type="file" id="photoUpload">

    <input id="declaration" placeholder="Declaration">
    <input id="signature" placeholder="Signature">

    <button onclick="generate()">Generate Resume</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
    <button onclick="downloadImage()">Download Image</button>
    <button class="btn-clear" onclick="clearData()">Clear Data</button>
  </div>

  <div class="card">
    <div id="resume"></div>
  </div>

  <div class="card" id="infoPage" style="display:none;"></div>

</div>

<!-- FOOTER -->
<footer>
  <a onclick="showPage('about')">About</a>
  <a onclick="showPage('privacy')">Privacy</a>
  <a onclick="showPage('terms')">Terms</a>
  <a onclick="showPage('contact')">Contact</a>
  <p style="margin-top:10px;">© 2026 AOV AI</p>
</footer>

<!-- KEEP YOUR ORIGINAL SCRIPT (NO CHANGE) -->
<script>
/* your same JS here (unchanged) */
</script>

</body>
</html>
