<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Auto Resume Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    .nav{
      padding:12px;
      text-align:center;
      background:#111827;
      color:#38bdf8;
      font-weight:bold;
      position:sticky;
      top:0;
      border-bottom:1px solid #334155;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:15px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    @media(max-width:800px){
      .grid{grid-template-columns:1fr;}
    }

    .card{
      background:#111827;
      border:1px solid #334155;
      padding:15px;
      border-radius:12px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #334155;
      background:#0b1220;
      color:white;
      box-sizing:border-box;
    }

    .btn{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#38bdf8;
      border:none;
      border-radius:8px;
      font-weight:bold;
      color:black;
      cursor:pointer;
    }

    .job{
      padding:12px;
      border:1px solid #334155;
      margin-top:10px;
      border-radius:10px;
      background:#0b1220;
    }

    .score{
      color:#22c55e;
      font-weight:bold;
    }

    .resume-box p{
      margin:6px 0;
    }

  </style>
</head>

<body>

<div class="nav">🤖 AUTO AI RESUME BUILDER SYSTEM</div>

<div class="container grid">

  <!-- INPUT -->
  <div class="card">
    <h2>📄 Profile Input</h2>

    <input id="name" placeholder="Full Name" oninput="autoBuild()">
    <input id="skills" placeholder="Skills (ai, python, ml)" oninput="autoBuild()">
    <input id="exp" placeholder="Experience (fresher/junior/senior)" oninput="autoBuild()">

  </div>

  <!-- SKILLS -->
  <div class="card">
    <h2>🔥 Quick Skills</h2>

    <button class="btn" onclick="addSkill('ai')">AI</button>
    <button class="btn" onclick="addSkill('python')">Python</button>
    <button class="btn" onclick="addSkill('ml')">Machine Learning</button>
    <button class="btn" onclick="addSkill('data')">Data</button>
    <button class="btn" onclick="addSkill('react')">React</button>
  </div>

</div>

<!-- JOBS -->
<div class="container">
  <div class="card">
    <h2>🎯 AI Job Matches</h2>
    <div id="results"></div>
  </div>
</div>

<!-- RESUME -->
<div class="container">
  <div class="card resume-box">
    <h2>📄 LIVE AUTO RESUME</h2>

    <p><b>Name:</b> <span id="rname">-</span></p>
    <p><b>Skills:</b> <span id="rskills">-</span></p>
    <p><b>Experience:</b> <span id="rexp">-</span></p>

    <p><b>Summary:</b> <span id="rsummary">-</span></p>
  </div>
</div>

<script>

const jobs=[
  {title:"AI Engineer",skills:["ai","python","ml"],level:"senior"},
  {title:"ML Intern",skills:["ml","python"],level:"fresher"},
  {title:"Data Analyst",skills:["data","sql"],level:"junior"},
  {title:"Web Developer",skills:["react","javascript"],level:"junior"}
];

// add skill
function addSkill(s){
  let input=document.getElementById("skills");
  input.value += (input.value?",":"")+s;
  autoBuild();
}

// AUTO RESUME BUILDER
function autoBuild(){

  let name=document.getElementById("name").value;
  let skills=document.getElementById("skills").value.toLowerCase().split(",");
  let exp=document.getElementById("exp").value;

  // LIVE RESUME
  document.getElementById("rname").innerText=name || "-";
  document.getElementById("rskills").innerText=skills.join(", ") || "-";
  document.getElementById("rexp").innerText=exp || "-";

  // AI SUMMARY
  let summary="";

  if(skills.includes("ai") || skills.includes("python")){
    summary="Strong AI & Software Development candidate.";
  } else if(skills.includes("data")){
    summary="Data focused analytical candidate.";
  } else {
    summary="General IT & tech candidate.";
  }

  document.getElementById("rsummary").innerText=summary;

  generateAI(skills,exp);
}

// AI JOB ENGINE
function generateAI(skills,exp){

  let results=[];

  jobs.forEach(j=>{
    let score=0;

    j.skills.forEach(s=>{
      if(skills.map(x=>x.trim()).includes(s)) score+=50;
    });

    if(exp.includes(j.level)) score+=20;

    if(score>0){
      results.push({...j,score});
    }
  });

  results.sort((a,b)=>b.score-a.score);

  let html="";

  results.forEach(r=>{
    html+=`
      <div class="job">
        <h3>${r.title}</h3>
        <p class="score">${r.score}% Match</p>

        <a class="btn" target="_blank"
        href="https://www.linkedin.com/jobs/search/?keywords=${r.title}">
        LinkedIn</a>

        <a class="btn" target="_blank"
        href="https://www.google.com/search?q=${r.title}+jobs">
        Google</a>
      </div>
    `;
  });

  document.getElementById("results").innerHTML=html;
}

</script>

</body>
</html>
