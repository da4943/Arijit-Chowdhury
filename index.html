<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Level 2 Startup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin:0;
      background: linear-gradient(135deg,#0f172a,#111827);
      color:white;
    }

    header{
      text-align:center;
      padding:40px;
    }

    h1{color:#38bdf8;font-size:40px;}

    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    .card{
      background:#1f2937;
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
    }

    input{
      width:100%;
      padding:10px;
      margin:5px 0;
      border-radius:8px;
      border:none;
    }

    .btn{
      background:#38bdf8;
      color:black;
      padding:10px;
      border:none;
      width:100%;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }

    .job{
      background:#0f172a;
      padding:10px;
      border-radius:10px;
      margin-top:10px;
      border:1px solid #334155;
    }

    .score{
      color:#22c55e;
    }

  </style>
</head>

<body>

<header>
  <h1>🤖 AOV AI Startup System</h1>
  <p>Level 2 AI Job + Resume Platform</p>
</header>

<div class="container">

  <!-- PROFILE -->
  <div class="card">
    <h2>Create Profile</h2>

    <input id="name" placeholder="Full Name">
    <input id="skills" placeholder="Skills (AI Python ML)">
    <input id="exp" placeholder="Experience (fresher/junior/senior)">

    <button class="btn" onclick="saveProfile()">Save Profile</button>
  </div>

  <!-- AI MATCH -->
  <div class="card">
    <h2>AI Job Matching</h2>
    <button class="btn" onclick="generateAI()">Find Jobs</button>

    <div id="results"></div>
  </div>

  <!-- RESUME -->
  <div class="card">
    <h2>Auto Resume Preview</h2>
    <div id="resume"></div>
  </div>

  <!-- PAYMENT -->
  <div class="card">
    <h2>Premium Upgrade</h2>
    <p>Unlock AI Resume PDF + Priority Jobs</p>

    <a class="btn" href="upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=49&cu=INR">
      Pay ₹49 via UPI
    </a>
  </div>

</div>

<script>

const jobs = [
  {title:"AI Engineer",skills:["ai","python","ml"],level:"senior"},
  {title:"ML Intern",skills:["ml","python"],level:"fresher"},
  {title:"Data Analyst",skills:["data","sql"],level:"junior"},
  {title:"Web Developer",skills:["web","javascript"],level:"junior"},
  {title:"Marketing Executive",skills:["marketing"],level:"fresher"}
];

// SAVE PROFILE (STARTUP FEATURE)
function saveProfile(){

  let user = {
    name:document.getElementById("name").value,
    skills:document.getElementById("skills").value,
    exp:document.getElementById("exp").value
  };

  localStorage.setItem("userProfile", JSON.stringify(user));

  alert("Profile Saved (Startup DB Ready)");
  showResume();
}

// AI MATCH ENGINE
function generateAI(){

  let skills = document.getElementById("skills").value.toLowerCase().split(/[\s,]+/);
  let exp = document.getElementById("exp").value.toLowerCase();

  let results = [];

  jobs.forEach(job=>{
    let score = 0;

    job.skills.forEach(s=>{
      if(skills.includes(s)) score += 50;
    });

    if(exp.includes(job.level)) score += 20;

    if(score>0){
      results.push({...job,score});
    }
  });

  results.sort((a,b)=>b.score-a.score);

  let html="";

  results.forEach(j=>{
    html+=`
      <div class="job">
        <h3>${j.title}</h3>
        <p class="score">${j.score}% match</p>

        <a class="btn" target="_blank"
        href="https://www.linkedin.com/jobs/search/?keywords=${j.title}">
        LinkedIn
        </a>

        <a class="btn" target="_blank"
        href="https://www.google.com/search?q=${j.title}+jobs">
        Google
        </a>
      </div>
    `;
  });

  document.getElementById("results").innerHTML = html;
}

// RESUME BUILDER
function showResume(){

  let user = JSON.parse(localStorage.getItem("userProfile"));

  if(!user) return;

  document.getElementById("resume").innerHTML = `
    <p><b>Name:</b> ${user.name}</p>
    <p><b>Skills:</b> ${user.skills}</p>
    <p><b>Experience:</b> ${user.exp}</p>
  `;
}

// LOAD
showResume();

</script>

</body>
</html>
