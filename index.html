<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
    }

    header {
      padding: 50px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      color: #38bdf8;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.85);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .btn {
      background: #38bdf8;
      color: black;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      display: inline-block;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      border: none;
    }

    .btn:hover {
      background: #0ea5e9;
    }

    .qr {
      width: 220px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .small {
      font-size: 12px;
      color: #94a3b8;
    }

    /* POPUP */
    .popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }

    .popup-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      width: 80%;
      max-width: 300px;
    }

    .loader {
      border: 4px solid #ccc;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      margin: 15px auto;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<header>
  <h1>AOV AI Jobs</h1>
  <p>AI Resume + Job Matching Platform</p>
</header>

<div class="container">

  <!-- RESUME FORM -->
  <div class="card">
    <h2>📄 Create Resume</h2>

    <input id="name" class="btn" style="width:90%; text-align:left;" placeholder="Full Name"><br><br>
    <input id="email" class="btn" style="width:90%; text-align:left;" placeholder="Email"><br><br>
    <input id="skills" class="btn" style="width:90%; text-align:left;" placeholder="Skills"><br><br>

    <button class="btn" onclick="openPayment()">Pay ₹49 & Generate Resume</button>
  </div>

  <!-- PAYMENT CARD -->
  <div class="card">
    <h2>💳 Secure Payment</h2>
    <p>Scan QR or click pay button</p>

    <!-- QR (UPI HIDDEN INSIDE) -->
    <img class="qr"
      src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=49&cu=INR">

    <p class="small">Scan using Google Pay / PhonePe / Paytm</p>

    <button class="btn" onclick="openPayment()">Pay Now</button>
  </div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h3>Processing Payment</h3>
    <div class="loader"></div>
    <p>Please complete payment in UPI app</p>
  </div>
</div>

<script>
function openPayment() {
  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let skills = document.getElementById("skills").value;

  if (!name || !email || !skills) {
    alert("Please fill all details first");
    return;
  }

  // show popup
  document.getElementById("popup").style.display = "flex";

  // UPI redirect after 2 sec
  setTimeout(() => {
    window.location.href =
      "upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=49&cu=INR";
  }, 2000);
}
</script>

</body>
</html>
