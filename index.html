<!DOCTYPE html>
<html>
<head>
  <title>AOV SaaS v3 - Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:#0f172a;color:white}
    .container{max-width:900px;margin:auto;padding:20px}
    .card{background:#111827;padding:15px;margin:10px 0;border-radius:10px}
    input,button{width:100%;padding:10px;margin-top:8px;border-radius:6px;border:none}
    button{background:#38bdf8;cursor:pointer}
    .hidden{display:none}
    .admin{background:#1f2937}
    .row{display:flex;gap:10px}
    .row button{flex:1}
  </style>
</head>

<body>

<div class="container">

<h2 style="text-align:center">AOV SaaS v3 - Admin Panel</h2>

<!-- LOGIN -->
<div class="card" id="loginBox">
  <h3>Login</h3>
  <button onclick="googleLogin()">Login with Google</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="card">
    <h3>Create Resume</h3>
    <input id="name" placeholder="Name">
    <input id="address" placeholder="Address">
    <input id="skills" placeholder="Skills">
    <button onclick="generate()">Generate</button>
  </div>

  <div class="card">
    <div id="resume"></div>
    <button onclick="downloadPDF()">Download PDF</button>
  </div>

  <div class="card">
    <h3>Upgrade</h3>
    <input id="utr" placeholder="UTR">
    <button onclick="pay()">Submit Payment</button>
    <p id="status">Status: FREE</p>
  </div>

</div>

<!-- ADMIN PANEL -->
<div class="card admin hidden" id="adminPanel">
  <h2>🔥 ADMIN PANEL</h2>
  <div id="payments"></div>
</div>

</div>

<script>

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyBpJQ44k1gokp3sSZggyESC7HpvqssClEE",
  authDomain: "aov-ai-jobs-c697d.firebaseapp.com",
  projectId: "aov-ai-jobs-c697d"
};

if(!firebase.apps.length){
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

let user = null;
let isAdmin = false;

// ADMIN EMAIL (CHANGE THIS)
const ADMIN_EMAIL = "carijit22@gmail.com";

// AUTH
auth.onAuthStateChanged(async(u)=>{
  user = u;

  if(user){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("app").classList.remove("hidden");

    if(user.email === ADMIN_EMAIL){
      isAdmin = true;
      document.getElementById("adminPanel").classList.remove("hidden");
      loadPayments();
    }

  } else {
    document.getElementById("loginBox").style.display="block";
    document.getElementById("app").classList.add("hidden");
  }
});

function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

// RESUME
function generate(){
  document.getElementById("resume").innerHTML = `
    <div style="background:white;color:black;padding:10px;border-radius:8px">
      <h3>${name.value}</h3>
      <p>${address.value}</p>
      <p>${skills.value}</p>
    </div>
  `;
}

// PAYMENT
function pay(){
  if(!user) return alert("Login first");

  db.collection("payments").add({
    email:user.email,
    utr:utr.value,
    status:"pending"
  });

  alert("Submitted");
}

// LOAD PAYMENTS (ADMIN)
async function loadPayments(){
  const snap = await db.collection("payments").get();

  let html = "";

  snap.forEach(doc=>{
    const d = doc.data();

    html += `
      <div class="card">
        <p><b>Email:</b> ${d.email}</p>
        <p><b>UTR:</b> ${d.utr}</p>
        <p><b>Status:</b> ${d.status}</p>

        <div class="row">
          <button onclick="approve('${doc.id}','${d.email}')">Approve</button>
          <button onclick="reject('${doc.id}')">Reject</button>
        </div>
      </div>
    `;
  });

  document.getElementById("payments").innerHTML = html;
}

// APPROVE PAYMENT
async function approve(id,email){
  await db.collection("payments").doc(id).update({
    status:"approved"
  });

  alert("User Approved ✔");
  loadPayments();
}

// REJECT PAYMENT
async function reject(id){
  await db.collection("payments").doc(id).update({
    status:"rejected"
  });

  alert("Rejected ❌");
  loadPayments();
}

// PDF
function downloadPDF(){
  const el = document.querySelector("#resume");

  html2pdf().from(el).save("resume.pdf");
}

</script>

</body>
</html>
