<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#050816,#0b1220);
      color:white;
    }

    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      background:#0f172a;
    }

    .logo{
      font-size:20px;
      font-weight:bold;
      color:#38bdf8;
    }

    .social button{
      margin-left:10px;
      padding:10px 14px;
      border-radius:8px;
      border:none;
      font-weight:bold;
      cursor:pointer;
    }

    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}

    .container{
      max-width:1000px;
      margin:auto;
      padding:15px;
    }

    .hero{
      text-align:center;
      padding:25px;
    }

    .hero h1{
      font-size:28px;
      color:#38bdf8;
    }

    .card{
      background:#111827;
      padding:20px;
      margin-top:15px;
      border-radius:15px;
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}

    .resume-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:12px;
      position:relative;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    @media(max-width:768px){
      .grid{grid-template-columns:1fr}
    }

    /* ===== CANVAS EDITOR ===== */
    .draggable{
      position:relative;
      cursor:move;
      padding:5px;
      display:inline-block;
    }

    .resizer{
      width:10px;
      height:10px;
      background:red;
      position:absolute;
      right:0;
      bottom:0;
      cursor:se-resize;
    }
  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>

  <div class="social">
    <a href="https://www.google.com/search?q=jobs" target="_blank">
      <button class="google">Google</button>
    </a>
    <a href="https://www.linkedin.com/jobs/" target="_blank">
      <button class="linkedin">LinkedIn</button>
    </a>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1>Create Professional Resume in Seconds</h1>
  </div>

  <!-- PREMIUM -->
  <div class="card">
    <h2>💎 Unlock Premium ₹200</h2>

    <img width="200"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=yourupi@bank&pn=AOV%20AI&am=200&cu=INR">

    <input id="txn" placeholder="Enter Payment ID / Email">
    <button onclick="verifyPayment()">Activate Premium</button>
  </div>

  <!-- BUILDER -->
  <div class="card">
    <h2>Resume Builder</h2>

    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="age" placeholder="Age">
      <input id="qualification" placeholder="Qualification">
      <input id="experience" placeholder="Experience">
    </div>

    <input id="skills" placeholder="Skills">
    <input id="hobbies" placeholder="Hobbies">
    <input id="about" placeholder="About You">

    <input type="file" id="photoUpload">

    <input id="declaration" placeholder="Declaration">
    <input id="signature" placeholder="Signature">

    <button onclick="generate()">Generate Resume</button>
    <button onclick="downloadEuroPlusCV()">Europlus CV</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
    <button onclick="downloadImage()">Download Image</button>
    <button class="btn-clear" onclick="clearData()">Clear Data</button>
  </div>

  <!-- OUTPUT -->
  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<script>

let photoData="";
let resumeBox=null;

/* SAFE ACCESS */
const $ = id => document.getElementById(id);

/* PREMIUM */
function verifyPayment(){
  if(!$("txn").value){
    alert("Enter Payment ID");
    return;
  }
  localStorage.setItem("premium","yes");
  alert("Premium Activated ✔");
}

/* PHOTO */
$("photoUpload").onchange = e=>{
  const r=new FileReader();
  r.onload=()=>photoData=r.result;
  r.readAsDataURL(e.target.files[0]);
};

/* ATS SCORE */
function getATS(text){
  let score=0;
  ["skills","experience","lead","manage","develop","project"].forEach(k=>{
    if(text.toLowerCase().includes(k)) score+=15;
  });
  return Math.min(score,100);
}

/* GENERATE */
function generate(){

  const name=$("name").value;
  const age=$("age").value;
  const qualification=$("qualification").value;
  const experience=$("experience").value;
  const skills=$("skills").value;
  const hobbies=$("hobbies").value;
  const about=$("about").value;
  const declaration=$("declaration").value;
  const signature=$("signature").value;

  const ats = getATS(skills+" "+experience);

  document.getElementById("resume").innerHTML=`
    <div class="resume-box" id="resumeBox">

      <div class="draggable" onmousedown="drag(this)">
        ${photoData?`<img src="${photoData}" width="100">`:""}
      </div>

      <h2 class="draggable">${name}</h2>
      <p class="draggable">${qualification}</p>

      <hr>

      <p class="draggable"><b>Experience:</b> ${experience}</p>
      <p class="draggable"><b>Skills:</b> ${skills}</p>
      <p class="draggable"><b>Hobbies:</b> ${hobbies}</p>

      <p class="draggable"><b>About:</b> ${about}</p>

      <hr>

      <p class="draggable"><b>Declaration:</b> ${declaration}</p>
      <p class="draggable"><b>Signature:</b> ${signature}</p>

      <h3>ATS SCORE: ${ats}/100</h3>

    </div>
  `;

  resumeBox=$("resumeBox");
}

/* DRAG SYSTEM (SIMPLE CANVA STYLE) */
function drag(el){
  let offsetX, offsetY;

  el.onmousedown = function(e){
    offsetX = e.clientX - el.offsetLeft;
    offsetY = e.clientY - el.offsetTop;

    document.onmousemove = function(e){
      el.style.position="absolute";
      el.style.left=(e.clientX-offsetX)+"px";
      el.style.top=(e.clientY-offsetY)+"px";
    };

    document.onmouseup = function(){
      document.onmousemove=null;
    };
  };
}

/* EUROPLUS */
function downloadEuroPlusCV(){
  if(!resumeBox){ alert("Generate first"); return; }

  const blob=new Blob([resumeBox.innerText],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="Europlus_CV.txt";
  a.click();
}

/* PDF */
function downloadPDF(){
  if(!resumeBox){ alert("Generate first"); return; }

  html2pdf().from(resumeBox).save("resume.pdf");
}

/* IMAGE */
function downloadImage(){
  if(!resumeBox){ alert("Generate first"); return; }

  html2canvas(resumeBox).then(c=>{
    let a=document.createElement("a");
    a.download="resume.png";
    a.href=c.toDataURL();
    a.click();
  });
}

/* CLEAR */
function clearData(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  document.getElementById("resume").innerHTML="";
  resumeBox=null;
  photoData="";
}

</script>

</body>
</html>
