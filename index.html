<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#050816,#0b1220);
      color:white;
    }

    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      background:#0f172a;
      position:sticky;
      top:0;
    }

    .logo{
      font-size:20px;
      font-weight:bold;
      color:#38bdf8;
    }

    .social button{
      margin-left:10px;
      padding:10px 14px;
      border-radius:8px;
      border:none;
      font-weight:bold;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:6px;
    }

    .social img{
      width:18px;
      height:18px;
    }

    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}

    .container{
      max-width:1000px;
      margin:auto;
      padding:15px;
    }

    .hero{
      text-align:center;
      padding:25px;
    }

    .hero h1{
      font-size:28px;
      color:#38bdf8;
    }

    .card{
      background:#111827;
      padding:20px;
      margin-top:15px;
      border-radius:15px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      font-size:15px;
      box-sizing:border-box;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}

    .premium{
      text-align:center;
      background:linear-gradient(45deg,#ffcc00,#ff8800);
      color:black;
      padding:25px;
      border-radius:15px;
    }

    .qr{
      margin-top:10px;
      width:220px;
      border-radius:12px;
      background:white;
      padding:10px;
    }

    .resume-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:12px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    @media(max-width:768px){
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>

  <div class="social">
    <a href="https://www.google.com/search?q=jobs" target="_blank">
      <button class="google">
        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">
        Google
      </button>
    </a>

    <a href="https://www.linkedin.com/jobs/" target="_blank">
      <button class="linkedin">
        <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png">
        LinkedIn
      </button>
    </a>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1>Create Professional Resume in Seconds</h1>
    <p>AI style resume builder • Free + Premium tools</p>
  </div>

  <div class="card premium">
    <h2>💎 Premium Unlock ₹200</h2>
    <p>Get Pro Templates + HD PDF Export</p>

    <img class="qr"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=yourupi@bank&pn=AOV%20AI&am=200&cu=INR"
    />

    <p>Scan & Pay via UPI</p>
  </div>

  <div class="card">
    <h2>Resume Builder</h2>

    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="age" placeholder="Age">
      <input id="qualification" placeholder="Qualification">
      <input id="experience" placeholder="Experience">
    </div>

    <input id="skills" placeholder="Skills">
    <input id="about" placeholder="About You">
    <input id="photo" placeholder="Photo URL">
    <input id="declaration" placeholder="Declaration">
    <input id="signature" placeholder="Signature">

    <button onclick="generate()">Generate Resume</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
    <button class="btn-clear" onclick="clearData()">Clear Data</button>
  </div>

  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<script>

function generate(){
  document.getElementById("resume").innerHTML = `
    <div class="resume-box" id="resumeBox">

      <center>
        <img src="${photo.value}" width="100" style="border-radius:50%">
        <h2>${name.value}</h2>
      </center>

      <p><b>Age:</b> ${age.value}</p>
      <p><b>Qualification:</b> ${qualification.value}</p>
      <p><b>Experience:</b> ${experience.value}</p>
      <p><b>Skills:</b> ${skills.value}</p>
      <p><b>About:</b> ${about.value}</p>

      <hr>

      <p><b>Declaration:</b> ${declaration.value}</p>
      <p><b>Signature:</b> ${signature.value}</p>
      <p><b>Date:</b> ${new Date().toLocaleDateString()}</p>

    </div>
  `;
}

function downloadPDF(){
  const el = document.getElementById("resumeBox");

  if(!el){
    alert("Generate resume first");
    return;
  }

  html2pdf().from(el).save("AOV_Resume.pdf");
}

/* CLEAR DATA */
function clearData(){
  document.querySelectorAll("input").forEach(i => i.value = "");
  document.getElementById("resume").innerHTML = "";
}

</script>

</body>
</html>
