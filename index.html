<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:linear-gradient(135deg,#050816,#0b1220);color:white;}
    .nav{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#0f172a;}
    .logo{font-size:20px;font-weight:bold;color:#38bdf8;}
    .social button{margin-left:10px;padding:10px 14px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;}
    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}
    .container{max-width:1000px;margin:auto;padding:15px;}
    .hero{text-align:center;padding:25px;}
    .hero h1{font-size:28px;color:#38bdf8;}
    .card{background:#111827;padding:20px;margin-top:15px;border-radius:15px;}
    input,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;}
    button{background:#38bdf8;font-weight:bold;cursor:pointer;}
    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}
    .resume-box{background:white;color:black;padding:20px;border-radius:12px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
    @media(max-width:768px){.grid{grid-template-columns:1fr}}
  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>
  <div class="social">
    <a href="https://www.google.com/search?q=jobs" target="_blank">
      <button class="google">Google</button>
    </a>
    <a href="https://www.linkedin.com/jobs/" target="_blank">
      <button class="linkedin">LinkedIn</button>
    </a>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1>Create Professional Resume in Seconds</h1>
  </div>

  <!-- PREMIUM -->
  <div class="card">
    <h2>💎 Unlock Premium ₹200</h2>
    <p>Scan & Pay to enable PDF + Image + Europlus CV</p>

    <img id="upiQR" width="200"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=yourupi@bank&pn=AOV%20AI&am=200&cu=INR">

    <input id="txn" placeholder="Enter Payment ID / Email">
    <button onclick="verifyPayment()">I Paid</button>
  </div>

  <!-- BUILDER -->
  <div class="card">
    <h2>Resume Builder</h2>

    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="age" placeholder="Age">
      <input id="qualification" placeholder="Qualification">
      <input id="experience" placeholder="Experience">
    </div>

    <input id="skills" placeholder="Skills">
    <input id="hobbies" placeholder="Hobbies">
    <input id="about" placeholder="About You">

    <input type="file" id="photoUpload">

    <input id="declaration" placeholder="Declaration">
    <input id="signature" placeholder="Signature">

    <button onclick="generate()">Generate Resume</button>
    <button onclick="downloadPDF()">Download PDF</button>
    <button onclick="downloadImage()">Download Image</button>

    <!-- EUROPLUS CV BUTTON (ADDED, DESIGN UNCHANGED) -->
    <button onclick="downloadEuroPlusCV()">Europlus CV</button>

    <button class="btn-clear" onclick="clearData()">Clear Data</button>
  </div>

  <!-- OUTPUT -->
  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<script>

let photoData="";
let isPremium = localStorage.getItem("premium")==="yes";

/* PAYMENT */
function verifyPayment(){
  if(!txn.value){alert("Enter Payment ID");return;}
  localStorage.setItem("premium","yes");
  isPremium=true;
  alert("Premium Unlocked ✔");
}

/* PHOTO */
photoUpload.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>photoData=r.result;
  r.readAsDataURL(e.target.files[0]);
};

/* ATS ENGINE */
function getATSScore(text){
  let s=0;
  ["skills","experience","project","team","lead","manage","develop","communication"].forEach(k=>{
    if(text.toLowerCase().includes(k)) s+=10;
  });
  return Math.min(s,100);
}

/* JOB MATCH */
function getJobs(skills){
  let s=skills.toLowerCase();
  let jobs=[];
  if(s.includes("developer")) jobs.push("Software Developer");
  if(s.includes("marketing")) jobs.push("Marketing Executive");
  if(s.includes("chef")) jobs.push("Chef");
  if(s.includes("sales")) jobs.push("Sales Executive");
  if(jobs.length===0) jobs.push("Add more skills");
  return jobs.join(", ");
}

/* AI TIPS */
function getTips(text){
  let t=[];
  if(text.length<120) t.push("Add more details");
  if(!text.includes("experience")) t.push("Add experience section");
  if(!text.includes("skills")) t.push("Add skills section");
  return t.join(" | ");
}

/* GENERATE */
function generate(){

  const text = name.value+" "+skills.value+" "+experience.value+" "+about.value;
  const ats = getATSScore(text);
  const jobs = getJobs(skills.value);
  const tips = getTips(text);

  document.getElementById("resume").innerHTML=`
    <div class="resume-box" id="resumeBox">

      <center>
        ${photoData?`<img src="${photoData}" width="100" style="border-radius:50%">`:""}
        <h2>${name.value}</h2>
        <p>${qualification.value}</p>
      </center>

      <hr>

      <p><b>Experience:</b> ${experience.value}</p>
      <p><b>Skills:</b> ${skills.value}</p>
      <p><b>Hobbies:</b> ${hobbies.value}</p>

      <h3>About</h3>
      <p>${about.value}</p>

      <hr>

      <p><b>Declaration:</b> ${declaration.value}</p>
      <p><b>Signature:</b> ${signature.value}</p>

      <hr>

      <h3>🔥 ATS SCORE: ${ats}/100</h3>
      <p><b>🎯 Jobs:</b> ${jobs}</p>
      <p><b>💡 Tips:</b> ${tips}</p>

    </div>
  `;
}

/* PDF */
function downloadPDF(){
  html2pdf().from(resumeBox).save("resume.pdf");
}

/* IMAGE */
function downloadImage(){
  html2canvas(resumeBox).then(c=>{
    let a=document.createElement("a");
    a.download="resume.png";
    a.href=c.toDataURL();
    a.click();
  });
}

/* EUROPLUS CV (PREMIUM FEATURE) */
function downloadEuroPlusCV(){

  if(!isPremium){
    alert("Premium required for Europlus CV");
    return;
  }

  const cv = `
EUROPLUS CV

Name: ${name.value}
Age: ${age.value}
Qualification: ${qualification.value}

Experience:
${experience.value}

Skills:
${skills.value}

Hobbies:
${hobbies.value}

About:
${about.value}

Declaration:
${declaration.value}

Signature:
${signature.value}

Date: ${new Date().toLocaleDateString()}
  `;

  const blob = new Blob([cv],{type:"text/plain"});
  const a=document.createElement("a");
  a.download="Europlus_CV.txt";
  a.href=URL.createObjectURL(blob);
  a.click();
}

/* CLEAR */
function clearData(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  resume.innerHTML="";
}

</script>

</body>
</html>
