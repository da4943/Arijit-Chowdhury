<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <script src="https://www.paypal.com/sdk/js?client-id=ATxSvTwRQxtN5NBu5Kj8GAjZCDRzCpb_aoO_L_vB9IAF-p179MOTDCtUhVEYGG1B-2P-n47P6BL4B&currency=USD"></script>

  <style>
    body{margin:0;font-family:Arial;background:linear-gradient(135deg,#050816,#0b1220);color:white;}

    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      background:#0f172a;
    }

    .logo{font-size:20px;font-weight:bold;color:#38bdf8;}

    .social{display:flex;align-items:center;gap:10px;}

    .social button{
      padding:10px 14px;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}

    .container{max-width:1000px;margin:auto;padding:15px;}

    .hero{text-align:center;padding:25px;}
    .hero h1{font-size:28px;color:#38bdf8;}

    .card{background:#111827;padding:20px;margin-top:15px;border-radius:15px;}

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
    }

    button{background:#38bdf8;font-weight:bold;cursor:pointer;}

    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}

    .resume-box{background:white;color:black;padding:20px;border-radius:12px;}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
    @media(max-width:768px){.grid{grid-template-columns:1fr}}

    /* LOGIN FIX */
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);}
    .modal-box{width:300px;margin:100px auto;background:#111827;padding:20px;border-radius:12px;}

    /* VERIFIED BADGE */
    .verified{
      display:flex;
      align-items:center;
      gap:6px;
      color:#22c55e;
      font-size:13px;
      margin-top:5px;
    }

    .qr-box{
      text-align:center;
      margin-top:10px;
      background:#0b1220;
      padding:10px;
      border-radius:10px;
      border:1px solid #1f2937;
    }

  </style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="logo">AOV AI Resume</div>

  <div class="social">
    <button onclick="openLogin()">Login</button>

    <!-- ✅ FIXED SIGNUP BUTTON -->
    <button onclick="signup()">Signup</button>

    <button onclick="logout()">Logout</button>

    <button class="google"><i class="bi bi-google"></i> Google</button>
    <button class="linkedin"><i class="bi bi-linkedin"></i> LinkedIn</button>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1>Create Professional Resume in Seconds</h1>
    <p id="userStatus">Not logged in</p>
  </div>

  <!-- PAYMENT -->
  <div class="card">
    <h2>💎 Premium ₹200</h2>

    <div class="verified">
      <i class="bi bi-patch-check-fill"></i> Verified Payment System
    </div>

    <div class="qr-box">
      <img width="180"
        src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay">
      <p>Scan & Pay via UPI (India Users)</p>
    </div>

    <div id="paypal-button-container"></div>
  </div>

  <!-- BUILDER -->
  <div class="card">
    <h2>Resume Builder</h2>

    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="father" placeholder="Father Name">
      <input id="phone" placeholder="Phone Number">
      <input id="email" placeholder="Email ID">
      <input id="age" placeholder="Age">
      <input id="address" placeholder="Address">
      <input id="qualification" placeholder="Qualification">
      <input id="experience" placeholder="Experience">
    </div>

    <input id="skills" placeholder="Skills">
    <input id="hobbies" placeholder="Hobbies">
    <input id="about" placeholder="About You">

    <button onclick="generate()">Generate Resume</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
    <button class="btn-clear" onclick="clearData()">Clear Data</button>
  </div>

  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3>Login</h3>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Signup</button>
    <button onclick="closeLogin()">Close</button>
  </div>
</div>

<script>

let resumeBox=null;

/* LOGIN */
function openLogin(){document.getElementById("loginModal").style.display="block";}
function closeLogin(){document.getElementById("loginModal").style.display="none";}

async function login(){
  try{
    await firebaseLogin(firebaseAuth,email.value,password.value);
    alert("Login Success");
    closeLogin();
  }catch(e){alert(e.message);}
}

async function signup(){
  try{
    await firebaseSignup(firebaseAuth,email.value,password.value);
    alert("Signup Success");
    closeLogin();
  }catch(e){alert(e.message);}
}

async function logout(){
  await firebaseLogout(firebaseAuth);
  alert("Logged out");
}

/* PAYPAL */
paypal.Buttons({
  createOrder:(data,actions)=>{
    return actions.order.create({
      purchase_units:[{amount:{value:"200"}}]
    });
  },
  onApprove:(data,actions)=>{
    return actions.order.capture().then(()=>{
      alert("Payment Success ✔");
      localStorage.setItem("premium","yes");
    });
  }
}).render('#paypal-button-container');

/* RESUME */
function generate(){
  document.getElementById("resume").innerHTML=`
    <div class="resume-box">
      <h2>${name.value}</h2>
      <p>${father.value}</p>
      <p>${phone.value} | ${email.value}</p>
      <p>${address.value}</p>
      <hr>
      <p>${qualification.value}</p>
      <p>${experience.value}</p>
      <p>${skills.value}</p>
      <p>${hobbies.value}</p>
      <p>${about.value}</p>
    </div>
  `;
  resumeBox=document.querySelector(".resume-box");
}

function downloadPDF(){
  if(!resumeBox){alert("Generate first");return;}
  html2pdf().from(resumeBox).save();
}

function clearData(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  document.getElementById("resume").innerHTML="";
  resumeBox=null;
}

</script>

</body>
</html>
