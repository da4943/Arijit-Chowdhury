<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <!-- ICON -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- PAYPAL -->
  <script src="https://www.paypal.com/sdk/js?client-id=ATxSvTwRQxtN5NBu5Kj8GAjZCDRzCpb_aoO_L_vB9IAF-p179MOTDCtUhVEYGG1B-2P-n47P6BL4B&currency=USD"></script>

  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    import {
      getFirestore, doc, setDoc, getDocs, collection
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBpJQ44k1gokp3sSZggyESC7HpvqssClEE",
      authDomain: "aov-ai-jobs-c697d.firebaseapp.com",
      projectId: "aov-ai-jobs-c697d",
      storageBucket: "aov-ai-jobs-c697d.firebasestorage.app",
      messagingSenderId: "898401199585",
      appId: "1:898401199585:web:59e6fdeba0568d6255dea0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseAuth = auth;
    window.firebaseLogin = signInWithEmailAndPassword;
    window.firebaseSignup = createUserWithEmailAndPassword;
    window.firebaseLogout = signOut;
    window.firebaseOnAuth = onAuthStateChanged;
    window.db = db;
    window.setDoc = setDoc;
    window.getDocs = getDocs;
    window.collection = collection;
    window.doc = doc;
  </script>

  <style>
    body{margin:0;font-family:Arial;background:linear-gradient(135deg,#050816,#0b1220);color:white;}
    .nav{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#0f172a;}
    .logo{font-size:20px;font-weight:bold;color:#38bdf8;}
    .social{display:flex;gap:10px;align-items:center;}
    .social button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}

    .container{max-width:1000px;margin:auto;padding:15px;}
    .hero{text-align:center;padding:25px;}
    .hero h1{color:#38bdf8;}

    .card{background:#111827;padding:20px;margin-top:15px;border-radius:15px;}

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
    }

    button{background:#38bdf8;font-weight:bold;cursor:pointer;}
    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}

    .resume-box{background:white;color:black;padding:20px;border-radius:12px;}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
    @media(max-width:768px){.grid{grid-template-columns:1fr}}

    .admin-box{
      background:#0f172a;
      padding:15px;
      margin-top:15px;
      border-radius:10px;
    }
  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>

  <div class="social">
    <button onclick="loadPayments()">Admin</button>
    <button onclick="logout()">Logout</button>

    <button class="google"><i class="bi bi-google"></i> Google</button>
    <button class="linkedin"><i class="bi bi-linkedin"></i> LinkedIn</button>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1>Create Professional Resume</h1>
    <p id="userStatus">Not logged in</p>
  </div>

  <!-- PAYPAL -->
  <div class="card">
    <h2>💎 Premium Unlock ($20 One-Time)</h2>
    <div id="paypal-button-container"></div>
  </div>

  <!-- BUILDER -->
  <div class="card">
    <h2>Resume Builder</h2>

    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="age" placeholder="Age">
      <input id="qualification" placeholder="Qualification">
      <input id="experience" placeholder="Experience">
    </div>

    <input id="skills" placeholder="Skills">
    <input id="about" placeholder="About You">

    <button onclick="generate()">Generate Resume</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
  </div>

  <!-- RESUME -->
  <div class="card">
    <div id="resume"></div>
  </div>

  <!-- ADMIN PANEL -->
  <div class="card">
    <h2>📊 Who Paid (Admin Panel)</h2>
    <div id="paymentsList"></div>
  </div>

</div>

<script>

let resumeBox=null;

/* PAYPAL */
paypal.Buttons({
  createOrder: (data, actions)=>{
    return actions.order.create({
      purchase_units:[{ amount:{ value:'20' } }]
    });
  },

  onApprove: (data, actions)=>{
    return actions.order.capture().then(async (details)=>{

      const user = firebaseAuth.currentUser;

      if(user){
        await setDoc(doc(db,"payments",user.uid),{
          email:user.email,
          paymentId:details.id,
          status:"paid",
          amount:"20",
          time:new Date().toISOString()
        });

        alert("Payment Success ✔ Stored in Database");
      }

    });
  }

}).render("#paypal-button-container");


/* AUTH */
firebaseOnAuth(firebaseAuth,(user)=>{
  userStatus.innerText = user ? "Logged in: "+user.email : "Not logged in";
});

/* ADMIN - LOAD ALL PAYMENTS */
async function loadPayments(){
  const snap = await getDocs(collection(db,"payments"));
  let html="";

  snap.forEach(doc=>{
    const d = doc.data();
    html += `
      <div class="admin-box">
        <b>Email:</b> ${d.email}<br>
        <b>Status:</b> ${d.status}<br>
        <b>Payment ID:</b> ${d.paymentId}<br>
        <b>Time:</b> ${d.time}
      </div>
    `;
  });

  paymentsList.innerHTML = html || "No payments yet";
}


/* RESUME */
function generate(){
  document.getElementById("resume").innerHTML=`
    <div class="resume-box" id="resumeBox">
      <h2>${name.value}</h2>
      <p>${qualification.value}</p>
      <p>${experience.value}</p>
      <p>${skills.value}</p>
      <p>${about.value}</p>
    </div>
  `;
  resumeBox=document.getElementById("resumeBox");
}

/* PDF */
function downloadPDF(){
  html2pdf().from(resumeBox).save("resume.pdf");
}

/* LOGOUT */
async function logout(){
  await firebaseLogout(firebaseAuth);
  alert("Logged out");
}

</script>

</body>
</html>
