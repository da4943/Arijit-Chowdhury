<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - SaaS System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    h1{
      text-align:center;
      color:#38bdf8;
      margin-bottom:5px;
    }

    .status{
      text-align:center;
      color:gold;
      margin-bottom:15px;
      font-weight:bold;
    }

    .card{
      background:#111827;
      padding:20px;
      margin-bottom:20px;
      border-radius:12px;
      border:1px solid #334155;
    }

    .card h2{
      margin-bottom:10px;
      color:#38bdf8;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      background:#0b1220;
      color:white;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:12px;
      background:#38bdf8;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .resume{
      background:white;
      color:black;
      padding:25px;
      border-radius:10px;
      line-height:1.6;
    }

    .job{
      background:#0b1220;
      padding:15px;
      margin-top:12px;
      border-radius:10px;
      border:1px solid #334155;
    }

    .job a{
      display:block;
      margin-top:5px;
      color:#38bdf8;
    }

    .premium{
      border:2px solid gold;
      text-align:center;
    }

    .signature{
      margin-top:40px;
      text-align:right;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚀 AOV AI Jobs</h1>
  <div class="status" id="status"></div>

  <!-- PROFILE -->
  <div class="card">
    <h2>📄 Create Profile</h2>

    <input id="name" placeholder="Full Name">
    <input id="headline" placeholder="Resume Headline">
    <input id="father" placeholder="Father Name">
    <input id="age" placeholder="Age">
    <input id="address" placeholder="Address">
    <input id="mobile" placeholder="Mobile">
    <input id="email" placeholder="Email">
    <input id="skills" placeholder="Skills (ai, python, marketing)">
    <input id="exp" placeholder="Experience">
    <input id="qualification" placeholder="Qualification">
    <input id="edu" placeholder="Education">
    <input id="hobbies" placeholder="Hobbies">

    <button onclick="generateResume()">Generate Resume</button>
    <button onclick="generateJobs()">Find Jobs</button>
  </div>

  <!-- RESUME -->
  <div class="card">
    <h2>📑 Corporate Resume</h2>
    <div id="resume"></div>
    <button onclick="downloadPDF()">Download PDF</button>
  </div>

  <!-- JOBS -->
  <div class="card">
    <h2>🎯 AI Job Matches</h2>
    <div id="jobs"></div>
  </div>

  <!-- PREMIUM -->
  <div class="card premium">
    <h2>💎 Premium ₹200</h2>

    <p>1️⃣ Scan & Pay</p>

    <img width="160"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR">

    <p>2️⃣ Enter UPI Transaction ID (UTR)</p>

    <input id="utr" placeholder="Enter UTR Number">

    <button onclick="submitPayment()">Submit Payment</button>

    <p style="font-size:12px;color:gray;">
      Your payment will be verified manually.
    </p>
  </div>

</div>

<script>

// STATUS
let isPremium = localStorage.getItem("premiumUser") === "true";
document.getElementById("status").innerText =
  isPremium ? "💎 Premium Activated" : "🆓 Free User";

// JOB DATA
const jobs = [
  {title:"AI Developer",skills:["ai","python","ml"]},
  {title:"Data Analyst",skills:["data","sql","excel"]},
  {title:"Web Developer",skills:["javascript","react","web"]},
  {title:"Marketing Executive",skills:["marketing","seo"]}
];

// RESUME
function generateResume(){

  let name = document.getElementById("name").value;
  let headline = document.getElementById("headline").value;

  let html = `
  <div class="resume" id="resumeContent">
    <h2 style="text-align:center">${name}</h2>
    <p style="text-align:center"><b>${headline}</b></p>
    <hr>
    <p><b>Skills:</b> ${skills.value}</p>
    <p><b>Experience:</b> ${exp.value}</p>
    <p><b>Education:</b> ${edu.value}</p>
    <p><b>Hobbies:</b> ${hobbies.value}</p>

    <div class="signature">
      <p>Date: ${new Date().toLocaleDateString()}</p>
      <p>Yours faithfully</p>
      <p><b>${name}</b></p>
    </div>
  </div>
  `;

  document.getElementById("resume").innerHTML = html;
}

// JOBS
function generateJobs(){

  let skills = document.getElementById("skills").value.toLowerCase().split(/[\s,]+/);
  let html = "";
  let count = 0;

  jobs.forEach(j=>{
    let score = 0;

    j.skills.forEach(s=>{
      if(skills.includes(s)) score+=50;
    });

    if(score>0){

      count++;

      if(!isPremium && count>2) return;

      html+=`
        <div class="job">
          <h3>${j.title}</h3>
          <p>${score}% match</p>
          <a href="https://www.linkedin.com/jobs/search/?keywords=${j.title}" target="_blank">LinkedIn Jobs</a>
          <a href="https://www.google.com/search?q=${j.title}+jobs" target="_blank">Google Jobs</a>
        </div>
      `;
    }
  });

  if(!isPremium){
    html += "<p style='color:gold'>🔒 Upgrade to Premium for full jobs</p>";
  }

  document.getElementById("jobs").innerHTML = html || "No jobs found";
}

// PDF LOCK
function downloadPDF(){
  if(!isPremium){
    alert("🔒 Premium required");
    return;
  }
  html2pdf().from(document.getElementById("resumeContent")).save();
}

// PAYMENT VERIFY
function submitPayment(){

  let utr = document.getElementById("utr").value;

  if(utr.length < 6){
    alert("Enter valid UTR number");
    return;
  }

  alert("Payment submitted. Admin will verify.");

  // TEMP unlock (you can remove later)
  localStorage.setItem("premiumUser","true");
  location.reload();
}

</script>

</body>
</html>
