<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <script src="https://www.paypal.com/sdk/js?client-id=ATxSvTwRQxtN5NBu5Kj8GAjZCDRzCpb_aoO_L_vB9IAF-p179MOTDCtUhVEYGG1B-2P-n47P6BL4B&currency=USD"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f4f6fb;
  color:#111;
}

/* NAV (UNCHANGED STRUCTURE) */
.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:white;
  border-bottom:1px solid #ddd;
}

.logo{
  font-size:20px;
  font-weight:bold;
  color:#2563eb;
}

/* SOCIAL */
.social{
  display:flex;
  align-items:center;
  gap:10px;
}

/* BUTTON FIX ONLY */
button{
  padding:10px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

/* ICON BUTTON FIX */
.icon-btn{
  display:flex;
  align-items:center;
  gap:6px;
  background:#f1f5f9;
  color:#111;
}

/* GOOGLE / LINKEDIN FIX */
.google{
  background:white;
  border:1px solid #ddd;
  display:flex;
  align-items:center;
  gap:6px;
}

.linkedin{
  background:#0a66c2;
  color:white;
  display:flex;
  align-items:center;
  gap:6px;
}

/* CARD (UNCHANGED STYLE) */
.card{
  background:white;
  padding:20px;
  margin:15px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ddd;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

@media(max-width:768px){
  .grid{grid-template-columns:1fr;}
}

/* RESUME */
.resume-box{
  background:white;
  color:#111;
  padding:20px;
  border-radius:12px;
  border:1px solid #eee;
}

/* HERO */
.hero{
  text-align:center;
  padding:20px;
}

.hero h1{
  color:#2563eb;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="logo">AOV AI Resume</div>

  <div class="social">

    <button onclick="openLogin()">Login</button>
    <button onclick="signup()">Signup</button>
    <button onclick="logout()">Logout</button>

    <!-- ICON FIX ONLY -->
    <button class="google">
      <i class="bi bi-google"></i> Google
    </button>

    <button class="linkedin">
      <i class="bi bi-linkedin"></i> LinkedIn
    </button>

  </div>
</div>

<!-- HERO -->
<div class="hero">
  <h1>Create Professional Resume</h1>
  <p id="userStatus">Not logged in</p>
</div>

<!-- PAYPAL -->
<div class="card">
  <h2>💳 Premium Payment</h2>
  <div id="paypal-button-container"></div>
</div>

<!-- BUILDER -->
<div class="card">
  <h2>Resume Builder</h2>

  <div class="grid">
    <input id="name" placeholder="Full Name">
    <input id="age" placeholder="Age">
    <input id="qualification" placeholder="Qualification">
    <input id="experience" placeholder="Experience">
  </div>

  <input id="skills" placeholder="Skills">
  <input id="hobbies" placeholder="Hobbies">
  <input id="about" placeholder="About You">

  <button onclick="generate()">Generate Resume</button>
  <button onclick="downloadPDF()">Download PDF</button>
  <button onclick="downloadImage()">Download Image</button>
  <button onclick="clearData()">Clear</button>
</div>

<!-- OUTPUT -->
<div class="card">
  <div id="resume"></div>
</div>

<!-- LOGIN -->
<div id="loginModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000000aa;">
  <div style="background:white;padding:20px;width:300px;margin:100px auto;border-radius:10px;">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="closeLogin()">Close</button>
  </div>
</div>

<script>

let resumeBox=null;

/* LOGIN */
function openLogin(){loginModal.style.display="block"}
function closeLogin(){loginModal.style.display="none"}

function login(){alert("Login")}
function signup(){alert("Signup")}
function logout(){alert("Logout")}

/* PAYPAL */
paypal.Buttons({
  createOrder:(d,a)=>a.order.create({purchase_units:[{amount:{value:"20"}}]}),
  onApprove:(d,a)=>a.order.capture().then(()=>{
    alert("Payment Success ✔");
  })
}).render('#paypal-button-container');

/* RESUME */
function generate(){
  document.getElementById("resume").innerHTML=`
    <div class="resume-box">
      <h2>${name.value}</h2>
      <p>${qualification.value}</p>
      <p>${experience.value}</p>
      <p>${skills.value}</p>
      <p>${hobbies.value}</p>
      <p>${about.value}</p>
    </div>
  `;
  resumeBox=document.querySelector(".resume-box");
}

/* PDF */
function downloadPDF(){
  html2pdf().from(resumeBox).save();
}

/* IMAGE */
function downloadImage(){
  html2canvas(resumeBox).then(c=>{
    let a=document.createElement("a");
    a.download="resume.png";
    a.href=c.toDataURL();
    a.click();
  });
}

/* CLEAR */
function clearData(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  resume.innerHTML="";
}

</script>

</body>
</html>
