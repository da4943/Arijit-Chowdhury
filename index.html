<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Corporate Resume System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:15px;
    }

    h1{
      text-align:center;
      color:#38bdf8;
    }

    .status{
      text-align:center;
      color:gold;
      margin-bottom:10px;
    }

    .card{
      background:#111827;
      padding:15px;
      margin-bottom:15px;
      border-radius:12px;
      border:1px solid #334155;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:8px;
      border-radius:8px;
      border:none;
      background:#0b1220;
      color:white;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#38bdf8;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .resume{
      background:white;
      color:black;
      padding:25px;
      border-radius:10px;
    }

    .job{
      background:#0b1220;
      padding:10px;
      margin-top:10px;
      border-radius:8px;
      border:1px solid #334155;
    }

    .premium{
      border:2px solid gold;
    }

    .signature{
      margin-top:40px;
      text-align:right;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚀 AOV AI Jobs System</h1>

  <div class="status" id="status"></div>

  <!-- PROFILE -->
  <div class="card">
    <h2>📄 Create Profile</h2>

    <input id="name" placeholder="Full Name">
    <input id="headline" placeholder="Resume Headline">
    <input id="father" placeholder="Father Name">
    <input id="age" placeholder="Age">
    <input id="address" placeholder="Address">
    <input id="mobile" placeholder="Mobile">
    <input id="email" placeholder="Email">
    <input id="skills" placeholder="Skills (ai, python, marketing)">
    <input id="exp" placeholder="Experience">
    <input id="qualification" placeholder="Qualification">
    <input id="edu" placeholder="Education">
    <input id="hobbies" placeholder="Hobbies">

    <button onclick="generateResume()">Generate Resume</button>
    <button onclick="generateJobs()">Find Jobs</button>
  </div>

  <!-- RESUME -->
  <div class="card">
    <h2>📑 Corporate Resume</h2>
    <div id="resume"></div>
    <button onclick="downloadPDF()">Download PDF</button>
  </div>

  <!-- JOBS -->
  <div class="card">
    <h2>🎯 AI Job Matches</h2>
    <div id="jobs"></div>
  </div>

  <!-- PREMIUM -->
  <div class="card premium">
    <h2>💎 Premium ₹200</h2>

    <img width="150"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR">

    <button onclick="pay()">Pay & Unlock Premium</button>
  </div>

</div>

<script>

// 🔒 PREMIUM STATUS
let isPremium = localStorage.getItem("premiumUser") === "true";
document.getElementById("status").innerText = isPremium ? "💎 Premium User" : "🆓 Free User";

// JOB DATA
const jobs = [
  {title:"AI Developer",skills:["ai","python","ml"]},
  {title:"Data Analyst",skills:["data","sql","excel"]},
  {title:"Web Developer",skills:["javascript","react","web"]},
  {title:"Marketing Executive",skills:["marketing","seo"]}
];

// RESUME
function generateResume(){

  let name = document.getElementById("name").value;
  let headline = document.getElementById("headline").value;
  let father = document.getElementById("father").value;
  let age = document.getElementById("age").value;
  let address = document.getElementById("address").value;
  let mobile = document.getElementById("mobile").value;
  let email = document.getElementById("email").value;
  let skills = document.getElementById("skills").value;
  let exp = document.getElementById("exp").value;
  let qualification = document.getElementById("qualification").value;
  let edu = document.getElementById("edu").value;
  let hobbies = document.getElementById("hobbies").value;

  let date = new Date().toLocaleDateString();

  document.getElementById("resume").innerHTML = `
    <div class="resume" id="resumeContent">
      <h2 style="text-align:center">${name}</h2>
      <p style="text-align:center"><b>${headline}</b></p>
      <hr>

      <p><b>Father:</b> ${father}</p>
      <p><b>Age:</b> ${age}</p>
      <p><b>Address:</b> ${address}</p>
      <p><b>Mobile:</b> ${mobile}</p>
      <p><b>Email:</b> ${email}</p>

      <h3>Profile Summary</h3>
      <p>Qualified in ${qualification}, experienced in ${exp}, skilled in ${skills}.</p>

      <h3>Skills</h3><p>${skills}</p>
      <h3>Experience</h3><p>${exp}</p>
      <h3>Education</h3><p>${edu}</p>
      <h3>Hobbies</h3><p>${hobbies}</p>

      <div class="signature">
        <p>Date: ${date}</p>
        <p>Yours faithfully</p>
        <br><br>
        <p><b>${name}</b></p>
      </div>
    </div>
  `;
}

// JOB MATCH (🔒 LIMITED FOR FREE)
function generateJobs(){

  let skills = document.getElementById("skills").value.toLowerCase().split(/[\s,]+/);

  let html = "";
  let count = 0;

  jobs.forEach(j=>{
    let score = 0;

    j.skills.forEach(s=>{
      if(skills.includes(s)) score+=50;
    });

    if(score>0){

      count++;

      if(!isPremium && count > 2) return;

      html+=`
        <div class="job">
          <h3>${j.title}</h3>
          <p>Match: ${score}%</p>

          <a href="https://www.linkedin.com/jobs/search/?keywords=${j.title}" target="_blank">LinkedIn</a><br>
          <a href="https://www.google.com/search?q=${j.title}+jobs" target="_blank">Google Jobs</a>
        </div>
      `;
    }
  });

  if
