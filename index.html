<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - SaaS Level 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    /* TOP NAV */
    .nav{
      position:sticky;
      top:0;
      background:#111827;
      padding:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid #334155;
      z-index:10;
    }

    .logo{
      font-weight:bold;
      color:#38bdf8;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:15px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    @media(max-width:800px){
      .grid{grid-template-columns:1fr;}
    }

    .card{
      background:#111827;
      border:1px solid #334155;
      padding:15px;
      border-radius:12px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #334155;
      background:#0b1220;
      color:white;
    }

    .btn{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#38bdf8;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
      color:black;
    }

    .skill-box{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }

    .skill{
      padding:6px 10px;
      border:1px solid #334155;
      border-radius:20px;
      cursor:pointer;
      font-size:12px;
    }

    .skill:hover{
      background:#38bdf8;
      color:black;
    }

    .job{
      padding:12px;
      border:1px solid #334155;
      border-radius:10px;
      margin-top:10px;
      background:#0b1220;
    }

    .score{
      color:#22c55e;
      font-weight:bold;
    }

    .qr{
      width:160px;
    }

    .center{
      text-align:center;
    }

  </style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="logo">🤖 AOV AI SaaS</div>
  <div>Level 4 System</div>
</div>

<div class="container grid">

  <!-- PROFILE -->
  <div class="card">
    <h2>📄 AI Profile Builder</h2>

    <input id="name" placeholder="Full Name">
    <input id="skills" placeholder="Skills (ai, python, ml)">
    <input id="exp" placeholder="Experience (fresher/junior/senior)">

    <button class="btn" onclick="saveProfile()">Save Profile</button>
    <button class="btn" onclick="generateAI()">Find AI Jobs</button>
  </div>

  <!-- SKILLS -->
  <div class="card">
    <h2>🔥 Skills Library</h2>

    <div class="skill-box">
      <div class="skill" onclick="addSkill('ai')">AI</div>
      <div class="skill" onclick="addSkill('python')">Python</div>
      <div class="skill" onclick="addSkill('ml')">ML</div>
      <div class="skill" onclick="addSkill('data')">Data</div>
      <div class="skill" onclick="addSkill('sql')">SQL</div>
      <div class="skill" onclick="addSkill('react')">React</div>
      <div class="skill" onclick="addSkill('javascript')">JS</div>
      <div class="skill" onclick="addSkill('chatbot')">Chatbot</div>
      <div class="skill" onclick="addSkill('marketing')">Marketing</div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="card">
    <h2>🎯 AI Job Matches</h2>
    <div id="results"></div>
  </div>

  <!-- RESUME -->
  <div class="card">
    <h2>📄 Live Resume Preview</h2>
    <div id="resume"></div>
  </div>

  <!-- PAYMENT -->
  <div class="card center">
    <h2>💳 Premium Unlock</h2>

    <p>AI Resume + Job Boost</p>
    <p><b>₹200 Lifetime Access</b></p>

    <img class="qr"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=200&cu=INR">

    <button class="btn" onclick="pay()">Pay Now</button>
  </div>

</div>

<script>

const jobs=[
  {title:"AI Engineer",skills:["ai","python","ml"],level:"senior"},
  {title:"ML Intern",skills:["ml","python"],level:"fresher"},
  {title:"Data Analyst",skills:["data","sql"],level:"junior"},
  {title:"Web Developer",skills:["react","javascript"],level:"junior"},
  {title:"Chatbot Developer",skills:["chatbot","ai"],level:"junior"}
];

// ADD SKILL
function addSkill(s){
  let i=document.getElementById("skills");
  i.value += (i.value?",":"")+s;
}

// SAVE PROFILE (local storage)
function saveProfile(){
  let data={
    name:document.getElementById("name").value,
    skills:document.getElementById("skills").value,
    exp:document.getElementById("exp").value
  };

  localStorage.setItem("profile",JSON.stringify(data));
  alert("Profile Saved ✅");
}

// AI ENGINE
function generateAI(){

  let skills=document.getElementById("skills").value.toLowerCase().split(",");
  let exp=document.getElementById("exp").value.toLowerCase();

  let results=[];

  jobs.forEach(j=>{
    let score=0;

    j.skills.forEach(s=>{
      if(skills.map(x=>x.trim()).includes(s)) score+=50;
    });

    if(exp.includes(j.level)) score+=20;

    if(score>0){
      results.push({...j,score});
    }
  });

  results.sort((a,b)=>b.score-a.score);

  let html="";

  results.forEach(r=>{
    html+=`
      <div class="job">
        <h3>${r.title}</h3>
        <p class="score">${r.score}% Match</p>

        <a class="btn" target="_blank"
        href="https://www.linkedin.com/jobs/search/?keywords=${r.title}">
        LinkedIn</a>

        <a class="btn" target="_blank"
        href="https://www.google.com/search?q=${r.title}+jobs">
        Google</a>
      </div>
    `;
  });

  document.getElementById("results").innerHTML=html;

  // resume preview
  document.getElementById("resume").innerHTML=`
    <p><b>Name:</b> ${document.getElementById("name").value}</p>
    <p><b>Skills:</b> ${document.getElementById("skills").value}</p>
    <p><b>Experience:</b> ${document.getElementById("exp").value}</p>
  `;
}

// payment
function pay(){
  window.location.href =
    "upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=200&cu=INR";
}

</script>

</body>
</html>
