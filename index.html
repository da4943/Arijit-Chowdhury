<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <script src="https://www.paypal.com/sdk/js?client-id=ATxSvTwRQxtN5NBu5Kj8GAjZCDRzCpb_aoO_L_vB9IAF-p179MOTDCtUhVEYGG1B-2P-n47P6BL4B&currency=USD"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#050816,#0b1220);
      color:white;
    }

    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
      background:#0f172a;
    }

    .logo{color:#38bdf8;font-size:20px;font-weight:bold;}

    .social button{
      margin-left:8px;
      padding:10px;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}

    .container{
      max-width:1000px;
      margin:auto;
      padding:15px;
    }

    .card{
      background:#111827;
      padding:20px;
      border-radius:15px;
      margin-top:15px;
    }

    /* =========================
       🔥 MODERN BUILDER DESIGN
    ==========================*/

    .builder-title{
      font-size:22px;
      color:#38bdf8;
      text-align:center;
      margin-bottom:15px;
    }

    .builder-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .field-box{
      background:#0b1220;
      padding:15px;
      border-radius:12px;
      border:1px solid #1f2937;
      transition:0.3s;
    }

    .field-box:hover{
      transform:scale(1.02);
      border-color:#38bdf8;
    }

    .field-title{
      font-size:13px;
      color:#9ca3af;
      margin-bottom:5px;
    }

    input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:none;
      outline:none;
      background:#111827;
      color:white;
    }

    .full-width{
      grid-column:span 2;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
      background:#38bdf8;
    }

    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}

    .resume-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:12px;
    }

    @media(max-width:768px){
      .builder-grid{grid-template-columns:1fr;}
      .full-width{grid-column:auto;}
    }

  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>
  <div class="social">
    <button>Login</button>
    <button>Logout</button>
    <button class="google"><i class="bi bi-google"></i> Google</button>
    <button class="linkedin"><i class="bi bi-linkedin"></i> LinkedIn</button>
  </div>
</div>

<div class="container">

  <div class="card">
    <h2 class="builder-title">🔥 Resume Builder Pro</h2>

    <div class="builder-grid">

      <div class="field-box">
        <div class="field-title">Full Name</div>
        <input id="name" placeholder="Enter Name">
      </div>

      <div class="field-box">
        <div class="field-title">Father Name</div>
        <input id="father" placeholder="Enter Father Name">
      </div>

      <div class="field-box">
        <div class="field-title">Phone Number</div>
        <input id="phone" placeholder="Enter Phone">
      </div>

      <div class="field-box">
        <div class="field-title">Email ID</div>
        <input id="email" placeholder="Enter Email">
      </div>

      <div class="field-box">
        <div class="field-title">Age</div>
        <input id="age" placeholder="Enter Age">
      </div>

      <div class="field-box">
        <div class="field-title">Address</div>
        <input id="address" placeholder="Enter Address">
      </div>

      <div class="field-box">
        <div class="field-title">Qualification</div>
        <input id="qualification" placeholder="Enter Qualification">
      </div>

      <div class="field-box">
        <div class="field-title">Experience</div>
        <input id="experience" placeholder="Enter Experience">
      </div>

      <div class="field-box full-width">
        <div class="field-title">Skills</div>
        <input id="skills" placeholder="Enter Skills (comma separated)">
      </div>

      <div class="field-box full-width">
        <div class="field-title">Hobbies</div>
        <input id="hobbies" placeholder="Enter Hobbies">
      </div>

      <div class="field-box full-width">
        <div class="field-title">About You</div>
        <input id="about" placeholder="Write about yourself">
      </div>

    </div>

    <button onclick="generate()">Generate Resume</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
    <button class="btn-clear" onclick="clearData()">Clear Data</button>

  </div>

  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<script>

let resumeBox=null;

function generate(){
  document.getElementById("resume").innerHTML=`
    <div class="resume-box">
      <h2>${name.value}</h2>
      <p>${father.value}</p>
      <p>${phone.value} | ${email.value}</p>
      <p>${address.value}</p>
      <hr>
      <p>${qualification.value}</p>
      <p>${experience.value}</p>
      <p>${skills.value}</p>
      <p>${hobbies.value}</p>
      <p>${about.value}</p>
    </div>
  `;
  resumeBox=document.querySelector(".resume-box");
}

function downloadPDF(){
  if(!resumeBox){alert("Generate first");return;}
  html2pdf().from(resumeBox).save("resume.pdf");
}

function clearData(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  document.getElementById("resume").innerHTML="";
  resumeBox=null;
}

</script>

</body>
</html>
