<!DOCTYPE html>
<html>
<head>
  <title>AOV Resume NO LOGIN FIX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firestore only (optional save) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    .card{
      padding:20px;
      margin:10px;
      background:#111827;
      border-radius:10px;
    }

    input,button{
      width:100%;
      padding:10px;
      margin-top:8px;
      border-radius:6px;
      border:none;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    .resume-box{
      background:white;
      color:black;
      padding:20px;
      border-radius:10px;
    }
  </style>
</head>

<body>

<!-- FORM -->
<div class="card">

  <h2>Resume Generator</h2>

  <input id="name" placeholder="Name">
  <input id="age" placeholder="Age">
  <input id="qualification" placeholder="Qualification">
  <input id="experience" placeholder="Experience">
  <input id="skills" placeholder="Skills">
  <input id="about" placeholder="About">
  <input id="photo" placeholder="Photo URL">
  <input id="declaration" placeholder="Declaration">
  <input id="signature" placeholder="Signature">

  <button onclick="generate()">Generate Resume</button>
  <button onclick="downloadPDF()">Download PDF</button>

</div>

<!-- RESUME -->
<div class="card">
  <div id="resume"></div>
</div>

<script>

/* OPTIONAL FIREBASE (SAFE) */
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

/* GENERATE */
function generate(){

  const data = {
    name: document.getElementById("name").value,
    age: document.getElementById("age").value,
    qualification: document.getElementById("qualification").value,
    experience: document.getElementById("experience").value,
    skills: document.getElementById("skills").value,
    about: document.getElementById("about").value,
    photo: document.getElementById("photo").value,
    declaration: document.getElementById("declaration").value,
    signature: document.getElementById("signature").value
  };

  document.getElementById("resume").innerHTML = `
    <div class="resume-box" id="resumeBox">

      <center>
        <img src="${data.photo}" width="90" style="border-radius:50%">
        <h2>${data.name}</h2>
      </center>

      <p><b>Age:</b> ${data.age}</p>
      <p><b>Qualification:</b> ${data.qualification}</p>
      <p><b>Experience:</b> ${data.experience}</p>
      <p><b>Skills:</b> ${data.skills}</p>
      <p><b>About:</b> ${data.about}</p>

      <hr>

      <p><b>Declaration:</b> ${data.declaration}</p>
      <p><b>Signature:</b> ${data.signature}</p>
      <p><b>Date:</b> ${new Date().toLocaleDateString()}</p>

    </div>
  `;
}

/* PDF */
function downloadPDF(){
  const el = document.getElementById("resumeBox");

  if(!el){
    alert("Generate first");
    return;
  }

  html2pdf().from(el).save("resume.pdf");
}

</script>

</body>
</html>
