<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:#0f172a;color:white}
    .container{max-width:900px;margin:auto;padding:20px}
    .card{background:#111827;padding:20px;margin:10px 0;border-radius:12px}
    input,button{width:100%;padding:10px;margin-top:8px;border-radius:6px;border:none}
    button{background:#38bdf8;font-weight:bold;cursor:pointer}
    .hidden{display:none}
    .resume{background:white;color:black;padding:20px;border-radius:10px}
    .center{text-align:center}
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="loginBox">
    <h2>Login Required</h2>
    <button onclick="googleLogin()">Login with Google</button>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <div class="card">
      <h2>Resume Builder</h2>

      <input id="name" placeholder="Full Name">
      <input id="father" placeholder="Father Name">
      <input id="age" placeholder="Age">
      <input id="gender" placeholder="Gender">
      <input id="address" placeholder="Address">
      <input id="skills" placeholder="Skills">
      <input id="exp" placeholder="Experience">

      <button onclick="generateResume()">Generate Resume</button>
      <button onclick="saveData()">Save to Firebase</button>
    </div>

    <div class="card">
      <div id="resume"></div>
      <button onclick="downloadPDF()">Download PDF</button>
    </div>

    <div class="card">
      <h2>Premium ₹200</h2>
      <img width="160"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR">

      <input id="utr" placeholder="Enter UTR">
      <button onclick="pay()">Submit Payment</button>
    </div>

  </div>

</div>

<script>

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBpJQ44k1gokp3sSZggyESC7HpvqssClEE",
  authDomain: "aov-ai-jobs-c697d.firebaseapp.com",
  projectId: "aov-ai-jobs-c697d",
  storageBucket: "aov-ai-jobs-c697d.firebasestorage.app",
  messagingSenderId: "898401199585",
  appId: "1:898401199585:web:760d147b7d9b23e655dea0"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let user = null;

// ✅ LOGIN (REDIRECT)
function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithRedirect(provider);
}

// ✅ MAIN FIX (AUTO LOGIN DETECTION)
auth.onAuthStateChanged((u)=>{
  if(u){
    user = u;
    document.getElementById("loginBox").style.display="none";
    document.getElementById("app").classList.remove("hidden");
  } else {
    document.getElementById("loginBox").style.display="block";
    document.getElementById("app").classList.add("hidden");
  }
});

// RESUME
function generateResume(){
  let html = `
  <div id="resumeContent" class="resume">

    <div class="center">
      <h2>${document.getElementById("name").value}</h2>
      <p>${document.getElementById("address").value}</p>
    </div>

    <p><b>Father:</b> ${document.getElementById("father").value}</p>
    <p><b>Age:</b> ${document.getElementById("age").value}</p>
    <p><b>Gender:</b> ${document.getElementById("gender").value}</p>
    <p><b>Skills:</b> ${document.getElementById("skills").value}</p>
    <p><b>Experience:</b> ${document.getElementById("exp").value}</p>

    <h3>Declaration</h3>
    <p>I hereby declare all information is correct.</p>

  </div>`;

  document.getElementById("resume").innerHTML = html;
}

// SAVE FIREBASE
function saveData(){
  if(!user){
    alert("Login first!");
    return;
  }

  db.collection("users").add({
    name: document.getElementById("name").value,
    email: user.email
  });

  alert("Saved ✔");
}

// PAYMENT
function pay(){
  if(!user){
    alert("Login first!");
    return;
  }

  db.collection("payments").add({
    email:user.email,
    utr:document.getElementById("utr").value,
    status:"pending"
  });

  alert("Payment Submitted");
}

// PDF
function downloadPDF(){
  let el = document.getElementById("resumeContent");
  if(!el){alert("Generate first");return;}
  html2pdf().from(el).save("resume.pdf");
}

</script>

</body>
</html>
