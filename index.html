<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
    }

    header {
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      color: #38bdf8;
    }

    .search {
      margin-top: 10px;
      padding: 14px;
      width: 80%;
      border-radius: 12px;
      border: none;
      font-size: 16px;
    }

    .btn {
      background: #38bdf8;
      color: black;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>AOV AI Jobs</h1>
  <p>AI-powered job discovery platform</p>

  <input id="jobSearch" class="search" type="text" placeholder="Search jobs..." onkeyup="searchJobs()">

  <!-- RESULT SHOWS HERE -->
  <div class="container" id="jobContainer"></div>

  <input id="userSkill" class="search" type="text" placeholder="Enter your skill">

  <br>

  <a class="btn" onclick="matchJobs()">Find Best Jobs</a>
</header>

<script>
const jobs = [
  {
    title: "AI Developer",
    description: "Work on AI models",
    link: "https://www.linkedin.com/jobs/search/?keywords=ai%20developer"
  },
  {
    title: "Machine Learning Intern",
    description: "Assist ML projects",
    link: "https://www.linkedin.com/jobs/search/?keywords=machine%20learning%20intern"
  },
  {
    title: "Chatbot Developer",
    description: "Build chatbot systems",
    link: "https://www.google.com/search?q=chatbot+developer+jobs"
  },
  {
    title: "Data Analyst",
    description: "Analyze data",
    link: "https://www.linkedin.com/jobs/search/?keywords=data%20analyst"
  }
];

// show jobs
function displayJobs(list) {
  let container = document.getElementById("jobContainer");
  container.innerHTML = "";

  list.forEach(job => {
    container.innerHTML += `
      <div class="card">
        <h2>${job.title}</h2>
        <p>${job.description}</p>
        <a class="btn" target="_blank" href="${job.link}">Apply</a>
      </div>
    `;
  });
}

// SEARCH
function searchJobs() {
  let input = document.getElementById("jobSearch").value.toLowerCase().trim();
  let container = document.getElementById("jobContainer");

  if (input === "") {
    displayJobs(jobs);
    return;
  }

  let found = false;
  let resultHTML = "";

  jobs.forEach(job => {
    let text = (job.title + job.description).toLowerCase();

    if (text.includes(input)) {
      found = true;
      resultHTML += `
        <div class="card">
          <h2>${job.title}</h2>
          <p>${job.description}</p>
          <a class="btn" target="_blank" href="${job.link}">Apply</a>
        </div>
      `;
    }
  });

  if (found) {
    container.innerHTML = resultHTML;
  } else {
    container.innerHTML = `
      <div class="card">
        <h2>No result found</h2>
        <p>Search on external platforms</p>

        <a class="btn" target="_blank" href="https://www.google.com/search?q=${input}+jobs">
          Google Search
        </a>

        <br>

        <a class="btn" target="_blank" href="https://www.linkedin.com/jobs/search/?keywords=${input}">
          LinkedIn Search
        </a>
      </div>
    `;
  }
}

// AI MATCH
function matchJobs() {
  let skill = document.getElementById("userSkill").value.toLowerCase();

  let result = jobs.filter(job =>
    job.title.toLowerCase().includes(skill) ||
    job.description.toLowerCase().includes(skill)
  );

  if (result.length > 0) {
    displayJobs(result);
  } else {
    document.getElementById("jobContainer").innerHTML = `
      <div class="card">
        <h2>No match found</h2>
      </div>
    `;
  }
}

// load default
displayJobs(jobs);
</script>

</body>
</html>
