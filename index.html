
<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Smart Resume Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Resume Builder - Create professional resumes instantly">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:#0f172a;color:white}
    .container{max-width:900px;margin:auto;padding:20px}
    .card{background:#111827;padding:20px;margin:10px 0;border-radius:12px}
    input,button{width:100%;padding:10px;margin-top:8px;border-radius:6px;border:none}
    button{background:#38bdf8;font-weight:bold;cursor:pointer}
    .hidden{display:none}
    .resume{background:white;color:black;padding:20px;border-radius:10px}
    .center{text-align:center}
    .header{font-size:22px;font-weight:bold;text-align:center;margin-bottom:10px}
    .footer{font-size:12px;text-align:center;margin-top:20px;color:#94a3b8}
  </style>
</head>

<body>

<div class="container">

  <div class="header">AOV AI Resume Builder</div>

  <!-- LOGIN -->
  <div class="card" id="loginBox">
    <h2>Login Required</h2>
    <button onclick="googleLogin()">Login with Google</button>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <div class="card">
      <h2>Create Your Resume</h2>

      <input id="name" placeholder="Full Name">
      <input id="father" placeholder="Father Name">
      <input id="age" placeholder="Age">
      <input id="gender" placeholder="Gender">
      <input id="address" placeholder="Address">
      <input id="skills" placeholder="Skills">
      <input id="exp" placeholder="Experience">

      <button onclick="generateResume()">Generate Resume</button>
      <button onclick="saveData()">Save</button>
    </div>

    <div class="card">
      <div id="resume"></div>
      <button onclick="downloadPDF()">Download PDF</button>
    </div>

    <!-- PRICING -->
    <div class="card">
      <h2>Premium Plan - ₹200</h2>
      <p>Unlock advanced resume features & download premium templates</p>

      <img width="160"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR">

      <input id="utr" placeholder="Enter UTR Number">
      <button onclick="pay()">Submit Payment</button>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    © 2026 AOV AI Jobs | Contact: carijit22@gmail.com <br>
    <a href="terms.html" style="color:#38bdf8">Terms</a> |
    <a href="privacy.html" style="color:#38bdf8">Privacy</a> |
    <a href="refund.html" style="color:#38bdf8">Refund</a>
  </div>

</div>

<script>

// ✅ FULL CORRECT FIREBASE CONFIG (FIXED)
const firebaseConfig = {
  apiKey: "AIzaSyBpJQ44k1gokp3sSZggyESC7HpvqssClEE",
  authDomain: "aov-ai-jobs-c697d.firebaseapp.com",
  projectId: "aov-ai-jobs-c697d",
  storageBucket: "aov-ai-jobs-c697d.firebasestorage.app",
  messagingSenderId: "898401199585",
  appId: "1:898401199585:web:760d147b7d9b23e655dea0",
  measurementId: "G-DM43LS8L6N"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let user = null;

auth.onAuthStateChanged((u)=>{
  if(u){
    user = u;
    document.getElementById("loginBox").style.display="none";
    document.getElementById("app").classList.remove("hidden");
  } else {
    document.getElementById("loginBox").style.display="block";
    document.getElementById("app").classList.add("hidden");
  }
});

// LOGIN
function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err=>{
    alert("Login error: " + err.message);
  });
}

// RESUME
function generateResume(){
  const nameVal = document.getElementById("name").value;
  const addressVal = document.getElementById("address").value;
  const fatherVal = document.getElementById("father").value;
  const ageVal = document.getElementById("age").value;
  const genderVal = document.getElementById("gender").value;
  const skillsVal = document.getElementById("skills").value;
  const expVal = document.getElementById("exp").value;

  let html = `
  <div id="resumeContent" class="resume">
    <div class="center">
      <h2>${nameVal}</h2>
      <p>${addressVal}</p>
    </div>
    <p><b>Father:</b> ${fatherVal}</p>
    <p><b>Age:</b> ${ageVal}</p>
    <p><b>Gender:</b> ${genderVal}</p>
    <p><b>Skills:</b> ${skillsVal}</p>
    <p><b>Experience:</b> ${expVal}</p>
  </div>`;

  document.getElementById("resume").innerHTML = html;
}

// SAVE
function saveData(){
  if(!user){ alert("Login first"); return; }

  db.collection("users").add({
    name: document.getElementById("name").value,
    email: user.email
  });

  alert("Saved ✔");
}

// PAYMENT
function pay(){
  if(!user){ alert("Login first"); return; }

  db.collection("payments").add({
    email:user.email,
    utr:document.getElementById("utr").value,
    status:"pending"
  });

  alert("Payment Submitted");
}

// PDF
function downloadPDF(){
  let el = document.getElementById("resumeContent");
  if(!el){alert("Generate first");return;}
  html2pdf().from(el).save("resume.pdf");
}

</script>

</body>
</html>
