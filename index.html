<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - Startup Level 2 FIX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#111827);
      color:white;
    }

    header{
      text-align:center;
      padding:30px;
    }

    h1{
      color:#38bdf8;
      font-size:40px;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    .card{
      background:#1f2937;
      padding:20px;
      border-radius:12px;
      margin-bottom:15px;
    }

    /* FIX ALIGNMENT */
    .form-grid{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    input{
      padding:12px;
      border-radius:8px;
      border:none;
      width:100%;
      box-sizing:border-box;
    }

    .btn{
      background:#38bdf8;
      color:black;
      padding:12px;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
      width:100%;
      margin-top:10px;
    }

    .job{
      background:#0f172a;
      padding:15px;
      border-radius:10px;
      margin-top:10px;
      border:1px solid #334155;
    }

    .score{
      color:#22c55e;
      font-weight:bold;
    }

    .link-btn{
      display:block;
      text-align:center;
      padding:10px;
      margin-top:8px;
      border-radius:8px;
      text-decoration:none;
      font-weight:bold;
    }

    .linkedin{
      background:#0a66c2;
      color:white;
    }

    .google{
      background:#db4437;
      color:white;
    }

  </style>
</head>

<body>

<header>
  <h1>🤖 AOV AI Jobs</h1>
  <p>Startup Level 2 AI System (FIXED)</p>
</header>

<div class="container">

  <!-- PROFILE -->
  <div class="card">
    <h2>📄 Create Profile</h2>

    <div class="form-grid">
      <input id="name" placeholder="Full Name">
      <input id="skills" placeholder="Skills (AI Python ML)">
      <input id="exp" placeholder="Experience (fresher/junior/senior)">
    </div>

    <button class="btn" onclick="generateAI()">Find Jobs</button>
  </div>

  <!-- RESULTS -->
  <div class="card">
    <h2>🎯 AI Job Results</h2>
    <div id="results"></div>
  </div>

</div>

<script>

const jobs = [
  {title:"AI Engineer",skills:["ai","python","ml"],level:"senior"},
  {title:"ML Intern",skills:["ml","python"],level:"fresher"},
  {title:"Data Analyst",skills:["data","sql"],level:"junior"},
  {title:"Web Developer",skills:["web","javascript"],level:"junior"},
  {title:"Marketing Executive",skills:["marketing"],level:"fresher"},
  {title:"Chatbot Developer",skills:["chatbot","ai"],level:"junior"}
];

function generateAI(){

  let skills = document.getElementById("skills").value.toLowerCase().split(/[\s,]+/);
  let exp = document.getElementById("exp").value.toLowerCase();

  let results = [];

  jobs.forEach(job=>{
    let score = 0;

    job.skills.forEach(s=>{
      if(skills.includes(s)) score += 50;
    });

    if(exp.includes(job.level)) score += 20;

    // SHOW EVEN LOW MATCH (FIX NO RESULT PROBLEM)
    if(score === 0) score = 10;

    results.push({...job,score});
  });

  results.sort((a,b)=>b.score-a.score);

  let html = "";

  results.forEach(j=>{
    html += `
      <div class="job">
        <h3>${j.title}</h3>
        <p class="score">${j.score}% match</p>

        <a class="link-btn linkedin" target="_blank"
          href="https://www.linkedin.com/jobs/search/?keywords=${j.title}">
          View on LinkedIn
        </a>

        <a class="link-btn google" target="_blank"
          href="https://www.google.com/search?q=${j.title}+jobs">
          Search on Google
        </a>
      </div>
    `;
  });

  document.getElementById("results").innerHTML = html;
}

</script>

</body>
</html>
