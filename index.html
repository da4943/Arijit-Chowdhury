<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs - SaaS Resume Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    .card{
      background:#111827;
      padding:20px;
      margin:15px 0;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.3);
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      font-size:14px;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-google{background:#db4437;}
    .btn-linkedin{background:#0a66c2;}

    .hidden{display:none;}

    .center{text-align:center;}

    .header{
      text-align:center;
      font-size:26px;
      font-weight:bold;
      margin:20px 0;
    }

    .premium{
      border:2px solid gold;
      padding:15px;
      border-radius:12px;
    }

    .resume{
      background:white;
      color:black;
      padding:20px;
      border-radius:10px;
    }

    img{
      display:block;
      margin:auto;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">AOV AI Resume SaaS</div>

  <!-- LOGIN SECTION -->
  <div class="card center" id="loginBox">
    <h2>Login to Continue</h2>

    <button class="btn-google" onclick="googleLogin()">Login with Google</button>
    <button class="btn-linkedin">Login with LinkedIn</button>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <!-- FORM -->
    <div class="card">
      <h2>Create Resume</h2>

      <input id="name" placeholder="Full Name">
      <input id="father" placeholder="Father Name">
      <input id="address" placeholder="Address">
      <input id="skills" placeholder="Skills">

      <button onclick="generateResume()">Generate Resume</button>
      <button onclick="saveData()">Save Data</button>
    </div>

    <!-- RESUME PREVIEW -->
    <div class="card">
      <div id="resume"></div>
      <button onclick="downloadPDF()">Download PDF</button>
    </div>

    <!-- PREMIUM SECTION -->
    <div class="card premium center">
      <h2>🔥 Premium Plan</h2>
      <p>Unlock PRO templates & unlimited downloads</p>
      <h3>₹199 / Month</h3>

      <img width="160"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=199&cu=INR">

      <input id="utr" placeholder="Enter UTR Number">
      <button onclick="pay()">Activate Premium</button>
    </div>

  </div>

</div>

<script>

// Firebase
firebase.initializeApp({
  apiKey: "AIzaSyBpJQ44k1gokp3sSZggyESC7HpvqssClEE",
  authDomain: "aov-ai-jobs-c697d.firebaseapp.com",
  projectId: "aov-ai-jobs-c697d"
});

const auth = firebase.auth();
const db = firebase.firestore();

let user=null;

// LOGIN
function googleLogin(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e=>alert(e.message));
}

// AUTH STATE
auth.onAuthStateChanged(u=>{
  user=u;

  if(user){
    loginBox.style.display="none";
    app.classList.remove("hidden");
  }else{
    loginBox.style.display="block";
    app.classList.add("hidden");
  }
});

// RESUME
function generateResume(){
  document.getElementById("resume").innerHTML=`
  <div class="resume">
    <h2>${name.value}</h2>
    <p>${address.value}</p>
    <p><b>Skills:</b> ${skills.value}</p>
  </div>`;
}

// SAVE
function saveData(){
  if(!user)return alert("Login first");

  db.collection("users").add({
    name:name.value,
    email:user.email
  });

  alert("Saved");
}

// PAYMENT
function pay(){
  if(!user)return alert("Login first");

  db.collection("payments").add({
    email:user.email,
    utr:utr.value,
    status:"pending"
  });

  alert("Payment submitted");
}

// PDF
function downloadPDF(){
  html2pdf().from(document.querySelector(".resume")).save("resume.pdf");
}

</script>

</body>
</html>
