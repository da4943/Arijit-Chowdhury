<!DOCTYPE html>
<html>
<head>
  <title>AI Resume SaaS PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:#0b1220;color:white}
    .nav{display:flex;justify-content:space-between;padding:15px;background:#111827}
    .nav button{padding:8px;border:none;border-radius:6px;background:#38bdf8;font-weight:bold}

    .container{max-width:1000px;margin:auto;padding:20px}
    .card{background:#1f2937;padding:20px;border-radius:12px;margin:10px 0}

    input,button{width:100%;padding:10px;margin-top:8px;border-radius:6px;border:none}

    .resume{background:white;color:black;padding:15px;border-radius:10px}
  </style>
</head>

<body>

<div class="nav">
  <div>AI Resume SaaS PRO</div>
  <div>
    <button onclick="login()">Login</button>
  </div>
</div>

<div class="container">

<!-- JOB LINKS -->
<div class="card">
  <h2>Find Jobs Instantly</h2>

  <button onclick="window.open('https://www.google.com/search?q=jobs+near+me')">
    🔍 Google Jobs Search
  </button>

  <button onclick="window.open('https://www.linkedin.com/jobs')">
    💼 LinkedIn Jobs
  </button>
</div>

<!-- RESUME BUILDER -->
<div class="card">
  <h2>Resume Builder</h2>

  <input id="name" placeholder="Full Name">
  <input id="phone" placeholder="Phone">
  <input id="skills" placeholder="Skills">
  <input id="education" placeholder="Education">
  <input id="experience" placeholder="Experience">

  <button onclick="saveResume()">Save Resume</button>
  <button onclick="generate()">Generate Preview</button>

  <div id="output"></div>
  <button onclick="downloadPDF()">Download PDF</button>
</div>

<!-- PREMIUM -->
<div class="card">
  <h2>Premium Unlock</h2>

  <img width="200"
  src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=199&cu=INR">

  <p>UPI ID: 9975076459@mbk</p>

  <button onclick="requestPremium()">I Have Paid</button>
</div>

</div>

<script>

// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBpJQ44k1gokp3sSZggyESC7HpvqssClEE",
  authDomain: "aov-ai-jobs-c697d.firebaseapp.com",
  projectId: "aov-ai-jobs-c697d",
  storageBucket: "aov-ai-jobs-c697d.firebasestorage.app",
  messagingSenderId: "898401199585",
  appId: "1:898401199585:web:760d147b7d9b23e655dea0"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let user = null;

// LOGIN
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider).then(res=>{
    user = res.user;

    db.collection("users").doc(user.uid).set({
      email: user.email,
      premium: false,
      createdAt: Date.now()
    }, {merge:true});

    alert("Logged in");
  });
}

// SAVE RESUME
function saveResume(){
  if(!user){ alert("Login first"); return; }

  db.collection("resumes").doc(user.uid).set({
    name: name.value,
    phone: phone.value,
    skills: skills.value,
    education: education.value,
    experience: experience.value,
    email: user.email,
    createdAt: Date.now()
  });

  alert("Resume saved to cloud ✔");
}

// GENERATE
function generate(){
  output.innerHTML = `
    <div class="resume">
      <h2>${name.value}</h2>
      <p>${phone.value}</p>
      <p>${skills.value}</p>
      <p>${education.value}</p>
      <p>${experience.value}</p>
    </div>
  `;
}

// PDF
function downloadPDF(){
  html2pdf().from(output).save("resume.pdf");
}

// PREMIUM REQUEST
function requestPremium(){
  if(!user){ alert("Login first"); return; }

  db.collection("payments").doc(user.uid).set({
    email:user.email,
    status:"pending"
  });

  alert("Payment submitted (manual approval)");
}

</script>

</body>
</html>
