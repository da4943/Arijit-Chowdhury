<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:15px;
    }

    .card{
      background:#111827;
      padding:15px;
      margin-bottom:15px;
      border-radius:12px;
      border:1px solid #334155;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:8px;
      border-radius:8px;
      border:none;
      background:#0b1220;
      color:white;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#38bdf8;
      border:none;
      border-radius:8px;
      font-weight:bold;
    }

    .job{
      background:#0f172a;
      padding:12px;
      border-radius:10px;
      margin-top:10px;
      border:1px solid #334155;
    }

    .links a{
      display:inline-block;
      margin-right:10px;
      margin-top:5px;
      color:#38bdf8;
      text-decoration:none;
      font-weight:bold;
    }

    .title{
      text-align:center;
      color:#38bdf8;
      font-size:26px;
      margin-bottom:10px;
    }

    .premium{
      border:2px solid gold;
      text-align:center;
    }

    .skill-box{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }

    .skill{
      background:#1f2937;
      padding:8px 12px;
      border-radius:20px;
      cursor:pointer;
      font-size:13px;
    }

    .skill:hover{
      background:#38bdf8;
      color:black;
    }

    .resume{
      background:#020617;
      padding:12px;
      border-radius:10px;
      margin-top:10px;
      white-space:pre-line;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="title">🤖 AOV AI JOBS</div>

  <!-- FORM -->
  <div class="card">
    <h3>📄 Create Profile</h3>

    <input id="name" placeholder="Full Name">
    <input id="skills" placeholder="Skills (ai python ml)">
    <input id="exp" placeholder="Experience (fresher/junior/senior)">

    <button onclick="generateAI()">Generate AI Resume + Jobs</button>
  </div>

  <!-- SKILLS -->
  <div class="card">
    <h3>🔥 Skills (Click)</h3>

    <div class="skill-box">
      <div class="skill" onclick="addSkill('ai')">AI</div>
      <div class="skill" onclick="addSkill('python')">Python</div>
      <div class="skill" onclick="addSkill('ml')">ML</div>
      <div class="skill" onclick="addSkill('data')">Data</div>
      <div class="skill" onclick="addSkill('sql')">SQL</div>
      <div class="skill" onclick="addSkill('javascript')">JavaScript</div>
      <div class="skill" onclick="addSkill('react')">React</div>
      <div class="skill" onclick="addSkill('marketing')">Marketing</div>
    </div>
  </div>

  <!-- RESUME -->
  <div class="card">
    <h3>📄 AI Resume</h3>
    <div id="resume"></div>
  </div>

  <!-- JOBS -->
  <div class="card">
    <h3>🎯 Job Matches</h3>
    <div id="jobs"></div>
  </div>

  <!-- PAYMENT -->
  <div class="card premium">
    <h3>💎 Premium ₹200</h3>

    <img width="160"
    src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR">

    <button onclick="pay()">Pay Now</button>
  </div>

</div>

<script>

const jobs = [
  {title:"AI Engineer",skills:["ai","python","ml"]},
  {title:"Data Analyst",skills:["data","sql"]},
  {title:"Web Developer",skills:["react","javascript"]},
  {title:"ML Intern",skills:["ml","python"]},
  {title:"Digital Marketing",skills:["marketing"]},
];

// ADD SKILL
function addSkill(s){
  let input = document.getElementById("skills");
  input.value += " " + s;
}

// MAIN AI
function generateAI(){

  let name = document.getElementById("name").value;
  let skillsText = document.getElementById("skills").value.toLowerCase();
  let exp = document.getElementById("exp").value;

  let skills = skillsText.split(/[\s,]+/);

  // RESUME
  let resume = `
Name: ${name}

Skills: ${skills.join(", ")}

Experience: ${exp}

Profile Summary:
A motivated candidate with strong skills in ${skills.join(", ")}.
Ready to work in real-world projects and grow professionally.
`;

  document.getElementById("resume").innerHTML =
    `<div class="resume">${resume}</div>`;

  // JOB MATCH
  let html = "";

  jobs.forEach(j=>{
    let score = 0;

    j.skills.forEach(s=>{
      if(skills.includes(s)) score += 50;
    });

    if(score > 0){
      html += `
        <div class="job">
          <h3>${j.title}</h3>
          <p>Match: ${score}%</p>

          <div class="links">
            <a target="_blank" href="https://www.linkedin.com/jobs/search/?keywords=${j.title}">
              LinkedIn
            </a>

            <a target="_blank" href="https://www.google.com/search?q=${j.title}+jobs">
              Google
            </a>
          </div>
        </div>
      `;
    }
  });

  if(html === ""){
    html = "<p>No match found. Try more skills.</p>";
  }

  document.getElementById("jobs").innerHTML = html;
}

// PAYMENT
function pay(){
  window.location.href =
    "upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR";
}

</script>

</body>
</html>
