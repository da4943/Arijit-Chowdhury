<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs SaaS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .container{max-width:900px;margin:auto;padding:20px;}

    .card{
      background:#111827;
      padding:20px;
      margin-bottom:15px;
      border-radius:12px;
    }

    input, button{
      width:100%;
      padding:10px;
      margin-top:8px;
      border-radius:6px;
      border:none;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    .hidden{display:none;}

    .btn-row{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .btn-row a{
      flex:1;
      text-align:center;
      padding:10px;
      border-radius:6px;
      text-decoration:none;
      color:white;
      font-weight:bold;
    }

    .google{background:#db4437;}
    .linkedin{background:#0a66c2;}

    .resume{
      background:white;
      color:black;
      padding:20px;
      border-radius:10px;
    }

    .center{text-align:center;}

    .photo{
      width:100px;
      height:100px;
      border-radius:50%;
      object-fit:cover;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="loginBox">
    <h2>🔐 Login</h2>
    <button onclick="googleLogin()">Login with Google</button>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <div class="card">
      <h2>📄 Resume Builder</h2>

      <input id="name" placeholder="Full Name">
      <input id="father" placeholder="Father Name">
      <input id="age" placeholder="Age">
      <input id="gender" placeholder="Gender">
      <input id="address" placeholder="Address">
      <input id="skills" placeholder="Skills">
      <input id="exp" placeholder="Experience">

      <input type="file" id="photo">

      <button onclick="generateResume()">Generate Resume</button>
      <button onclick="saveResume()">Save to Firebase</button>
    </div>

    <!-- RESUME -->
    <div class="card">
      <div id="resume"></div>
      <button onclick="downloadPDF()">Download PDF</button>
    </div>

    <!-- JOBS -->
    <div class="card">
      <h2>🎯 Jobs</h2>

      <div class="btn-row">
        <a class="google" target="_blank"
        href="https://www.google.com/search?q=jobs">Google</a>

        <a class="linkedin" target="_blank"
        href="https://www.linkedin.com/jobs">LinkedIn</a>
      </div>

    </div>

    <!-- PREMIUM -->
    <div class="card">
      <h2>💎 Premium ₹200</h2>

      <img width="150"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV&am=200&cu=INR">

      <input id="utr" placeholder="Enter UTR">
      <button onclick="submitPayment()">Submit Payment</button>
    </div>

  </div>

</div>

<script>

// Firebase config
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

// LOGIN
function googleLogin(){
  let provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .then(result=>{
    currentUser = result.user;
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  });
}

// RESUME
function generateResume(){

  let name = document.getElementById("name").value;
  let father = document.getElementById("father").value;
  let age = document.getElementById("age").value;
  let gender = document.getElementById("gender").value;
  let address = document.getElementById("address").value;
  let skills = document.getElementById("skills").value;
  let exp = document.getElementById("exp").value;

  document.getElementById("resume").innerHTML = `
  <div id="resumeContent" class="resume">

    <div class="center">
      <h2>${name}</h2>
      <p>${address}</p>
    </div>

    <p><b>Father:</b> ${father}</p>
    <p><b>Age:</b> ${age}</p>
    <p><b>Gender:</b> ${gender}</p>
    <p><b>Skills:</b> ${skills}</p>
    <p><b>Experience:</b> ${exp}</p>

    <h3>Declaration</h3>
    <p>I declare all information is true.</p>

  </div>`;
}

// SAVE FIREBASE
function saveResume(){
  db.collection("resumes").add({
    user: currentUser.email,
    name: document.getElementById("name").value
  });

  alert("Saved to Firebase ✔");
}

// PDF
function downloadPDF(){
  let el=document.getElementById("resumeContent");
  if(!el){alert("Generate first");return;}
  html2pdf().from(el).save("resume.pdf");
}

// PAYMENT
function submitPayment(){
  db.collection("payments").add({
    user: currentUser.email,
    utr: document.getElementById("utr").value,
    status:"pending"
  });

  alert("Payment submitted");
}

</script>

</body>
</html>
