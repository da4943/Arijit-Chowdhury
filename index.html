<!DOCTYPE html>
<html>
<title>AI Job Portal</title>
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #0f172a;
      color: white;
    }

    header {
      background: #1e293b;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #38bdf8;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    .btn {
      background: #38bdf8;
      color: black;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }

    .btn:hover {
      background: #0ea5e9;
    }
  </style>
</head>

<body>

<header>
  <h1>AI Job Portal</h1>
  <p>Find latest AI jobs easily</p>
</header>

<div class="container">

  <div class="card">
    <h2>🔥 AI Developer Job</h2>
    <p>Remote job - $3000/month</p>
    <a class="btn" href="#">Apply</a>
  </div>

  <div class="card">
    <h2>💼 Freelance AI Project</h2>
    <p>Build chatbots & automation tools</p>
    <a class="btn" href="#">Start</a>
  </div>

  <div class="card">
    <h2>💰 Premium Membership</h2>
    <p>Get exclusive AI job alerts</p>
    <a class="btn" href="#">Subscribe</a>
  </div>

</div>

</body>
</html>
