<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBpJQ44k1gokp3sSZggyESC7HpvqssClEE",
      authDomain: "aov-ai-jobs-c697d.firebaseapp.com",
      projectId: "aov-ai-jobs-c697d",
      storageBucket: "aov-ai-jobs-c697d.appspot.com",
      messagingSenderId: "898401199585",
      appId: "1:898401199585:web:59e6fdeba0568d6255dea0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.firebaseReady = true;
    window.firebaseAuth = auth;
    window.firebaseLogin = signInWithEmailAndPassword;
    window.firebaseSignup = createUserWithEmailAndPassword;
    window.firebaseLogout = signOut;
    window.firebaseOnAuth = onAuthStateChanged;
  </script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#050816,#0b1220);
      color:white;
    }
    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      background:#0f172a;
    }
    .logo{font-size:20px;font-weight:bold;color:#38bdf8;}
    .social button{
      margin-left:10px;
      padding:10px 14px;
      border-radius:8px;
      border:none;
      font-weight:bold;
      cursor:pointer;
    }
    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}
    .container{max-width:1000px;margin:auto;padding:15px;}
    .hero{text-align:center;padding:25px;}
    .hero h1{font-size:28px;color:#38bdf8;}
    .card{background:#111827;padding:20px;margin-top:15px;border-radius:15px;}
    input,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;}
    button{background:#38bdf8;font-weight:bold;cursor:pointer;}
    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}
    .resume-box{background:white;color:black;padding:20px;border-radius:12px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
    @media(max-width:768px){.grid{grid-template-columns:1fr}}
    .modal{
      display:none;position:fixed;top:0;left:0;
      width:100%;height:100%;
      background:rgba(0,0,0,0.7);
    }
    .modal-box{
      width:300px;margin:100px auto;
      background:#111827;padding:20px;border-radius:12px;
    }
  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>
  <div class="social">
    <button onclick="openLogin()">Login</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1>Create Professional Resume in Seconds</h1>
    <p id="userStatus">Not logged in</p>
  </div>

  <div class="card">
    <input id="txn" placeholder="Enter Payment ID / Email">
    <button onclick="verifyPayment()">Activate Premium</button>
  </div>

  <div class="card">
    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="qualification" placeholder="Qualification">
    </div>

    <input id="experience" placeholder="Experience">
    <input id="skills" placeholder="Skills">
    <input id="about" placeholder="About You">

    <input type="file" id="photoUpload">

    <button onclick="generate()">Generate Resume</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
  </div>

  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<div class="modal" id="loginModal">
  <div class="modal-box">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
    <button onclick="closeLogin()">Close</button>
  </div>
</div>

<script>

let photoData="";
let resumeBox=null;

/* WAIT FOR FIREBASE */
function waitFirebase(callback){
  if(window.firebaseReady){callback();}
  else setTimeout(()=>waitFirebase(callback),500);
}

/* LOGIN UI */
function openLogin(){document.getElementById("loginModal").style.display="block";}
function closeLogin(){document.getElementById("loginModal").style.display="none";}

/* AUTH */
function login(){
  waitFirebase(async ()=>{
    try{
      await firebaseLogin(firebaseAuth,email.value,password.value);
      alert("Login Success");
      closeLogin();
    }catch(e){alert(e.message);}
  });
}

function signup(){
  waitFirebase(async ()=>{
    try{
      await firebaseSignup(firebaseAuth,email.value,password.value);
      alert("Account Created");
      closeLogin();
    }catch(e){alert(e.message);}
  });
}

function logout(){
  waitFirebase(async ()=>{
    await firebaseLogout(firebaseAuth);
    alert("Logged out");
  });
}

/* AUTH STATE */
waitFirebase(()=>{
  firebaseOnAuth(firebaseAuth,(user)=>{
    document.getElementById("userStatus").innerText =
      user ? "Logged in: "+user.email : "Not logged in";
  });
});

/* PHOTO */
document.getElementById("photoUpload").onchange=e=>{
  if(!e.target.files.length) return;
  const r=new FileReader();
  r.onload=()=>photoData=r.result;
  r.readAsDataURL(e.target.files[0]);
};

/* GENERATE */
function generate(){
  document.getElementById("resume").innerHTML=`
    <div class="resume-box" id="resumeBox">
      <center>
        ${photoData?`<img src="${photoData}" width="100" style="border-radius:50%">`:""}
        <h2>${name.value || ""}</h2>
        <p>${qualification.value || ""}</p>
      </center>
      <hr>
      <p>${experience.value || ""}</p>
      <p>${skills.value || ""}</p>
      <p>${about.value || ""}</p>
    </div>
  `;
  resumeBox=document.getElementById("resumeBox");
}

/* PDF */
function downloadPDF(){
  if(!resumeBox){alert("Generate first");return;}
  html2pdf().from(resumeBox).save("resume.pdf");
}

/* PAYMENT */
function verifyPayment(){
  if(!txn.value){alert("Enter Payment ID");return;}
  localStorage.setItem("premium","yes");
  alert("Premium Activated ✔");
}

</script>

</body>
</html>
