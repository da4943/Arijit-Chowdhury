<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <!-- ICON -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- PAYPAL SDK (LIVE) -->
  <script src="https://www.paypal.com/sdk/js?client-id=ATxSvTwRQxtN5NBu5Kj8GAjZCDRzCpb_aoO_L_vB9IAF-p179MOTDCtUhVEYGG1B-2P-n47P6BL4B&currency=USD"></script>

  <style>
    body{margin:0;font-family:Arial;background:linear-gradient(135deg,#050816,#0b1220);color:white;}
    .nav{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#0f172a;}
    .logo{font-size:20px;font-weight:bold;color:#38bdf8;}
    .social{display:flex;align-items:center;gap:10px;}
    .social button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}

    .container{max-width:1000px;margin:auto;padding:15px;}
    .hero{text-align:center;padding:25px;}
    .hero h1{font-size:28px;color:#38bdf8;}
    .card{background:#111827;padding:20px;margin-top:15px;border-radius:15px;}

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
    }

    button{background:#38bdf8;font-weight:bold;cursor:pointer;}
    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}

    .resume-box{background:white;color:black;padding:20px;border-radius:12px;}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
    @media(max-width:768px){.grid{grid-template-columns:1fr}}
  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>

  <div class="social">
    <button>Login</button>
    <button>Logout</button>

    <button class="google">
      <i class="bi bi-google"></i> Google
    </button>

    <button class="linkedin">
      <i class="bi bi-linkedin"></i> LinkedIn
    </button>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1>Create Professional Resume in Seconds</h1>
    <p id="userStatus">Not logged in</p>
  </div>

  <!-- PREMIUM -->
  <div class="card">
    <h2>💎 Unlock Premium ($20 One-Time)</h2>
    <p>Secure PayPal payment</p>

    <div id="paypal-button-container"></div>
  </div>

  <!-- BUILDER -->
  <div class="card">
    <h2>Resume Builder</h2>

    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="age" placeholder="Age">
      <input id="qualification" placeholder="Qualification">
      <input id="experience" placeholder="Experience">
    </div>

    <input id="skills" placeholder="Skills">
    <input id="hobbies" placeholder="Hobbies">
    <input id="about" placeholder="About You">

    <input type="file" id="photoUpload">

    <button onclick="generate()">Generate Resume</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
    <button onclick="downloadImage()">Download Image</button>
    <button class="btn-clear" onclick="clearData()">Clear Data</button>
  </div>

  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<script>

let photoData="";
let resumeBox=null;

/* PAYPAL ONE-TIME PAYMENT */
paypal.Buttons({

  createOrder: function(data, actions) {
    return actions.order.create({
      purchase_units: [{
        amount: {
          value: '20'
        }
      }]
    });
  },

  onApprove: function(data, actions) {
    return actions.order.capture().then(function() {

      alert("Payment Successful ✔ Premium Activated");

      localStorage.setItem("premium","yes");

    });
  }

}).render('#paypal-button-container');


/* PHOTO */
photoUpload.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>photoData=r.result;
  r.readAsDataURL(e.target.files[0]);
};

/* GENERATE */
function generate(){
  document.getElementById("resume").innerHTML=`
    <div class="resume-box" id="resumeBox">
      <center>
        ${photoData?`<img src="${photoData}" width="100" style="border-radius:50%">`:""}
        <h2>${name.value}</h2>
        <p>${qualification.value}</p>
      </center>
      <hr>
      <p>${experience.value}</p>
      <p>${skills.value}</p>
      <p>${about.value}</p>
    </div>
  `;
  resumeBox=document.getElementById("resumeBox");
}

/* DOWNLOAD PDF */
function downloadPDF(){
  if(localStorage.getItem("premium")!=="yes"){
    alert("Premium required");
    return;
  }
  html2pdf().from(resumeBox).save("resume.pdf");
}

/* DOWNLOAD IMAGE */
function downloadImage(){
  html2canvas(resumeBox).then(c=>{
    let a=document.createElement("a");
    a.download="resume.png";
    a.href=c.toDataURL();
    a.click();
  });
}

/* CLEAR */
function clearData(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  document.getElementById("resume").innerHTML="";
  resumeBox=null;
}

</script>

</body>
</html>
