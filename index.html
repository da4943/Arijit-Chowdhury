<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
    }

    header {
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      color: #38bdf8;
    }

    p {
      color: #cbd5e1;
    }

    .search {
      margin-top: 20px;
      padding: 14px;
      width: 60%;
      border-radius: 12px;
      border: none;
      font-size: 16px;
    }

    .btn {
      background: #38bdf8;
      color: black;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
      font-weight: bold;
    }

    .container {
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      padding: 20px;
      border-radius: 15px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .job-title {
      margin: 0;
    }

    .job-type {
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>AOV AI Jobs</h1>
  <p>AI-powered job discovery platform for everyone</p>

  <input id="jobSearch" class="search" type="text" placeholder="Search AI jobs..." onkeyup="searchJobs()">

  <br>
  <a class="btn" href="#">Get Started</a>
</header>

<div class="container" id="jobContainer">
</div>

<script>
const jobs = [
  {
    title: "AI Developer",
    description: "Work on AI models and automation",
    type: "Remote - Full Time"
  },
  {
    title: "Freelance Chatbot Builder",
    description: "Build chatbots for clients",
    type: "Freelance"
  },
  {
    title: "AI Data Analyst",
    description: "Analyze AI datasets and trends",
    type: "Remote"
  },
  {
    title: "Machine Learning Intern",
    description: "Learn and assist ML projects",
    type: "Internship"
  }
];

function displayJobs(filteredJobs) {
  const container = document.getElementById("jobContainer");
  container.innerHTML = "";

  filteredJobs.forEach(job => {
    container.innerHTML += `
      <div class="card">
        <h2 class="job-title">${job.title}</h2>
        <p>${job.description}</p>
        <p class="job-type">${job.type}</p>
        <a class="btn" href="#">Apply</a>
      </div>
    `;
  });
}

function searchJobs() {
  let input = document.getElementById("jobSearch").value.toLowerCase();

  let filtered = jobs.filter(job =>
    job.title.toLowerCase().includes(input) ||
    job.description.toLowerCase().includes(input)
  );

  displayJobs(filtered);
}

// Load all jobs initially
displayJobs(jobs);
</script>

</body>
</html>
