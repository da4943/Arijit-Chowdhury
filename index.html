<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Jobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
    }

    header {
      padding: 50px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      color: #38bdf8;
    }

    .search {
      width: 80%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: none;
      font-size: 15px;
    }

    .btn {
      background: #38bdf8;
      color: black;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      display: inline-block;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      border: none;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.85);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .qr {
      width: 200px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .small {
      font-size: 12px;
      color: #94a3b8;
    }

    .job-type {
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>AOV AI Jobs</h1>
  <p>AI Job + Resume + Payment System</p>

  <input id="jobSearch" class="search" type="text" placeholder="Search jobs..." onkeyup="searchJobs()">

  <div class="container" id="jobContainer"></div>

  <input id="userSkill" class="search" type="text" placeholder="Enter your skill">

  <button class="btn" onclick="matchJobs()">Find Best Jobs</button>
</header>

<!-- JOBS + RESUME -->
<div class="container">

  <!-- RESUME FORM -->
  <div class="card">
    <h2>📄 Create AI Resume</h2>

    <input id="name" class="search" placeholder="Full Name">
    <input id="father" class="search" placeholder="Father Name">
    <input id="email" class="search" placeholder="Email">
    <input id="phone" class="search" placeholder="Phone">
    <input id="skills" class="search" placeholder="Skills">
    <input id="education" class="search" placeholder="Education">

    <button class="btn" onclick="payNow()">Pay ₹49 & Create Resume</button>

    <!-- QR -->
    <img class="qr"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=49&cu=INR">

    <p class="small">Scan to Pay (Google Pay / PhonePe / Paytm)</p>
  </div>

</div>

<script>
const jobs = [
  {title:"AI Developer", description:"Work on AI models", link:"https://www.linkedin.com/jobs/search/?keywords=ai%20developer"},
  {title:"ML Intern", description:"Assist ML projects", link:"https://www.linkedin.com/jobs/search/?keywords=ml%20intern"},
  {title:"Chatbot Developer", description:"Build bots", link:"https://www.google.com/search?q=chatbot+jobs"}
];

// show jobs
function showJobs(list){
  let c = document.getElementById("jobContainer");
  c.innerHTML = "";
  list.forEach(j=>{
    c.innerHTML += `
      <div class="card">
        <h3>${j.title}</h3>
        <p class="job-type">${j.description}</p>
        <a class="btn" target="_blank" href="${j.link}">Apply</a>
      </div>
    `;
  });
}
showJobs(jobs);

// search
function searchJobs(){
  let v = document.getElementById("jobSearch").value.toLowerCase();
  let f = jobs.filter(j => j.title.toLowerCase().includes(v));
  showJobs(f.length ? f : jobs);
}

// match
function matchJobs(){
  let s = document.getElementById("userSkill").value.toLowerCase();
  let f = jobs.filter(j => j.title.toLowerCase().includes(s));
  showJobs(f);
}

// payment
function payNow(){
  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let skills = document.getElementById("skills").value;

  if(!name || !email || !skills){
    alert("Fill all required fields");
    return;
  }

  alert("Opening UPI payment...");

  window.location.href =
    "upi://pay?pa=9975076459@mbk&pn=AOV%20AI%20Jobs&am=49&cu=INR";
}
</script>

</body>
</html>
