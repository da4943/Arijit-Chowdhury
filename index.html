<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <script src="https://www.paypal.com/sdk/js?client-id=ATxSvTwRQxtN5NBu5Kj8GAjZCDRzCpb_aoO_L_vB9IAF-p179MOTDCtUhVEYGG1B-2P-n47P6BL4B&currency=USD"></script>

  <style>
    body{margin:0;font-family:Arial;background:linear-gradient(135deg,#050816,#0b1220);color:white;}
    .nav{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#0f172a;}
    .logo{font-size:20px;font-weight:bold;color:#38bdf8;}
    .social{display:flex;align-items:center;gap:10px;}
    .social button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}
    .container{max-width:1000px;margin:auto;padding:15px;}
    .hero{text-align:center;padding:25px;}
    .hero h1{font-size:28px;color:#38bdf8;}
    .card{background:#111827;padding:20px;margin-top:15px;border-radius:15px;}

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
    }

    button{background:#38bdf8;font-weight:bold;cursor:pointer;}
    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}

    .resume-box{background:white;color:black;padding:20px;border-radius:12px;}

    /* 🔥 NEW BUILDER UI */
    .builder-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .builder-card{
      background:#0b1220;
      padding:15px;
      border-radius:12px;
      border:1px solid #1f2937;
    }

    .builder-title{
      font-size:18px;
      color:#38bdf8;
      margin-bottom:10px;
    }

    @media(max-width:768px){
      .builder-grid{grid-template-columns:1fr}
    }

  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>
  <div class="social">
    <button>Login</button>
    <button>Logout</button>
    <button class="google"><i class="bi bi-google"></i> Google</button>
    <button class="linkedin"><i class="bi bi-linkedin"></i> LinkedIn</button>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1>Create Professional Resume in Seconds</h1>
    <p id="userStatus">Not logged in</p>
  </div>

  <!-- PREMIUM (UNCHANGED) -->
  <div class="card">
    <h2>💎 Premium ₹200</h2>
    <div id="paypal-button-container"></div>
  </div>

  <!-- ✅ RESUME BUILDER REDESIGN -->
  <div class="card">
    <h2>Resume Builder</h2>

    <div class="builder-grid">

      <div class="builder-card">
        <div class="builder-title">Personal Info</div>
        <input id="name" placeholder="Full Name">
        <input id="father" placeholder="Father Name">
        <input id="phone" placeholder="Phone Number">
        <input id="email" placeholder="Email ID">
      </div>

      <div class="builder-card">
        <div class="builder-title">Address & Education</div>
        <input id="age" placeholder="Age">
        <input id="address" placeholder="Full Address">
        <input id="qualification" placeholder="Qualification">
        <input id="experience" placeholder="Experience">
      </div>

      <div class="builder-card">
        <div class="builder-title">Skills & Hobbies</div>
        <input id="skills" placeholder="Skills (comma separated)">
        <input id="hobbies" placeholder="Hobbies">
      </div>

      <div class="builder-card">
        <div class="builder-title">About</div>
        <input id="about" placeholder="About You">
      </div>

    </div>

    <button onclick="generate()">Generate Resume</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
    <button class="btn-clear" onclick="clearData()">Clear Data</button>
  </div>

  <div class="card">
    <div id="resume"></div>
  </div>

</div>

<script>

let resumeBox=null;

/* PAYPAL (UNCHANGED FUNCTIONALITY) */
paypal.Buttons({
  createOrder:(data,actions)=>{
    return actions.order.create({
      purchase_units:[{amount:{value:"200"}}]
    });
  },
  onApprove:(data,actions)=>{
    return actions.order.capture().then(()=>{
      alert("Payment Success ✔");
      localStorage.setItem("premium","yes");
    });
  }
}).render('#paypal-button-container');

/* GENERATE UPDATED */
function generate(){
  document.getElementById("resume").innerHTML=`
    <div class="resume-box">
      <h2>${name.value}</h2>
      <p><b>Father:</b> ${father.value}</p>
      <p><b>Phone:</b> ${phone.value}</p>
      <p><b>Email:</b> ${email.value}</p>
      <p><b>Address:</b> ${address.value}</p>
      <hr>
      <p><b>Qualification:</b> ${qualification.value}</p>
      <p><b>Experience:</b> ${experience.value}</p>
      <p><b>Skills:</b> ${skills.value}</p>
      <p><b>Hobbies:</b> ${hobbies.value}</p>
      <p><b>About:</b> ${about.value}</p>
    </div>
  `;
  resumeBox=document.querySelector(".resume-box");
}

/* PDF */
function downloadPDF(){
  if(!resumeBox){alert("Generate first");return;}
  html2pdf().from(resumeBox).save("resume.pdf");
}

/* CLEAR */
function clearData(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  document.getElementById("resume").innerHTML="";
  resumeBox=null;
}

</script>

</body>
</html>
