<!DOCTYPE html>
<html>
<head>
  <title>AOV AI Resume PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- PAYPAL -->
  <script src="https://www.paypal.com/sdk/js?client-id=ATxSvTwRQxtN5NBu5Kj8GAjZCDRzCpb_aoO_L_vB9IAF-p179MOTDCtUhVEYGG1B-2P-n47P6BL4B&currency=USD"></script>

  <style>
    body{margin:0;font-family:Arial;background:linear-gradient(135deg,#050816,#0b1220);color:white;}
    .nav{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#0f172a;}
    .logo{font-size:20px;font-weight:bold;color:#38bdf8;}
    .social{display:flex;align-items:center;gap:10px;}
    .social button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
    .google{background:white;color:black}
    .linkedin{background:#0a66c2;color:white}
    .container{max-width:1000px;margin:auto;padding:15px;}
    .hero{text-align:center;padding:25px;}
    .hero h1{font-size:28px;color:#38bdf8;}
    .card{background:#111827;padding:20px;margin-top:15px;border-radius:15px;}
    input,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;}
    button{background:#38bdf8;font-weight:bold;cursor:pointer;}
    .btn-pdf{background:#f59e0b}
    .btn-clear{background:#ef4444}
    .resume-box{background:white;color:black;padding:20px;border-radius:12px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
    @media(max-width:768px){.grid{grid-template-columns:1fr}}
    .admin{display:none;background:#1f2937;padding:10px;margin-top:10px;border-radius:10px;}
  </style>
</head>

<body>

<div class="nav">
  <div class="logo">AOV AI Resume</div>
  <div class="social">
    <button onclick="toggleAdmin()">Admin</button>
    <button onclick="logout()">Logout</button>

    <button class="google"><i class="bi bi-google"></i> Google</button>
    <button class="linkedin"><i class="bi bi-linkedin"></i> LinkedIn</button>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1>Create Professional Resume in Seconds</h1>
    <p id="userStatus">Not logged in</p>
  </div>

  <!-- PAYMENT -->
  <div class="card">
    <h2>💎 Premium ₹200</h2>
    <p id="paymentBox">Loading payment option...</p>
  </div>

  <!-- BUILDER -->
  <div class="card">
    <h2>Resume Builder</h2>

    <div class="grid">
      <input id="name" placeholder="Full Name">
      <input id="age" placeholder="Age">
      <input id="qualification" placeholder="Qualification">
      <input id="experience" placeholder="Experience">
    </div>

    <input id="skills" placeholder="Skills">
    <input id="about" placeholder="About You">

    <button onclick="generate()">Generate Resume</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
  </div>

  <div class="card">
    <div id="resume"></div>
  </div>

  <!-- ADMIN PANEL (HIDDEN) -->
  <div class="admin" id="adminPanel">
    <h3>Admin Panel</h3>
    <div id="users"></div>
  </div>

</div>

<script>

const ADMIN_EMAIL = "yourmail@gmail.com"; // 🔴 CHANGE THIS

let resumeBox=null;

/* COUNTRY CHECK */
async function loadPayment(){
  let res = await fetch("https://ipapi.co/json/");
  let data = await res.json();

  if(data.country_code === "IN"){
    document.getElementById("paymentBox").innerHTML = `
      <img width="200" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay">
      <p>Scan UPI QR (India)</p>
    `;
  } else {
    showPayPal();
  }
}

/* PAYPAL */
function showPayPal(){
  document.getElementById("paymentBox").innerHTML = `<div id="paypal"></div>`;

  paypal.Buttons({
    createOrder: (data, actions)=>{
      return actions.order.create({
        purchase_units:[{amount:{value:"20"}}]
      });
    },
    onApprove: async(data, actions)=>{
      await actions.order.capture();

      alert("Payment Success");

      let user = firebaseAuth.currentUser;
      if(user){
        await setDoc(doc(db,"payments",user.uid),{
          email:user.email,
          status:"paid",
          time:Date.now()
        });
      }
    }
  }).render("#paypal");
}

/* ADMIN PANEL */
function toggleAdmin(){
  let user = firebaseAuth.currentUser;

  if(user && user.email === ADMIN_EMAIL){
    document.getElementById("adminPanel").style.display="block";
    loadUsers();
  } else {
    alert("Not authorized");
  }
}

async function loadUsers(){
  const snap = await getDocs(collection(db,"payments"));
  let html = "";
  snap.forEach(d=>{
    html += `<p>${d.data().email} - ${d.data().status}</p>`;
  });
  document.getElementById("users").innerHTML = html;
}

/* RESUME */
function generate(){
  document.getElementById("resume").innerHTML=`
    <div class="resume-box">
      <h2>${name.value}</h2>
      <p>${qualification.value}</p>
      <p>${experience.value}</p>
      <p>${skills.value}</p>
    </div>`;
  resumeBox=document.querySelector(".resume-box");
}

function downloadPDF(){
  if(!resumeBox){alert("Generate first");return;}
  html2pdf().from(resumeBox).save();
}

/* INIT */
loadPayment();

</script>

</body>
</html>
