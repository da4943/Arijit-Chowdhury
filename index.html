<!DOCTYPE html>
<html>
<head>
  <title>AOV Resume PRO FIX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:#0b1220;color:white}
    .card{padding:20px;background:#111827;margin:10px;border-radius:10px}
    .hidden{display:none}
    input,button{width:100%;padding:10px;margin-top:8px;border-radius:6px;border:none}
    button{cursor:pointer;background:#38bdf8;font-weight:bold}
    .resume-box{background:white;color:black;padding:20px;border-radius:10px}
  </style>
</head>

<body>

<div class="card" id="loginBox">
  <h2>Login Required</h2>
  <button onclick="login()">Login with Google</button>
</div>

<div class="card hidden" id="form">

  <input id="name" placeholder="Name">
  <input id="age" placeholder="Age">
  <input id="qualification" placeholder="Qualification">
  <input id="experience" placeholder="Experience">
  <input id="skills" placeholder="Skills">
  <input id="about" placeholder="About">
  <input id="photo" placeholder="Photo URL">
  <input id="declaration" placeholder="Declaration">
  <input id="signature" placeholder="Signature">

  <button onclick="generate()">Generate Resume</button>
  <button onclick="save()">Save</button>
  <button onclick="downloadPDF()">Download PDF</button>
</div>

<div class="card">
  <div id="resume"></div>
</div>

<script>

/* 🔴 ONLY REPLACE THIS PART WITH YOUR FIREBASE DATA */
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};

/* INIT */
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let user = null;

/* UI */
function showLogin(){
  document.getElementById("loginBox").style.display="block";
  document.getElementById("form").classList.add("hidden");
}

function showApp(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("form").classList.remove("hidden");
}

/* AUTH */
auth.onAuthStateChanged((u)=>{
  if(u){
    user = u;
    showApp();
  } else {
    user = null;
    showLogin();
  }
});

/* LOGIN FIXED */
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithRedirect(provider);
}

/* REDIRECT HANDLER */
auth.getRedirectResult()
.then((result)=>{
  if(result.user){
    user = result.user;
    showApp();
  }
})
.catch(console.error);

/* GENERATE */
function generate(){

  const data = {
    name: name.value,
    age: age.value,
    qualification: qualification.value,
    experience: experience.value,
    skills: skills.value,
    about: about.value,
    photo: photo.value,
    declaration: declaration.value,
    signature: signature.value
  };

  document.getElementById("resume").innerHTML = `
    <div class="resume-box" id="resumeBox">
      <center>
        <img src="${data.photo}" width="90" style="border-radius:50%">
        <h2>${data.name}</h2>
      </center>

      <p><b>Age:</b> ${data.age}</p>
      <p><b>Qualification:</b> ${data.qualification}</p>
      <p><b>Experience:</b> ${data.experience}</p>
      <p><b>Skills:</b> ${data.skills}</p>
      <p><b>About:</b> ${data.about}</p>

      <hr>

      <p><b>Declaration:</b> ${data.declaration}</p>
      <p><b>Signature:</b> ${data.signature}</p>
      <p><b>Date:</b> ${new Date().toLocaleDateString()}</p>
    </div>
  `;
}

/* SAVE */
function save(){
  if(!user) return alert("Login first");

  db.collection("resumes").add({
    name: name.value,
    email: user.email,
    createdAt: Date.now()
  });

  alert("Saved ✔");
}

/* PDF */
function downloadPDF(){
  const el = document.getElementById("resumeBox");
  if(!el) return alert("Generate first");

  html2pdf().from(el).save("resume.pdf");
}

</script>

</body>
</html>
